<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"
  >
  <meta name="theme-color" content="#101328">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Thumb Arena">
  <title>Thumb Arena</title>

  <style>
    :root {
      --bg: #101328;
      --bg2: #25194d;
      --panel: rgba(40, 44, 85, 0.96);
      --panel-light: rgba(255, 255, 255, 0.09);
      --line: rgba(255, 255, 255, 0.14);
      --text: #f8f9ff;
      --muted: #bcc3e7;
      --cyan: #57e5ff;
      --pink: #ff6e97;
      --green: #90ff6b;
      --gold: #ffd35f;
      --purple: #ad7dff;
      --orange: #ff9f5a;
      --danger: #ff5372;
      --safe-top: max(12px, env(safe-area-inset-top));
      --safe-bottom: max(12px, env(safe-area-inset-bottom));
      --shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #060713;
      color: var(--text);
      font-family: ui-rounded, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 560px;
      margin: 0 auto;
      overflow: hidden;
      background:
        radial-gradient(circle at 12% 10%, rgba(87, 229, 255, 0.17), transparent 30%),
        radial-gradient(circle at 90% 22%, rgba(173, 125, 255, 0.18), transparent 30%),
        linear-gradient(155deg, var(--bg), var(--bg2));
    }

    #app::before,
    #app::after {
      position: absolute;
      z-index: 0;
      width: 175px;
      height: 175px;
      content: "";
      border-radius: 50%;
      opacity: 0.16;
      pointer-events: none;
      filter: blur(3px);
      animation: floatBlob 9s ease-in-out infinite;
    }

    #app::before {
      top: -76px;
      left: -76px;
      background: var(--cyan);
    }

    #app::after {
      right: -75px;
      bottom: -75px;
      background: var(--purple);
      animation-delay: -4s;
    }

    @keyframes floatBlob {
      50% {
        transform: translate(17px, 16px) scale(1.08);
      }
    }

    .screen {
      position: absolute;
      z-index: 2;
      inset: 0;
      display: none;
      overflow-x: hidden;
      overflow-y: auto;
      padding: var(--safe-top) 18px var(--safe-bottom);
    }

    .screen.active {
      display: flex;
      flex-direction: column;
      animation: screenIn 0.24s ease both;
    }

    @keyframes screenIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .center {
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .console-shell {
      display: flex;
      width: min(370px, 100%);
      min-height: 310px;
      padding: 30px 22px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 2px solid rgba(255, 255, 255, 0.16);
      border-radius: 36px;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.03)),
        #575b74;
      box-shadow: inset 0 3px 2px rgba(255, 255, 255, 0.18), var(--shadow);
    }

    .brand {
      margin: 0;
      font-size: clamp(2.65rem, 14vw, 4.8rem);
      line-height: 0.86;
      letter-spacing: -0.1em;
      text-shadow: 0 5px 0 rgba(0, 0, 0, 0.18);
    }

    .brand span {
      color: var(--cyan);
    }

    .tagline {
      margin: 14px 0 28px;
      color: var(--muted);
    }

    .disc {
      display: grid;
      width: 132px;
      height: 132px;
      margin-bottom: 25px;
      place-items: center;
      border: 10px solid #282b43;
      border-radius: 50%;
      color: #17182b;
      font-size: 2rem;
      background:
        radial-gradient(circle at center, #242740 0 14%, transparent 15%),
        repeating-conic-gradient(
          #ff6e97 0 36deg,
          #ffd35f 36deg 72deg,
          #57e5ff 72deg 108deg,
          #ad7dff 108deg 144deg,
          #90ff6b 144deg 180deg
        );
      box-shadow: 0 13px 22px rgba(0, 0, 0, 0.35), inset 0 0 0 2px rgba(255, 255, 255, 0.4);
      animation: spinDisc 8s linear infinite;
    }

    @keyframes spinDisc {
      to {
        transform: rotate(360deg);
      }
    }

    .btn {
      width: 100%;
      min-height: 54px;
      padding: 13px 16px;
      border-radius: 18px;
      color: #13152a;
      font-weight: 950;
      letter-spacing: 0.04em;
      background: var(--cyan);
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.22), 0 12px 21px rgba(0, 0, 0, 0.18);
      transition: transform 0.12s ease, filter 0.12s ease;
    }

    .btn:active {
      transform: translateY(4px);
      filter: brightness(0.92);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.22);
    }

    .btn.secondary {
      color: #242644;
      background: #f0f2ff;
    }

    .btn.dark {
      color: var(--text);
      background: #3a3e69;
    }

    .btn.green {
      color: #112715;
      background: var(--green);
    }

    .btn.warn {
      color: #37101d;
      background: var(--pink);
    }

    .btn-row {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .btn-row .btn {
      flex: 1;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .topbar h2,
    .topbar p {
      margin: 0;
    }

    .topbar h2 {
      font-size: 1.3rem;
      letter-spacing: -0.04em;
    }

    .topbar p {
      margin-top: 3px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .icon-btn {
      display: grid;
      width: 48px;
      height: 48px;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 15px;
      color: var(--text);
      font-size: 1.18rem;
      background: var(--panel);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
    }

    .card,
    .panel {
      border: 1px solid var(--line);
      border-radius: 24px;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.13), rgba(255, 255, 255, 0.035)),
        var(--panel);
      box-shadow: var(--shadow);
    }

    .card {
      min-height: 174px;
      padding: 16px;
      text-align: left;
    }

    .card.wide {
      grid-column: 1 / -1;
      min-height: 132px;
    }

    .card:active {
      transform: scale(0.98);
    }

    .card-icon {
      display: grid;
      width: 58px;
      height: 58px;
      margin-bottom: 12px;
      place-items: center;
      border-radius: 19px;
      color: #15172b;
      font-size: 1.65rem;
      box-shadow: inset 0 2px 6px rgba(255, 255, 255, 0.42);
    }

    .card h3 {
      margin: 0 0 5px;
      font-size: 1rem;
      line-height: 1.04;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.76rem;
      line-height: 1.28;
    }

    .badge {
      display: inline-block;
      margin-top: 11px;
      padding: 4px 8px;
      border-radius: 999px;
      color: #16172b;
      font-size: 0.64rem;
      font-weight: 950;
      background: #eff1ff;
    }

    .badge.green {
      background: var(--green);
    }

    .badge.gold {
      background: var(--gold);
    }

    .badge.dim {
      color: #eef0ff;
      background: #555b84;
    }

    .panel {
      padding: 18px;
    }

    .panel h3 {
      margin: 0 0 9px;
      font-size: 1.08rem;
    }

    .panel p {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.42;
    }

    .list {
      display: grid;
      gap: 10px;
    }

    .row {
      display: flex;
      min-height: 56px;
      padding: 11px 13px;
      align-items: center;
      justify-content: space-between;
      gap: 11px;
      border-radius: 16px;
      background: var(--panel-light);
    }

    .row strong,
    .row small {
      display: block;
    }

    .row small {
      margin-top: 3px;
      color: var(--muted);
    }

    .slot {
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .slot-dot {
      width: 14px;
      height: 14px;
      margin-right: 10px;
      flex: 0 0 auto;
      border: 2px solid rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      background: transparent;
    }

    .slot-dot.active {
      box-shadow: 0 0 13px rgba(144, 255, 107, 0.8);
    }

    .label {
      display: block;
      margin: 14px 0 7px;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .input {
      width: 100%;
      min-height: 50px;
      padding: 12px 13px;
      border: 1px solid var(--line);
      border-radius: 15px;
      outline: none;
      color: var(--text);
      background: #25294c;
      user-select: text;
      -webkit-user-select: text;
    }

    .numbers {
      display: flex;
      gap: 8px;
      margin: 9px 0 15px;
    }

    .number-btn {
      display: grid;
      width: 52px;
      height: 48px;
      place-items: center;
      border-radius: 15px;
      color: var(--text);
      font-weight: 950;
      background: #3d426c;
    }

    .number-btn.active {
      color: #14233a;
      background: var(--cyan);
    }

    .notice {
      margin: 14px 0;
      padding: 12px 13px;
      border: 1px solid rgba(87, 229, 255, 0.32);
      border-radius: 15px;
      color: #cdf9ff;
      font-size: 0.82rem;
      line-height: 1.42;
      background: rgba(87, 229, 255, 0.09);
    }

    .game-screen {
      overflow: hidden;
      padding: var(--safe-top) 10px var(--safe-bottom);
    }

    .hud {
      display: flex;
      min-height: 58px;
      padding: 0 4px 8px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .hud-label {
      display: block;
      color: var(--muted);
      font-size: 0.67rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .hud-value {
      display: block;
      max-width: calc(100vw - 100px);
      overflow: hidden;
      font-size: 1.1rem;
      font-weight: 1000;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .game-area {
      position: relative;
      min-height: 0;
      flex: 1;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 24px;
      touch-action: none;
      background:
        radial-gradient(circle at 20% 18%, rgba(255, 255, 255, 0.09) 0 2px, transparent 3px),
        linear-gradient(155deg, #30366a, #16182e);
      box-shadow: inset 0 0 35px rgba(0, 0, 0, 0.3);
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .target {
      position: absolute;
      z-index: 3;
      display: grid;
      width: 66px;
      height: 66px;
      place-items: center;
      transform: translate(-50%, -50%);
      border: 5px solid #fff;
      border-radius: 50%;
      color: #3a201a;
      font-size: 1.05rem;
      font-weight: 1000;
      background: var(--orange);
      box-shadow: 0 7px 0 rgba(0, 0, 0, 0.18), 0 0 20px rgba(255, 159, 90, 0.5);
      touch-action: none;
      animation: targetPulse 0.72s ease-in-out infinite alternate;
    }

    .target.gold {
      background: var(--gold);
      box-shadow: 0 7px 0 rgba(0, 0, 0, 0.18), 0 0 26px rgba(255, 211, 95, 0.78);
    }

    @keyframes targetPulse {
      to {
        transform: translate(-50%, -50%) scale(0.9);
      }
    }

    .overlay {
      position: absolute;
      z-index: 10;
      inset: 0;
      display: grid;
      padding: 20px;
      place-items: center;
      text-align: center;
      background: rgba(8, 10, 28, 0.76);
      backdrop-filter: blur(5px);
    }

    .overlay-card {
      width: min(365px, 100%);
      padding: 24px 18px;
      border: 1px solid var(--line);
      border-radius: 26px;
      background: linear-gradient(145deg, #3d4379, #24284e);
      box-shadow: var(--shadow);
    }

    .overlay-card h2 {
      margin: 0 0 8px;
      font-size: 1.65rem;
    }

    .overlay-card p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.42;
    }

    .result-screen {
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .result-card {
      width: min(430px, 100%);
      padding: 25px 18px;
      border: 1px solid var(--line);
      border-radius: 29px;
      background: linear-gradient(145deg, #3c4173, #24274b);
      box-shadow: var(--shadow);
    }

    .result-card h1 {
      margin: 0;
      font-size: 2rem;
      letter-spacing: -0.06em;
    }

    .result-card > p {
      margin: 8px 0 17px;
      color: var(--muted);
    }

    .rankings {
      display: grid;
      gap: 8px;
      margin: 15px 0 18px;
      text-align: left;
    }

    .rank {
      display: flex;
      min-height: 50px;
      padding: 10px 13px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.08);
    }

    .rank:first-child {
      border: 1px solid rgba(255, 211, 95, 0.55);
      background: rgba(255, 211, 95, 0.18);
    }

    .rank span {
      color: var(--cyan);
      font-size: 0.85rem;
      font-weight: 850;
      text-align: right;
    }

    .modal {
      position: absolute;
      z-index: 50;
      inset: 0;
      display: none;
      padding: 20px;
      align-items: center;
      justify-content: center;
      background: rgba(4, 5, 16, 0.72);
      backdrop-filter: blur(6px);
    }

    .modal.show {
      display: flex;
    }

    .modal-card {
      width: min(390px, 100%);
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 26px;
      background: #2d315b;
      box-shadow: var(--shadow);
    }

    .modal-card h3 {
      margin: 0 0 8px;
    }

    .modal-card p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.42;
    }

    #toast {
      position: absolute;
      z-index: 80;
      bottom: calc(var(--safe-bottom) + 12px);
      left: 50%;
      max-width: calc(100% - 36px);
      padding: 11px 15px;
      border-radius: 999px;
      color: #18192d;
      font-size: 0.84rem;
      font-weight: 950;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      background: #f6f7ff;
      box-shadow: var(--shadow);
      transform: translate(-50%, 130px);
      transition: opacity 0.2s ease, transform 0.25s ease;
    }

    #toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    #rotate {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: none;
      padding: 28px;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: #101328;
    }

    #rotate strong {
      display: block;
      margin-bottom: 18px;
      font-size: 4rem;
      transform: rotate(90deg);
    }

    #rotate h2 {
      margin: 0 0 8px;
    }

    #rotate p {
      margin: 0;
      color: var(--muted);
    }

    .shake {
      animation: shake 0.35s ease both;
    }

    @keyframes shake {
      0%,
      100% {
        transform: translateX(0);
      }
      20% {
        transform: translateX(-10px);
      }
      40% {
        transform: translateX(10px);
      }
      60% {
        transform: translateX(-7px);
      }
      80% {
        transform: translateX(7px);
      }
    }

    @media (orientation: landscape) and (max-height: 650px) {
      #rotate {
        display: flex;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <div id="rotate">
    <div>
      <strong>▯</strong>
      <h2>Rotate your device</h2>
      <p>Thumb Arena is designed for portrait play.</p>
    </div>
  </div>

  <script>
    "use strict";

    const PLAYER_COLORS = ["#57e5ff", "#ff6e97", "#90ff6b", "#ffd35f"];

    const BASE_GAMES = [
      {
        id: "dodge",

        icon: "☄",
        color: "#57e5ff",
        players: "SOLO",
        description: "Drag your orb. Avoid incoming hazards."
      },
      {
        id: "trail",
        title: "Trail Duel",
        icon: "〰",
        color: "#ad7dff",
        players: "PASS & PLAY",
        description: "Leave a trail. Do not crash."
      },
      {
        id: "target",
        title: "Target Rush",
        icon: "◎",
        color: "#ffd35f",
        players: "PASS & PLAY",
        description: "Tap targets before they disappear."
      },
      {
        id: "hot",

        icon: "●",

        players: "PASS & PLAY",
        description: "Pass the bomb before time runs out."
      },
      {
        id: "reflex",
        title: "Reflex Shot",
        icon: "⚡",

        players: "PASS & PLAY",

      },
      {

        color: "#ad7dff",

    const ARENA_GAMES = [
      {
        id: "dodge2",
        title: "Dodge Storm 2",
        icon: "◉",
        color: "#57e5ff",
        players: "SOLO / PASS & PLAY",
        description: "Pseudo-3D survival with HP and pickups."
      },
      {
        id: "trail2",
        title: "Trail Duel 2",
        icon: "〰",
        color: "#ad7dff",
        players: "PASS & PLAY",
        description: "Energy trails with arena hazards."
      },
      {
        id: "target2",
        title: "Target Rush 2",
        icon: "◎",
        color: "#ffd35f",
        players: "SOLO / PASS & PLAY",
        description: "Target hunt with combos and gold targets."
      },
      {
        id: "hot2",
        title: "Hot Cursor 2",
        icon: "●",
        color: "#ff6e97",
        players: "PASS & PLAY",
        description: "Core passing with speed zones."
      },
      {
        id: "reflex2",
        title: "Reflex Shot 2",
        icon: "⚡",
        color: "#90ff6b",
        players: "SOLO / PASS & PLAY",
        description: "Fast cinematic reaction rounds."
      },
      {
        id: "wheel2",
        title: "Survival Wheel 2",
        icon: "◉",
        color: "#ad7dff",
        players: "SOLO / PASS & PLAY",
        description: "Spin to select a playable Arena game."
      },
      {
        id: "quest",
        title: "Mini Quest",
        icon: "◇",
        color: "#57e5ff",
        players: "SOLO / PASS & PLAY",
        description: "Collect crystals and reach the portal."
      },
      {
        id: "brawl",
        title: "Arena Brawl",
        icon: "✦",
        color: "#ff6e97",
        players: "PASS & PLAY",
        description: "Score hits in a short knockback arena."
      },
      {
        id: "treasure",
        title: "Treasure Run",
        icon: "◆",
        color: "#ffd35f",
        players: "PASS & PLAY",
        description: "Gather treasure while dodging traps."
      },
      {
        id: "boss",
        title: "Boss Break",
        icon: "⚔",
        color: "#90ff6b",
        players: "SOLO / PASS & PLAY",
        description: "Destroy weak points before time expires."
      }
    ];

    class StorageManager {
      constructor() {
        this.key = "thumbArenaSingleDeviceV2";
        this.memoryOnly = false;
        this.data = this.load();
      }

      defaults() {
        return {
          settings: {
            sound: true,
            vibration: true,
            reducedEffects: false,
            performanceMode: "auto"
          },
          baseStats: {
            gamesPlayed: 0,
            wins: 0,
            longestSurvival: 0,
            targetRushHigh: 0,
            fastestReaction: null,
            reactionTotal: 0,
            reactionCount: 0
          },
          arenaProfile: {
            level: 1,
            xp: 0,
            wins: 0,
            gamesPlayed: 0,
            selectedTheme: "neon",
            selectedTrail: "default",
            selectedTitle: "Rookie",
            unlockedThemes: ["neon"],
            unlockedTrails: ["default"],
            unlockedEffects: ["default"],
            unlockedTitles: ["Rookie"],
            records: {
              dodgeStorm2: 0,
              trailDuel2: 0,
              targetRush2: 0,
              hotCursor2: 0,
              reflexShot2: null,
              miniQuest: 0,
              arenaBrawl: 0,
              treasureRun: 0,
              bossBreak: 0
            }
          },
          tournament: null
        };
      }

      load() {
        const defaults = this.defaults();

        try {
          const raw = localStorage.getItem(this.key);
          if (!raw) return defaults;

          const saved = JSON.parse(raw);

          return {
            ...defaults,
            ...saved,
            settings: { ...defaults.settings, ...(saved.settings || {}) },
            baseStats: { ...defaults.baseStats, ...(saved.baseStats || {}) },
            arenaProfile: {
              ...defaults.arenaProfile,
              ...(saved.arenaProfile || {}),
              records: {
                ...defaults.arenaProfile.records,
                ...((saved.arenaProfile || {}).records || {})
              }
            }
          };
        } catch {
          this.memoryOnly = true;
          return defaults;
        }
      }

      save() {
        try {
          localStorage.setItem(this.key, JSON.stringify(this.data));
        } catch {
          this.memoryOnly = true;
        }
      }

      setSetting(key, value) {
        this.data.settings[key] = value;
        this.save();
      }

      recordGame(consoleType) {
        if (consoleType === "base") {
          this.data.baseStats.gamesPlayed += 1;
        } else {
          this.data.arenaProfile.gamesPlayed += 1;
        }

        this.save();
      }

      recordWin(consoleType) {
        if (consoleType === "base") {
          this.data.baseStats.wins += 1;
        } else {
          this.data.arenaProfile.wins += 1;
        }

        this.save();
      }

      recordBaseSurvival(time) {
        this.data.baseStats.longestSurvival = Math.max(
          this.data.baseStats.longestSurvival,
          time
        );
        this.save();
      }

      recordTargetScore(score) {
        this.data.baseStats.targetRushHigh = Math.max(
          this.data.baseStats.targetRushHigh,
          score
        );
        this.save();
      }

      recordReaction(milliseconds, arena = false) {
        if (!arena) {
          const stats = this.data.baseStats;
          stats.fastestReaction = stats.fastestReaction === null
            ? milliseconds
            : Math.min(stats.fastestReaction, milliseconds);
          stats.reactionTotal += milliseconds;
          stats.reactionCount += 1;
        } else {
          const record = this.data.arenaProfile.records;
          record.reflexShot2 = record.reflexShot2 === null
            ? milliseconds
            : Math.min(record.reflexShot2, milliseconds);
        }

        this.save();
      }

      recordArenaSurvival(time) {
        this.data.arenaProfile.records.dodgeStorm2 = Math.max(
          this.data.arenaProfile.records.dodgeStorm2,
          time
        );
        this.save();
      }

      addArenaXP(amount) {
        const profile = this.data.arenaProfile;
        profile.xp += Math.max(0, Math.floor(amount));
        profile.level = Math.max(1, Math.floor(profile.xp / 100) + 1);

        if (profile.level >= 3 && !profile.unlockedEffects.includes("gold-sparks")) {
          profile.unlockedEffects.push("gold-sparks");
        }

        if (profile.level >= 5 && !profile.unlockedTitles.includes("Storm Master")) {
          profile.unlockedTitles.push("Storm Master");
        }

        if (profile.level >= 5) {
          profile.selectedTitle = "Storm Master";
        }

        this.save();
      }

      averageReaction() {
        const stats = this.data.baseStats;
        return stats.reactionCount
          ? Math.round(stats.reactionTotal / stats.reactionCount)
          : null;
      }

      resetStatistics() {
        const settings = { ...this.data.settings };
        this.data = this.defaults();
        this.data.settings = settings;
        this.save();
      }

      resetArenaProfile() {
        this.data.arenaProfile = this.defaults().arenaProfile;
        this.save();
      }
    }

    class AudioManager {
      constructor(storage) {
        this.storage = storage;
        this.context = null;
      }

      play(type = "click") {
        if (!this.storage.data.settings.sound) return;

        try {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;

          if (!this.context) {
            this.context = new AudioContextClass();
          }

          if (this.context.state === "suspended") {
            this.context.resume();
          }

          const sounds = {
            click: [480, 0.05, "sine"],
            start: [720, 0.11, "sine"],
            hit: [135, 0.16, "sawtooth"],
            win: [900, 0.16, "triangle"],
            point: [760, 0.06, "square"],
            gold: [1040, 0.09, "sine"]
          };

          const [frequency, duration, oscillatorType] = sounds[type] || sounds.click;
          const oscillator = this.context.createOscillator();
          const gain = this.context.createGain();

          oscillator.type = oscillatorType;
          oscillator.frequency.setValueAtTime(frequency, this.context.currentTime);

          gain.gain.setValueAtTime(0.075, this.context.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            0.001,
            this.context.currentTime + duration
          );

          oscillator.connect(gain).connect(this.context.destination);
          oscillator.start();
          oscillator.stop(this.context.currentTime + duration);
        } catch {}
      }

      vibrate(pattern = 16) {
        if (!this.storage.data.settings.vibration) return;

        try {
          navigator.vibrate?.(pattern);
        } catch {}
      }
    }

    class InputManager {
      attach(element, handlers = {}) {
        let active = false;
        let pointerId = null;
        let startX = 0;
        let startY = 0;

        const getPoint = event => {
          const rect = element.getBoundingClientRect();

          return {
            x: Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width)),
            y: Math.max(0, Math.min(1, (event.clientY - rect.top) / rect.height))
          };
        };

        const onDown = event => {
          event.preventDefault();
          active = true;
          pointerId = event.pointerId;

          const point = getPoint(event);
          startX = point.x;
          startY = point.y;

          element.setPointerCapture?.(pointerId);

          handlers.down?.({
            ...point,
            pressed: true,
            released: false,
            tap: false
          });
        };

        const onMove = event => {
          if (!active || event.pointerId !== pointerId) return;

          event.preventDefault();

          handlers.move?.({
            ...getPoint(event),
            pressed: true,
            released: false,
            tap: false
          });
        };

        const onUp = event => {
          if (!active || event.pointerId !== pointerId) return;

          event.preventDefault();

          const point = getPoint(event);
          active = false;

          handlers.up?.({
            ...point,
            pressed: false,
            released: true,
            tap: Math.hypot(point.x - startX, point.y - startY) < 0.04
          });
        };

        element.addEventListener("pointerdown", onDown, { passive: false });
        element.addEventListener("pointermove", onMove, { passive: false });
        element.addEventListener("pointerup", onUp, { passive: false });
        element.addEventListener("pointercancel", onUp, { passive: false });

        return () => {
          element.removeEventListener("pointerdown", onDown);
          element.removeEventListener("pointermove", onMove);
          element.removeEventListener("pointerup", onUp);
          element.removeEventListener("pointercancel", onUp);
        };
      }
    }

    class PlayerManager {

    class TournamentManager {
      constructor(storage) {
        this.storage = storage;
      }

      start(consoleType, players, totalRounds) {
        this.storage.data.tournament = {
          consoleType,
          totalRounds,
          currentRound: 1,
          players: players.map(player => ({
            id: player.id,
            name: player.name,
            color: player.color,
            points: 0
          })),
          gameHistory: []
        };

        this.storage.save();
      }

      get active() {
        return this.storage.data.tournament;
      }

      clear() {
        this.storage.data.tournament = null;
        this.storage.save();
      }

      award(results) {
        const tournament = this.active;
        if (!tournament) return null;

        const points = [5, 3, 2, 1];

        results.forEach((result, index) => {
          const player = tournament.players.find(item => item.id === result.playerId);

          if (player) {
            player.points += points[index] || 0;
          }
        });

        const finalRound = tournament.currentRound >= tournament.totalRounds;

        if (!finalRound) {
          tournament.currentRound += 1;
        }

        this.storage.save();

        return {
          finalRound,
          standings: [...tournament.players].sort((a, b) => b.points - a.points),
          awarded: results.map((result, index) => ({
            ...result,
            tournamentPoints: points[index] || 0
          }))
        };
      }

      nextGame(pool) {
        const tournament = this.active;
        const eligible = pool.filter(game => !["wheel", "wheel2"].includes(game.id));
        const unused = eligible.filter(game => !tournament.gameHistory.includes(game.id));
        const choices = unused.length ? unused : eligible;
        const game = choices[Math.floor(Math.random() * choices.length)];

        tournament.gameHistory.push(game.id);
        this.storage.save();

        return game;
      }
    }

    class UIManager {
      constructor(app, storage, audio, playerManager, tournamentManager, gameManager) {
        this.app = app;
        this.storage = storage;
        this.audio = audio;
        this.playerManager = playerManager;
        this.tournamentManager = tournamentManager;
        this.gameManager = gameManager;
        this.toastTimer = null;

      escape(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      render(html, className = "") {
        this.app.innerHTML = `
          <main class="screen active ${className}">
            ${html}
          </main>
          <div id="modal" class="modal"></div>
          <div id="toast"></div>
        `;
      }

      bind(selector, callback) {
        const element = this.app.querySelector(selector);
        if (element) element.addEventListener("click", callback);
        return element;
      }

      toast(message) {
        const toast = this.app.querySelector("#toast");
        if (!toast) return;

        toast.textContent = message;
        toast.classList.add("show");

        clearTimeout(this.toastTimer);

        this.toastTimer = setTimeout(() => {
          toast.classList.remove("show");
        }, 1800);
      }

      modal(title, text, confirmLabel, onConfirm, warning = false) {
        const modal = this.app.querySelector("#modal");
        if (!modal) return;

        modal.innerHTML = `
          <div class="modal-card">
            <h3>${this.escape(title)}</h3>
            <p>${this.escape(text)}</p>
            <div class="btn-row">
              <button id="modalCancel" class="btn secondary">CANCEL</button>
              <button id="modalConfirm" class="btn ${warning ? "warn" : ""}">
                ${this.escape(confirmLabel)}
              </button>
            </div>
          </div>
        `;

        modal.classList.add("show");

        modal.querySelector("#modalCancel").onclick = () => {
          modal.classList.remove("show");
        };

        modal.querySelector("#modalConfirm").onclick = () => {
          modal.classList.remove("show");
          onConfirm?.();
        };
      }

        const soloOnly = ["dodge", "dodge2"].includes(gameId);
        const multiplayerEnabled = mode === "pass" || tournament;

    class GameManager {
      constructor(storage, audio, tournamentManager) {
        this.storage = storage;
        this.audio = audio;
        this.tournamentManager = tournamentManager;
        this.ui = null;
        this.cleanup = null;
      }

      stop() {
        if (typeof this.cleanup === "function") {
          this.cleanup();
          this.cleanup = null;
        }
      }

      launch(gameId, consoleType, players, tournament = false) {
        this.stop();

        const baseWheelPool = ["dodge", "trail", "target", "hot", "reflex"];
        const arenaWheelPool = ["dodge2", "trail2", "target2", "hot2", "reflex2", "quest", "brawl", "treasure", "boss"];

        if (gameId === "wheel") {
          gameId = baseWheelPool[Math.floor(Math.random() * baseWheelPool.length)];
        }

        if (gameId === "wheel2") {
          gameId = arenaWheelPool[Math.floor(Math.random() * arenaWheelPool.length)];
        }

        if (["dodge", "dodge2"].includes(gameId)) {
          this.playDodgeStorm(gameId, consoleType, players, tournament);
          return;
        }

        if (["target", "target2"].includes(gameId)) {
          this.playTargetRush(gameId, consoleType, players, tournament);
          return;
        }

        if (["reflex", "reflex2"].includes(gameId)) {
          this.playReflexShot(gameId, consoleType, players, tournament);
          return;
        }

        if (["trail", "trail2"].includes(gameId)) {
          this.playTrailDuel(gameId, consoleType, players, tournament);
          return;
        }

        if (["hot", "hot2"].includes(gameId)) {
          this.playHotCursor(gameId, consoleType, players, tournament);
          return;
        }

        this.playObjectiveGame(gameId, consoleType, players, tournament);
      }

      finish(consoleType, gameId, title, subtitle, results, replay, tournament) {
        this.stop();

        const sorted = [...results].sort((a, b) => b.score - a.score);

        if (sorted.length) {
          this.storage.recordWin(consoleType);
        }

        if (consoleType === "arena") {
          const earned = Math.max(
            10,
            Math.round(sorted.reduce((total, item) => total + Math.max(0, item.score), 0) / Math.max(1, sorted.length))
          );
          this.storage.addArenaXP(earned);
        }

        this.audio.play("win");
        this.audio.vibrate([20, 25, 45]);

        if (tournament && this.tournamentManager.active) {
          this.ui.tournamentRoundResults(sorted);
          return;
        }

        this.ui.showResults(title, subtitle, sorted, replay);
      }

      playDodgeStorm(gameId, consoleType, players, tournament) {
        this.storage.recordGame(consoleType);

        const area = this.ui.gameShell(
          gameId === "dodge2" ? "Dodge Storm 2" : "Dodge Storm",
          "Preparing…"
        );

        const canvas = document.createElement("canvas");
        area.appendChild(canvas);

        const ctx = canvas.getContext("2d");
        const input = new InputManager();

        let frame = 0;
        let playerIndex = 0;
        let removeInput = null;
        let countdownTimer = 0;
        let activeTurn = null;
        const results = [];

        const resize = () => {
          const rect = area.getBoundingClientRect();
          const dpr = Math.min(window.devicePixelRatio || 1, 2);

          canvas.width = rect.width * dpr;
          canvas.height = rect.height * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        };

        const runPlayerTurn = () => {
          if (playerIndex >= players.length) {
            this.finish(
              consoleType,
              gameId,
              gameId === "dodge2" ? "STORM 2 RESULTS" : "STORM RESULTS",
              "Longest survival wins.",
              results,
              () => this.playDodgeStorm(gameId, consoleType, players, tournament),
              tournament
            );
            return;
          }

          const current = players[playerIndex];

          this.ui.passOverlay(
            area,
            current,
            "Drag to move. Avoid hazards. Release your touch to stop.",
            () => startCountdown(current)
          );
        };

        const startCountdown = current => {
          const overlay = document.createElement("div");
          overlay.className = "overlay";
          overlay.innerHTML = `
            <div class="overlay-card">
              <div class="hud-label">${gameId === "dodge2" ? "Arena Survival" : "Dodge Storm"}</div>
              <h2 id="countValue">3</h2>
              <p>${this.ui.escape(current.name)}, get ready.</p>
            </div>
          `;

          area.appendChild(overlay);

          let count = 3;

          countdownTimer = setInterval(() => {
            count -= 1;
            const countElement = overlay.querySelector("#countValue");

            if (count <= 0) {
              clearInterval(countdownTimer);
              countElement.textContent = "GO!";
              this.audio.play("start");

              setTimeout(() => {
                overlay.remove();
                beginTurn(current);
              }, 350);

              return;
            }

            countElement.textContent = count;
            this.audio.play("click");
          }, 650);
        };

        const beginTurn = current => {
          const rect = area.getBoundingClientRect();

          activeTurn = {
            current,
            running: true,
            startedAt: performance.now(),
            lastSpawn: 0,
            lastPickup: 0,
            player: {
              x: rect.width / 2,
              y: rect.height / 2,
              tx: rect.width / 2,
              ty: rect.height / 2,
              r: gameId === "dodge2" ? 20 : 21,
              hp: gameId === "dodge2" ? 3 : 1,
              shield: false,
              speedUntil: 0,
              invulnerableUntil: 0,
              scoreBonus: 0
            },
            hazards: [],
            pickups: []
          };

          frame = requestAnimationFrame(loop);
        };

        const spawnHazard = (state, level, elapsed) => {
          const rect = area.getBoundingClientRect();

          const types = ["rock"];

          if (gameId === "dodge2" && elapsed > 15) types.push("wall");
          if (gameId === "dodge2" && elapsed > 30) types.push("rotator");
          if (gameId === "dodge2" && elapsed > 50) types.push("ring");
          if (gameId === "dodge2" && elapsed > 75) types.push("homing");

          const type = types[Math.floor(Math.random() * types.length)];

          if (type === "rotator") {
            state.hazards.push({
              type,
              x: rect.width / 2,
              y: rect.height / 2,
              angle: Math.random() * Math.PI * 2,
              length: Math.max(rect.width, rect.height) * 0.37,
              thickness: 18,
              speed: 0.018 + level * 0.002
            });
            return;
          }

          if (type === "ring") {
            state.hazards.push({
              type,
              x: rect.width / 2,
              y: rect.height / 2,
              radius: 10,
              thickness: 11,
              speed: 1.4 + level * 0.08
            });
            return;
          }

          const side = Math.floor(Math.random() * 4);
          const size = type === "wall"
            ? 20 + Math.random() * 14
            : 22 + Math.random() * Math.min(21, level * 3);

          let x;
          let y;

          if (side === 0) {
            x = -size;
            y = Math.random() * rect.height;
          } else if (side === 1) {
            x = rect.width + size;
            y = Math.random() * rect.height;
          } else if (side === 2) {
            x = Math.random() * rect.width;
            y = -size;
          } else {
            x = Math.random() * rect.width;
            y = rect.height + size;
          }

          const angle = Math.atan2(state.player.y - y, state.player.x - x);
          const speed = 1.15 + level * 0.2 + Math.random() * 0.65;

          state.hazards.push({
            type,
            x,
            y,
            size,
            width: type === "wall" ? size * 3 : size,
            height: type === "wall" ? size : size,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            rotation: Math.random() * Math.PI
          });
        };

        const spawnPickup = state => {
          const rect = area.getBoundingClientRect();

          state.pickups.push({
            type: Math.random() < 0.5 ? "shield" : "speed",
            x: 40 + Math.random() * Math.max(1, rect.width - 80),
            y: 50 + Math.random() * Math.max(1, rect.height - 100),
            r: 13,
            createdAt: performance.now()
          });
        };

        const hit = state => {
          const now = performance.now();

          if (now < state.player.invulnerableUntil) return;

          if (state.player.shield) {
            state.player.shield = false;
            state.player.invulnerableUntil = now + 650;
            this.ui.toast("Shield blocked a hit!");
            this.audio.play("gold");
            return;
          }

          state.player.hp -= 1;
          state.player.invulnerableUntil = now + 950;

          this.audio.play("hit");
          this.audio.vibrate(40);

          area.classList.remove("shake");
          void area.offsetWidth;
          area.classList.add("shake");

          if (state.player.hp <= 0) {
            endTurn(state);
          }
        };

        const endTurn = state => {
          if (!state.running) return;

          state.running = false;

          const survival = (performance.now() - state.startedAt) / 1000;
          const score = Math.round(survival + state.player.scoreBonus);

          if (gameId === "dodge") {
            this.storage.recordBaseSurvival(survival);
          } else {
            this.storage.recordArenaSurvival(survival);
          }

          results.push({
            playerId: state.current.id,
            name: state.current.name,
            score,
            detail: `${survival.toFixed(1)}s • ${score} score`
          });

          playerIndex += 1;

          setTimeout(runPlayerTurn, 550);
        };

        const draw = state => {
          const rect = area.getBoundingClientRect();
          const elapsed = (performance.now() - state.startedAt) / 1000;

          ctx.clearRect(0, 0, rect.width, rect.height);

          const bg = ctx.createLinearGradient(0, 0, 0, rect.height);

          if (gameId === "dodge2") {
            if (elapsed < 15) {
              bg.addColorStop(0, "#293b72");
              bg.addColorStop(1, "#151830");
            } else if (elapsed < 35) {
              bg.addColorStop(0, "#5a3b38");
              bg.addColorStop(1, "#20172c");
            } else {
              bg.addColorStop(0, "#542a48");
              bg.addColorStop(1, "#171225");
            }
          } else {
            bg.addColorStop(0, "#30396c");
            bg.addColorStop(1, "#15172d");
          }

          ctx.fillStyle = bg;
          ctx.fillRect(0, 0, rect.width, rect.height);

          if (gameId === "dodge2") {
            ctx.strokeStyle = "rgba(87,229,255,.11)";
            ctx.lineWidth = 1;

            for (let x = -rect.height; x < rect.width + rect.height; x += 28) {
              ctx.beginPath();
              ctx.moveTo(x, 0);
              ctx.lineTo(x + rect.height, rect.height);
              ctx.stroke();
            }
          }

          state.pickups.forEach(pickup => {
            ctx.save();
            ctx.translate(pickup.x, pickup.y);
            ctx.rotate((performance.now() - pickup.createdAt) / 500);
            ctx.fillStyle = pickup.type === "shield" ? "#efffff" : "#90ff6b";
            ctx.shadowColor = ctx.fillStyle;
            ctx.shadowBlur = 18;
            ctx.beginPath();
            ctx.moveTo(0, -pickup.r);
            ctx.lineTo(pickup.r, 0);
            ctx.lineTo(0, pickup.r);
            ctx.lineTo(-pickup.r, 0);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
          });

          state.hazards.forEach(hazard => {
            ctx.save();

            if (hazard.type === "rotator") {
              ctx.translate(hazard.x, hazard.y);
              ctx.rotate(hazard.angle);
              ctx.fillStyle = "#ad7dff";
              ctx.shadowColor = "#ad7dff";
              ctx.shadowBlur = 16;
              ctx.fillRect(
                -hazard.thickness / 2,
                -hazard.length,
                hazard.thickness,
                hazard.length * 2
              );
              ctx.restore();
              return;
            }

            if (hazard.type === "ring") {
              ctx.beginPath();
              ctx.arc(hazard.x, hazard.y, hazard.radius, 0, Math.PI * 2);
              ctx.lineWidth = hazard.thickness;
              ctx.strokeStyle = "#ffd35f";
              ctx.shadowColor = "#ffd35f";
              ctx.shadowBlur = 14;
              ctx.stroke();
              ctx.restore();
              return;
            }

            ctx.translate(hazard.x, hazard.y);
            ctx.rotate(hazard.rotation);
            ctx.fillStyle = hazard.type === "wall"
              ? "#ad7dff"
              : hazard.type === "homing"
                ? "#ffd35f"
                : "#ff6e97";
            ctx.shadowColor = ctx.fillStyle;
            ctx.shadowBlur = 14;
            ctx.fillRect(
              -hazard.width / 2,
              -hazard.height / 2,
              hazard.width,
              hazard.height
            );
            ctx.restore();
          });

          const blink =
            performance.now() < state.player.invulnerableUntil &&
            Math.floor(performance.now() / 90) % 2 === 0;

          if (!blink) {
            ctx.beginPath();
            ctx.arc(state.player.x, state.player.y, state.player.r, 0, Math.PI * 2);
            ctx.fillStyle = state.player.speedUntil > performance.now()
              ? "#90ff6b"
              : state.current.color;
            ctx.shadowColor = ctx.fillStyle;
            ctx.shadowBlur = 20;
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.lineWidth = state.player.shield ? 6 : 4;
            ctx.strokeStyle = state.player.shield ? "#efffff" : "#dfffff";
            ctx.stroke();

            if (state.player.shield) {
              ctx.beginPath();
              ctx.arc(state.player.x, state.player.y, state.player.r + 9, 0, Math.PI * 2);
              ctx.lineWidth = 2;
              ctx.strokeStyle = "rgba(239,255,255,.7)";
              ctx.stroke();
            }
          }
        };

        const loop = now => {
          const state = activeTurn;

          if (!state || !state.running) return;

          const rect = area.getBoundingClientRect();
          const elapsed = (now - state.startedAt) / 1000;
          const level = Math.floor(elapsed / 10) + 1;
          const movement = state.player.speedUntil > now ? 0.25 : 0.16;

          state.player.x += (state.player.tx - state.player.x) * movement;
          state.player.y += (state.player.ty - state.player.y) * movement;

          state.player.x = Math.max(state.player.r, Math.min(rect.width - state.player.r, state.player.x));
          state.player.y = Math.max(state.player.r, Math.min(rect.height - state.player.r, state.player.y));

          const spawnDelay = Math.max(280, 900 - level * 82);

          if (now - state.lastSpawn > spawnDelay) {
            spawnHazard(state, level, elapsed);
            state.lastSpawn = now;
          }

          if (
            gameId === "dodge2" &&
            now - state.lastPickup > 10500 &&
            Math.random() < 0.011
          ) {
            spawnPickup(state);
            state.lastPickup = now;
          }

          for (let i = state.pickups.length - 1; i >= 0; i--) {
            const pickup = state.pickups[i];

            if (Math.hypot(state.player.x - pickup.x, state.player.y - pickup.y) < state.player.r + pickup.r + 4) {
              if (pickup.type === "shield") {
                state.player.shield = true;
                this.ui.toast("Shield acquired!");
              } else {
                state.player.speedUntil = now + 5000;
                this.ui.toast("Speed boost!");
              }

              state.player.scoreBonus += 12;
              state.pickups.splice(i, 1);
              this.audio.play("gold");
              this.audio.vibrate(20);
            }
          }

          for (let i = state.hazards.length - 1; i >= 0; i--) {
            const hazard = state.hazards[i];

            if (hazard.type === "rotator") {
              hazard.angle += hazard.speed;

              const dx = state.player.x - hazard.x;
              const dy = state.player.y - hazard.y;
              const distance = Math.hypot(dx, dy);

              if (distance < hazard.length) {
                const playerAngle = Math.atan2(dy, dx);
                const beamAngle = hazard.angle - Math.PI / 2;
                const difference = Math.abs(Math.atan2(
                  Math.sin(playerAngle - beamAngle),
                  Math.cos(playerAngle - beamAngle)
                ));

                if (difference < 0.13) hit(state);
              }

              continue;
            }

            if (hazard.type === "ring") {
              hazard.radius += hazard.speed;

              const distance = Math.hypot(
                state.player.x - hazard.x,
                state.player.y - hazard.y
              );

              if (Math.abs(distance - hazard.radius) < hazard.thickness + state.player.r * 0.35) {
                hit(state);
              }

              if (hazard.radius > Math.max(rect.width, rect.height)) {
                state.hazards.splice(i, 1);
              }

              continue;
            }

            if (hazard.type === "homing") {
              const angle = Math.atan2(
                state.player.y - hazard.y,
                state.player.x - hazard.x
              );

              hazard.vx += Math.cos(angle) * 0.03;
              hazard.vy += Math.sin(angle) * 0.03;
            }

            hazard.x += hazard.vx;
            hazard.y += hazard.vy;
            hazard.rotation += 0.035;

            const hitRadius = Math.max(hazard.width, hazard.height) * 0.37;

            if (Math.hypot(state.player.x - hazard.x, state.player.y - hazard.y) < state.player.r + hitRadius) {
              hit(state);
            }

            const near = Math.hypot(state.player.x - hazard.x, state.player.y - hazard.y);

            if (
              near > state.player.r + hitRadius &&
              near < state.player.r + hitRadius + 10
            ) {
              state.player.scoreBonus += 0.03;
            }

            if (
              hazard.x < -150 ||
              hazard.y < -150 ||
              hazard.x > rect.width + 150 ||
              hazard.y > rect.height + 150
            ) {
              state.hazards.splice(i, 1);
            }
          }

          const hud = document.querySelector("#hudValue");

          if (hud) {
            hud.textContent = gameId === "dodge2"
              ? `${state.current.name} • ${elapsed.toFixed(1)}s • HP ${"♥".repeat(state.player.hp)} • Lv ${level}`
              : `${state.current.name} • ${elapsed.toFixed(1)}s • Level ${level}`;
          }

          draw(state);

          frame = requestAnimationFrame(loop);
        };

        removeInput = input.attach(area, {
          down: point => {
            if (!activeTurn?.running) return;
            const rect = area.getBoundingClientRect();
            activeTurn.player.tx = point.x * rect.width;
            activeTurn.player.ty = point.y * rect.height;
          },
          move: point => {
            if (!activeTurn?.running) return;
            const rect = area.getBoundingClientRect();
            activeTurn.player.tx = point.x * rect.width;
            activeTurn.player.ty = point.y * rect.height;
          }
        });

        resize();
        window.addEventListener("resize", resize);
        runPlayerTurn();

        this.cleanup = () => {
          clearInterval(countdownTimer);
          cancelAnimationFrame(frame);
          removeInput?.();
          window.removeEventListener("resize", resize);
        };
      }

      playTargetRush(gameId, consoleType, players, tournament) {

          gameId === "target2" ? "Target Rush 2" : "Target Rush",

              .sort((a, b) => b.score - a.score)
              .map(result => ({
                ...result,
                detail: `${result.score} points`
              }));

            );

          }

          this.ui.passOverlay(

          currentTarget.addEventListener("pointerdown", event => {
            event.preventDefault();

            if (!running) return;

            const points = gold ? 3 : 1;
