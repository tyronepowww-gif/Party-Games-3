            }

            this.audio.play(gold ? "gold" : "point");
            this.audio.vibrate(gold ? 25 : 10);

            currentTarget.remove();
            currentTarget = null;

            clearTimeout(targetTimeout);
            targetTimeout = setTimeout(spawnTarget, 170);
          });

          area.appendChild(currentTarget);

          clearTimeout(targetTimeout);

          targetTimeout = setTimeout(() => {
            currentTarget?.remove();
            currentTarget = null;
            spawnTarget();
          }, gold ? 850 : 1150);
        };

        const startTurn = () => {
          running = true;
          startedAt = performance.now();
          spawnTarget();

          const loop = now => {
            if (!running) return;

            const remaining = Math.max(0, 30000 - (now - startedAt));
            const hud = document.querySelector("#hudValue");

            if (hud) {
              hud.textContent =
                `${players[playerIndex].name} • ${Math.ceil(remaining / 1000)}s • ` +
                `${results[playerIndex].score} pts`;
            }

            if (remaining <= 0) {
              running = false;
              clearTimeout(targetTimeout);
              currentTarget?.remove();
              currentTarget = null;
              playerIndex += 1;
              setTimeout(nextPlayer, 500);
              return;
            }

            frame = requestAnimationFrame(loop);
          };

          frame = requestAnimationFrame(loop);
        };

        nextPlayer();

        this.cleanup = () => {
          running = false;
          cancelAnimationFrame(frame);
          clearTimeout(targetTimeout);
          currentTarget?.remove();
        };
      }

      playReflexShot(gameId, consoleType, players, tournament) {
        this.storage.recordGame(consoleType);

        const area = this.ui.gameShell(
          gameId === "reflex2" ? "Reflex Shot 2" : "Reflex Shot",
          "Preparing…"
        );

        let playerIndex = 0;
        const results = [];
        const timers = [];

        const later = (callback, ms) => {
          const id = setTimeout(callback, ms);
          timers.push(id);
          return id;
        };

        const nextPlayer = () => {
          if (playerIndex >= players.length) {
            const sorted = [...results]
              .sort((a, b) => a.score - b.score)
              .map(result => ({
                ...result,
                detail: result.falseStart ? "False start" : `${result.score} ms`
              }));

            this.finish(
              consoleType,
              gameId,
              gameId === "reflex2" ? "REFLEX 2 RESULTS" : "REFLEX RESULTS",
              "Lower valid reaction time wins.",
              sorted,
              () => this.playReflexShot(gameId, consoleType, players, tournament),
              tournament
            );

            return;
          }

          this.ui.passOverlay(
            area,
            players[playerIndex],
            "Wait for TAP! Touching early is a false start.",
            runAttempt
          );
        };

        const runAttempt = () => {
          const player = players[playerIndex];
          const board = document.createElement("div");

          board.className = "overlay";
          board.style.background = "#344264";
          board.innerHTML = `
            <div>
              <div style="font-size:4rem;font-weight:1000;letter-spacing:-.08em">WAIT…</div>
              <p style="margin:15px 0 0;color:#e6eaff;font-weight:850">
                ${this.ui.escape(player.name)}, stay ready.
              </p>
            </div>
          `;

          area.appendChild(board);

          let state = "wait";
          let goAt = 0;

          const finishAttempt = (milliseconds, falseStart) => {
            if (state === "done") return;

            state = "done";

            board.style.background = falseStart ? "#bc3c5b" : "#22b88d";
            board.innerHTML = `
              <div>
                <div style="font-size:clamp(2.5rem,14vw,4.4rem);font-weight:1000;letter-spacing:-.08em">
                  ${falseStart ? "TOO EARLY!" : `${milliseconds} ms`}
                </div>
                <p style="margin:15px 0 0;color:#e6eaff;font-weight:850">
                  ${falseStart ? "False start recorded." : "Reaction saved!"}
                </p>
              </div>
            `;

            results.push({
              playerId: player.id,
              name: player.name,
              score: milliseconds,
              falseStart
            });

            if (!falseStart) {
              this.storage.recordReaction(milliseconds, gameId === "reflex2");
              this.audio.play("win");
              this.audio.vibrate(20);
            } else {
              this.audio.play("hit");
              this.audio.vibrate(40);
            }

            later(() => {
              board.remove();
              playerIndex += 1;
              nextPlayer();
            }, 1100);
          };

          const onFalseStart = event => {
            event.preventDefault();

            if (state !== "wait") return;

            finishAttempt(9999, true);
          };

          board.addEventListener("pointerdown", onFalseStart);

          const delay = 1500 + Math.random() * (gameId === "reflex2" ? 4200 : 3400);

          later(() => {
            if (state !== "wait") return;

            state = "go";
            goAt = performance.now();

            board.style.background = "#20b78d";
            board.innerHTML = `
              <div>
                <div style="font-size:clamp(3.4rem,18vw,5.4rem);font-weight:1000;letter-spacing:-.08em">
                  ${gameId === "reflex2" ? "STRIKE!" : "TAP!"}
                </div>
                <p style="margin:15px 0 0;color:#e6eaff;font-weight:850">NOW!</p>
              </div>
            `;

            this.audio.play("start");

            board.removeEventListener("pointerdown", onFalseStart);

            board.addEventListener("pointerdown", event => {
              event.preventDefault();

              if (state !== "go") return;

              finishAttempt(Math.round(performance.now() - goAt), false);
            }, { once: true });
          }, delay);
        };

        nextPlayer();

        this.cleanup = () => {
          timers.forEach(clearTimeout);
        };
      }

      playTrailDuel(gameId, consoleType, players, tournament) {
        this.storage.recordGame(consoleType);

        const area = this.ui.gameShell(
          gameId === "trail2" ? "Trail Duel 2" : "Trail Duel",
          "Preparing…"
        );

        const canvas = document.createElement("canvas");
        area.appendChild(canvas);

        const ctx = canvas.getContext("2d");
        const input = new InputManager();

        let playerIndex = 0;
        let currentTrail = [];
        let currentPoint = null;
        let dragging = false;
        let active = false;
        let turnTimer = 0;
        let frame = 0;
        let removeInput = null;

        const state = players.map(player => ({
          ...player,
          alive: true,
          trail: [],
          eliminatedOrder: 0
        }));

        const resize = () => {
          const rect = area.getBoundingClientRect();
          const dpr = Math.min(window.devicePixelRatio || 1, 2);

          canvas.width = rect.width * dpr;
          canvas.height = rect.height * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

          draw();
        };

        const alive = () => state.filter(player => player.alive);

        const nextAlive = start => {
          for (let offset = 0; offset < state.length; offset++) {
            const index = (start + offset) % state.length;
            if (state[index].alive) return index;
          }

          return -1;
        };

        const drawLine = (points, color) => {
          if (points.length < 2) return;

          ctx.beginPath();
          ctx.moveTo(points[0].x, points[0].y);

          for (let i = 1; i < points.length; i++) {
            ctx.lineTo(points[i].x, points[i].y);
          }

          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          ctx.lineWidth = gameId === "trail2" ? 11 : 9;
          ctx.strokeStyle = color;
          ctx.stroke();
        };

        const draw = () => {
          const rect = area.getBoundingClientRect();

          ctx.clearRect(0, 0, rect.width, rect.height);

          const bg = ctx.createLinearGradient(0, 0, 0, rect.height);
          bg.addColorStop(0, gameId === "trail2" ? "#3b2d70" : "#283762");
          bg.addColorStop(1, "#14162c");

          ctx.fillStyle = bg;
          ctx.fillRect(0, 0, rect.width, rect.height);

          state.forEach(player => drawLine(player.trail, player.color));
          drawLine(currentTrail, state[playerIndex]?.color || "#fff");

          if (currentPoint && state[playerIndex]) {
            ctx.beginPath();
            ctx.arc(currentPoint.x, currentPoint.y, 13, 0, Math.PI * 2);
            ctx.fillStyle = state[playerIndex].color;
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = "#fff";
            ctx.stroke();
          }
        };

        const pointHitsTrail = point => {
          const check = line => {
            for (let i = 0; i < line.length; i += 2) {
              if (Math.hypot(point.x - line[i].x, point.y - line[i].y) < 11) {
                return true;
              }
            }

            return false;
          };

          for (const player of state) {
            if (check(player.trail)) return true;
          }

          return check(currentTrail.slice(0, -8));
        };

        const finishGame = () => {
          const survivors = alive();
          const eliminated = state
            .filter(player => !player.alive)
            .sort((a, b) => b.eliminatedOrder - a.eliminatedOrder);

          const order = [...survivors, ...eliminated];

          const results = order.map((player, index) => ({
            playerId: player.id,
            name: player.name,
            score: Math.max(0, 100 - index * 20),
            detail: index === 0 ? "Last rider standing" : "Eliminated"
          }));

          this.finish(
            consoleType,
            gameId,
            gameId === "trail2" ? "TRAIL DUEL 2 RESULTS" : "TRAIL DUEL RESULTS",
            `${results[0].name} owns the arena.`,
            results,
            () => this.playTrailDuel(gameId, consoleType, players, tournament),
            tournament
          );
        };

        const endTurn = crashed => {
          if (!active) return;

          active = false;
          dragging = false;
          clearTimeout(turnTimer);

          const current = state[playerIndex];

          if (crashed) {
            current.alive = false;
            current.eliminatedOrder = Date.now();

            this.audio.play("hit");
            this.audio.vibrate(45);
            this.ui.toast(`${current.name} crashed!`);
          } else {
            current.trail.push(...currentTrail);
            this.audio.play("click");
          }

          currentTrail = [];
          currentPoint = null;
          draw();

          if (alive().length <= 1) {
            setTimeout(finishGame, 500);
            return;
          }

          playerIndex = nextAlive((playerIndex + 1) % state.length);
          setTimeout(nextTurn, 450);
        };

        const moveTo = point => {
          if (!active || !currentPoint) return;

          const rect = area.getBoundingClientRect();

          const wrapped = {
            x: (point.x + rect.width) % rect.width,
            y: (point.y + rect.height) % rect.height
          };

          if (pointHitsTrail(wrapped)) {
            currentTrail.push(wrapped);
            draw();
            endTurn(true);
            return;
          }

          currentPoint = wrapped;
          currentTrail.push(wrapped);

          if (currentTrail.length > 350) {
            currentTrail = currentTrail.filter((_, index) => index % 2 === 0);
          }

          draw();
        };

        const startTurn = () => {
          const rect = area.getBoundingClientRect();
          const positions = [
            [rect.width * 0.2, rect.height * 0.2],
            [rect.width * 0.8, rect.height * 0.2],
            [rect.width * 0.8, rect.height * 0.8],
            [rect.width * 0.2, rect.height * 0.8]
          ];

          currentPoint = {
            x: positions[playerIndex][0],
            y: positions[playerIndex][1]
          };

          currentTrail = [{ ...currentPoint }];
          active = true;
          const startedAt = performance.now();

          turnTimer = setTimeout(() => endTurn(false), 3500);

          const loop = now => {
            if (!active) return;

            const remaining = Math.max(0, 3500 - (now - startedAt));
            const hud = document.querySelector("#hudValue");

            if (hud) {
              hud.textContent =
                `${state[playerIndex].name} • ${(remaining / 1000).toFixed(1)}s • ${alive().length} alive`;
            }

            frame = requestAnimationFrame(loop);
          };

          frame = requestAnimationFrame(loop);
          draw();
        };

        const nextTurn = () => {
          if (alive().length <= 1) {
            finishGame();
            return;
          }

          playerIndex = nextAlive(playerIndex);

          this.ui.passOverlay(
            area,
            state[playerIndex],
            "Drag continuously. Touch any trail and you crash. Edges wrap around.",
            startTurn
          );
        };

        removeInput = input.attach(area, {
          down: point => {
            if (!active) return;

            dragging = true;
            const rect = area.getBoundingClientRect();

            moveTo({
              x: point.x * rect.width,
              y: point.y * rect.height
            });
          },
          move: point => {
            if (!dragging || !active) return;

            const rect = area.getBoundingClientRect();

            moveTo({
              x: point.x * rect.width,
              y: point.y * rect.height
            });
          },
          up: () => {
            dragging = false;
          }
        });

        resize();
        window.addEventListener("resize", resize);
        nextTurn();

        this.cleanup = () => {
          clearTimeout(turnTimer);
          cancelAnimationFrame(frame);
          removeInput?.();
          window.removeEventListener("resize", resize);
        };
      }

      playHotCursor(gameId, consoleType, players, tournament) {
        this.storage.recordGame(consoleType);

        const area = this.ui.gameShell(
          gameId === "hot2" ? "Hot Cursor 2" : "Hot Cursor",
          "Preparing…"
        );

        const state = players.map(player => ({
          ...player,
          alive: true,
          eliminatedOrder: 0
        }));

        let holderIndex = Math.floor(Math.random() * state.length);
        let targetIndex = -1;
        let running = false;
        let frame = 0;
        let playerElement = null;
        let targetElement = null;
        let removeInput = null;
        let holderPosition = { x: 0, y: 0 };
        let targetPosition = { x: 0, y: 0 };
        let bombEndsAt = 0;

        const living = () => state.filter(player => player.alive);

        const randomLivingIndex = excluded => {
          const choices = state
            .map((player, index) => ({ player, index }))
            .filter(item => item.player.alive && item.index !== excluded);

          return choices[Math.floor(Math.random() * choices.length)]?.index ?? excluded;
        };

        const clearElements = () => {
          playerElement?.remove();
          targetElement?.remove();
          playerElement = null;
          targetElement = null;
        };

        const finishGame = () => {
          const winner = living()[0];
          const rest = state
            .filter(player => player !== winner)
            .sort((a, b) => b.eliminatedOrder - a.eliminatedOrder);

          const results = [
            {
              playerId: winner.id,
              name: winner.name,
              score: 100,
              detail: "Core survivor"
            },
            ...rest.map((player, index) => ({
              playerId: player.id,
              name: player.name,
              score: Math.max(0, 60 - index * 20),
              detail: "Eliminated"
            }))
          ];

          this.finish(
            consoleType,
            gameId,
            gameId === "hot2" ? "HOT CURSOR 2 RESULTS" : "HOT CURSOR RESULTS",
            `${winner.name} survived the Core.`,
            results,
            () => this.playHotCursor(gameId, consoleType, players, tournament),
            tournament
          );
        };

        const explode = () => {
          if (!running) return;

          running = false;
          clearElements();

          state[holderIndex].alive = false;
          state[holderIndex].eliminatedOrder = Date.now();

          this.audio.play("hit");
          this.audio.vibrate([80, 30, 80]);
          this.ui.toast(`${state[holderIndex].name} exploded!`);

          if (living().length <= 1) {
            setTimeout(finishGame, 650);
            return;
          }

          holderIndex = randomLivingIndex(-1);
          setTimeout(nextTurn, 650);
        };

        const passCore = () => {
          if (!running) return;

          running = false;
          clearElements();

          holderIndex = targetIndex;

          this.audio.play("point");
          this.audio.vibrate(20);
          this.ui.toast("Core passed!");

          setTimeout(nextTurn, 400);
        };

        const runTurn = () => {
          running = true;

          const rect = area.getBoundingClientRect();

          targetIndex = randomLivingIndex(holderIndex);
          holderPosition = {
            x: rect.width * 0.5,
            y: rect.height * 0.72
          };

          targetPosition = {
            x: 55 + Math.random() * Math.max(1, rect.width - 110),
            y: 70 + Math.random() * Math.max(1, rect.height * 0.45)
          };

          playerElement = document.createElement("div");
          playerElement.style.cssText = `
            position:absolute;
            width:72px;
            height:72px;
            left:${holderPosition.x}px;
            top:${holderPosition.y}px;
            transform:translate(-50%,-50%);
            display:grid;
            place-items:center;
            border:5px solid #fff;
            border-radius:50%;
            background:${state[holderIndex].color};
            color:#1a1b31;
            font-weight:1000;
            box-shadow:0 0 22px rgba(255,211,95,.72);
            touch-action:none;
          `;

          playerElement.innerHTML = `
            ●
            <span style="
              position:absolute;
              right:-7px;
              top:-7px;
              width:30px;
              height:30px;
              border:4px solid var(--gold);
              border-radius:50%;
              background:#191a2e;
              box-shadow:0 0 19px var(--pink);
            "></span>
          `;

          targetElement = document.createElement("div");
          targetElement.textContent = "→";
          targetElement.style.cssText = `
            position:absolute;
            width:72px;
            height:72px;
            left:${targetPosition.x}px;
            top:${targetPosition.y}px;
            transform:translate(-50%,-50%);
            display:grid;
            place-items:center;
            border:5px solid #fff;
            border-radius:20px;
            background:${state[targetIndex].color};
            color:#1a1b31;
            font-size:1.4rem;
            font-weight:1000;
            box-shadow:0 0 19px rgba(255,255,255,.35);
            touch-action:none;
          `;

          area.append(playerElement, targetElement);

          bombEndsAt = performance.now() + (gameId === "hot2" ? 17000 : 18000);

          const loop = now => {
            if (!running) return;

            const remaining = Math.max(0, bombEndsAt - now);
            const hud = document.querySelector("#hudValue");

            if (hud) {
              hud.textContent = `${state[holderIndex].name} has Core • ${(remaining / 1000).toFixed(1)}s`;
            }

            if (remaining <= 0) {
              explode();
              return;
            }

            frame = requestAnimationFrame(loop);
          };

          frame = requestAnimationFrame(loop);
        };

        const moveHolder = point => {
          if (!running || !playerElement) return;

          const rect = area.getBoundingClientRect();

          holderPosition.x = Math.max(36, Math.min(rect.width - 36, point.x * rect.width));
          holderPosition.y = Math.max(36, Math.min(rect.height - 36, point.y * rect.height));

          playerElement.style.left = `${holderPosition.x}px`;
          playerElement.style.top = `${holderPosition.y}px`;

          if (Math.hypot(
            holderPosition.x - targetPosition.x,
            holderPosition.y - targetPosition.y
          ) < 62) {
            passCore();
          }
        };

        const nextTurn = () => {
          if (living().length <= 1) {
            finishGame();
            return;
          }

          this.ui.passOverlay(
            area,
            state[holderIndex],
            "Drag your circle into the square target to pass the Core.",
            runTurn
          );
        };

        const input = new InputManager();

        removeInput = input.attach(area, {
          down: moveHolder,
          move: moveHolder
        });

        nextTurn();

        this.cleanup = () => {
          running = false;
          cancelAnimationFrame(frame);
          clearElements();
          removeInput?.();
        };
      }

      playObjectiveGame(gameId, consoleType, players, tournament) {
        this.storage.recordGame(consoleType);

        const game = ARENA_GAMES.find(item => item.id === gameId);
        const area = this.ui.gameShell(game.title, "Preparing…");

        const canvas = document.createElement("canvas");
        area.appendChild(canvas);

        const ctx = canvas.getContext("2d");
        const input = new InputManager();

        const gameConfig = {
          quest: {
            title: "Collect crystals",
            duration: 50000,
            objective: 5,
            color: "#57e5ff",
            danger: "#ad7dff"
          },
          brawl: {
            title: "Strike targets",
            duration: 45000,
            objective: 12,
            color: "#ff6e97",
            danger: "#ff9f5a"
          },
          treasure: {
            title: "Gather treasure",
            duration: 50000,
            objective: 8,
            color: "#ffd35f",
            danger: "#ff6e97"
          },
          boss: {
            title: "Break weak points",
            duration: 60000,
            objective: 10,
            color: "#90ff6b",
            danger: "#ad7dff"
          }
        }[gameId] || {
          title: "Score points",
          duration: 45000,
          objective: 8,
          color: game.color,
          danger: "#ff6e97"
        };

        let playerIndex = 0;
        const results = [];
        let frame = 0;
        let removeInput = null;
        let current = null;

        const resize = () => {
          const rect = area.getBoundingClientRect();
          const dpr = Math.min(window.devicePixelRatio || 1, 2);

          canvas.width = rect.width * dpr;
          canvas.height = rect.height * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        };

        const nextPlayer = () => {
          if (playerIndex >= players.length) {
            this.finish(
              consoleType,
              gameId,
              `${game.title.toUpperCase()} RESULTS`,
              "Highest score wins.",
              results,
              () => this.playObjectiveGame(gameId, consoleType, players, tournament),
              tournament
            );
            return;
          }

          this.ui.passOverlay(
            area,
            players[playerIndex],
            `${gameConfig.title}. Drag to move. Tap for a quick action bonus.`,
            beginTurn
          );
        };

        const placeObjective = () => {
          const rect = area.getBoundingClientRect();

          current.objective = {
            x: 38 + Math.random() * Math.max(1, rect.width - 76),
            y: 45 + Math.random() * Math.max(1, rect.height - 90),
            r: 15
          };
        };

        const placeHazard = () => {
          const rect = area.getBoundingClientRect();

          current.hazards.push({
            x: 35 + Math.random() * Math.max(1, rect.width - 70),
            y: 40 + Math.random() * Math.max(1, rect.height - 80),
            r: 14,
            vx: (Math.random() - 0.5) * 0.75,
            vy: (Math.random() - 0.5) * 0.75
          });
        };

        const draw = () => {
          const rect = area.getBoundingClientRect();

          ctx.clearRect(0, 0, rect.width, rect.height);

          const bg = ctx.createLinearGradient(0, 0, 0, rect.height);
          bg.addColorStop(0, "#343b73");
          bg.addColorStop(1, "#15172e");

          ctx.fillStyle = bg;
          ctx.fillRect(0, 0, rect.width, rect.height);

          ctx.strokeStyle = "rgba(255,255,255,.08)";

          for (let x = -rect.height; x < rect.width + rect.height; x += 30) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x + rect.height, rect.height);
            ctx.stroke();
          }

          current.hazards.forEach(hazard => {
            ctx.beginPath();
            ctx.arc(hazard.x, hazard.y, hazard.r, 0, Math.PI * 2);
            ctx.fillStyle = gameConfig.danger;
            ctx.shadowColor = gameConfig.danger;
            ctx.shadowBlur = 13;
            ctx.fill();
          });

          ctx.save();
          ctx.translate(current.objective.x, current.objective.y);
          ctx.rotate(performance.now() / 600);
          ctx.fillStyle = gameConfig.color;
          ctx.shadowColor = gameConfig.color;
          ctx.shadowBlur = 19;
          ctx.beginPath();
          ctx.moveTo(0, -current.objective.r);
          ctx.lineTo(current.objective.r, 0);
          ctx.lineTo(0, current.objective.r);
          ctx.lineTo(-current.objective.r, 0);
          ctx.closePath();
          ctx.fill();
          ctx.restore();

          ctx.beginPath();
          ctx.arc(current.player.x, current.player.y, current.player.r, 0, Math.PI * 2);
          ctx.fillStyle = current.player.color;
          ctx.shadowColor = current.player.color;
          ctx.shadowBlur = 18;
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.lineWidth = 4;
          ctx.strokeStyle = "#f5f7ff";
          ctx.stroke();
        };

        const beginTurn = () => {
          const rect = area.getBoundingClientRect();

          current = {
            player: {
              x: rect.width / 2,
              y: rect.height * 0.7,
              tx: rect.width / 2,
              ty: rect.height * 0.7,
              r: 18,
              color: players[playerIndex].color
            },
            score: 0,
            actionBonusReady: true,
            startedAt: performance.now(),
            hazards: [],
            objective: null
          };

          placeObjective();

          if (gameId === "boss") {
            placeHazard();
            placeHazard();
          }

          frame = requestAnimationFrame(loop);
        };

        const finishTurn = () => {
          const player = players[playerIndex];

          results.push({
            playerId: player.id,
            name: player.name,
            score: current.score,
            detail: `${current.score} points`
          });

          playerIndex += 1;
          current = null;

          setTimeout(nextPlayer, 500);
        };

        const loop = now => {
          if (!current) return;

          const rect = area.getBoundingClientRect();
          const elapsed = now - current.startedAt;
          const remaining = Math.max(0, gameConfig.duration - elapsed);

          current.player.x += (current.player.tx - current.player.x) * 0.16;
          current.player.y += (current.player.ty - current.player.y) * 0.16;

          current.player.x = Math.max(current.player.r, Math.min(rect.width - current.player.r, current.player.x));
          current.player.y = Math.max(current.player.r, Math.min(rect.height - current.player.r, current.player.y));

          if (
            Math.hypot(
              current.player.x - current.objective.x,
              current.player.y - current.objective.y
            ) < current.player.r + current.objective.r
          ) {
            current.score += gameId === "brawl" ? 2 : 1;

            this.audio.play("point");
            this.audio.vibrate(10);

            if (current.score >= gameConfig.objective) {
              current.score += 5;
              finishTurn();
              return;
            }

            placeObjective();

            if (Math.random() < 0.36) {
              placeHazard();
            }
          }

          for (let i = current.hazards.length - 1; i >= 0; i--) {
            const hazard = current.hazards[i];

            hazard.x += hazard.vx;
            hazard.y += hazard.vy;

            if (hazard.x < hazard.r || hazard.x > rect.width - hazard.r) hazard.vx *= -1;
            if (hazard.y < hazard.r || hazard.y > rect.height - hazard.r) hazard.vy *= -1;

            if (
              Math.hypot(
                current.player.x - hazard.x,
                current.player.y - hazard.y
              ) < current.player.r + hazard.r
            ) {
              current.score = Math.max(0, current.score - 1);
              current.hazards.splice(i, 1);
              this.audio.play("hit");
            }
          }

          const hud = document.querySelector("#hudValue");

          if (hud) {
            hud.textContent =
              `${players[playerIndex].name} • ${Math.ceil(remaining / 1000)}s • ` +
              `${current.score}/${gameConfig.objective}`;
          }

          draw();

          if (remaining <= 0) {
            finishTurn();
            return;
          }

          frame = requestAnimationFrame(loop);
        };

        removeInput = input.attach(area, {
          down: point => {
            if (!current) return;

            const rect = area.getBoundingClientRect();

            current.player.tx = point.x * rect.width;
            current.player.ty = point.y * rect.height;

            if (current.actionBonusReady) {
              current.actionBonusReady = false;

              setTimeout(() => {
                if (current) current.actionBonusReady = true;
              }, 700);

              if (Math.random() < 0.45) {
                current.score += 1;
                this.audio.play("point");
              }
            }
          },
          move: point => {
            if (!current) return;

            const rect = area.getBoundingClientRect();
            current.player.tx = point.x * rect.width;
            current.player.ty = point.y * rect.height;
          }
        });

        resize();
        window.addEventListener("resize", resize);
        nextPlayer();

        this.cleanup = () => {
          cancelAnimationFrame(frame);
          removeInput?.();
          window.removeEventListener("resize", resize);
        };
      }
    }

    class App {
      constructor() {
        this.app = document.querySelector("#app");

        this.storage = new StorageManager();
        this.audio = new AudioManager(this.storage);
        this.playerManager = new PlayerManager();
        this.tournamentManager = new TournamentManager(this.storage);
        this.gameManager = new GameManager(
          this.storage,
          this.audio,
          this.tournamentManager
        );

        this.ui = new UIManager(
          this.app,
          this.storage,
          this.audio,
          this.playerManager,
          this.tournamentManager,
          this.gameManager
        );

        this.gameManager.ui = this.ui;

        document.addEventListener("contextmenu", event => event.preventDefault());
        document.addEventListener("gesturestart", event => event.preventDefault(), {
          passive: false
        });

        if (this.storage.memoryOnly) {
          setTimeout(() => {
            this.ui.toast("Saved records are unavailable in this browser mode.");
          }, 500);
        }

        this.ui.boot();
      }
    }

    new App();
  </script>
</body>
