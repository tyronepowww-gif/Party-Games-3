    class GameManager {
      constructor(storage, audio) {
        this.storage = storage;
        this.audio = audio;
        this.ui = null;
        this.cleanup = null;
        this.tournament = null;
      }

      stop() {
        if (typeof this.cleanup === "function") {
          this.cleanup();
        }

        this.cleanup = null;
      }

      launch(gameId, consoleType, players, tournament = false) {
        this.stop();

        const wheelPoolBase = ["dodge", "trail", "target", "hot", "reflex"];
        const wheelPoolArena = [
          "dodge2",
          "trail2",
          "target2",
          "hot2",
          "reflex2",
          "quest",
          "brawl",
          "treasure",
          "boss"
        ];

        if (gameId === "wheel") {
          gameId =
            wheelPoolBase[Math.floor(Math.random() * wheelPoolBase.length)];
        }

        if (gameId === "wheel2") {
          gameId =
            wheelPoolArena[Math.floor(Math.random() * wheelPoolArena.length)];
        }

        if (gameId === "dodge" || gameId === "dodge2") {
          this.dodgeStorm(gameId, consoleType, players, tournament);
          return;
        }

        if (gameId === "target" || gameId === "target2") {
          this.targetRush(gameId, consoleType, players, tournament);
          return;
        }

        if (gameId === "reflex" || gameId === "reflex2") {
          this.reflexShot(gameId, consoleType, players, tournament);
          return;
        }

        if (gameId === "trail" || gameId === "trail2") {
          this.trailDuel(gameId, consoleType, players, tournament);
          return;
        }

        if (gameId === "hot" || gameId === "hot2") {
          this.hotCursor(gameId, consoleType, players, tournament);
          return;
        }

        this.genericArenaGame(gameId, consoleType, players, tournament);
      }

      async finish({
        consoleType,
        gameId,
        title,
        subtitle,
        results,
        replay,
        tournament,
        progressionResult
      }) {
        this.stop();

        let savedState = {
          saved: false,
          reason: "No progression event was created."
        };

        if (progressionResult) {
          savedState = await this.storage.recordGameResult(progressionResult);

          if (savedState.saved) {
            this.audio.sound("win");
            this.audio.vibrate([20, 25, 45]);
          } else {
            this.audio.vibrate(18);
          }
        }

        if (tournament && this.tournament) {
          this.ui.applyTournamentResults(results);
          return;
        }

        this.ui.results(title, subtitle, results, replay, savedState);
      }

      dodgeStorm(gameId, consoleType, players, tournament) {
        const area = this.ui.gameShell(
          gameId === "dodge2" ? "Dodge Storm 2" : "Dodge Storm",
          "Preparing"
        );

        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        const input = new InputManager();

        area.appendChild(canvas);

        let frame = 0;
        let countdownTimer = 0;
        let running = false;
        let startedAt = 0;
        let lastSpawn = 0;
        let removeInput = null;

        const state = {
          player: {
            x: 0,
            y: 0,
            tx: 0,
            ty: 0,
            r: gameId === "dodge2" ? 20 : 21,
            hp: gameId === "dodge2" ? 3 : 1,
            invulnerableUntil: 0,
            shield: false,
            speedUntil: 0,
            score: 0
          },
          hazards: [],
          pickups: [],
          lastPickup: 0
        };

        const resize = () => {
          const rect = area.getBoundingClientRect();
          const dpr = Math.min(window.devicePixelRatio || 1, 2);

          canvas.width = rect.width * dpr;
          canvas.height = rect.height * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

          if (!state.player.x) {
            state.player.x = state.player.tx = rect.width / 2;
            state.player.y = state.player.ty = rect.height * 0.68;
          }
        };

        const collision = (x1, y1, r1, x2, y2, r2) =>
          Math.hypot(x1 - x2, y1 - y2) < r1 + r2;

        const spawnHazard = (level, elapsed) => {
          const rect = area.getBoundingClientRect();
          const types = ["rock"];

          if (gameId === "dodge2" && elapsed > 15) {
            types.push("wall");
          }

          if (gameId === "dodge2" && elapsed > 30) {
            types.push("rotator");
          }

          if (gameId === "dodge2" && elapsed > 50) {
            types.push("ring");
          }

          if (gameId === "dodge2" && elapsed > 75) {
            types.push("homing");
          }

          const type = types[Math.floor(Math.random() * types.length)];
          const edge = Math.floor(Math.random() * 4);

          let x = 0;
          let y = 0;

          if (edge === 0) {
            x = Math.random() * rect.width;
            y = -40;
          }

          if (edge === 1) {
            x = rect.width + 40;
            y = Math.random() * rect.height;
          }

          if (edge === 2) {
            x = Math.random() * rect.width;
            y = rect.height + 40;
          }

          if (edge === 3) {
            x = -40;
            y = Math.random() * rect.height;
          }

          const angle = Math.atan2(
            state.player.y - y,
            state.player.x - x
          );

          state.hazards.push({
            type,
            x,
            y,
            vx: Math.cos(angle) * (1.8 + level * 0.18),
            vy: Math.sin(angle) * (1.8 + level * 0.18),
            r:
              type === "rock"
                ? 13 + Math.random() * 11
                : type === "ring"
                  ? 34 + Math.random() * 16
                  : 18,
            width: 20 + Math.random() * 16,
            height: 20 + Math.random() * 18,
            angle: Math.random() * Math.PI * 2,
            rotation: (Math.random() - 0.5) * 0.12,
            length: 50 + Math.random() * 40,
            thickness: 12 + Math.random() * 6,
            radius: 34 + Math.random() * 20
          });
        };

        const spawnPickup = () => {
          const rect = area.getBoundingClientRect();
          const type = Math.random() < 0.5 ? "shield" : "speed";

          state.pickups.push({
            type,
            x: 40 + Math.random() * Math.max(1, rect.width - 80),
            y: 50 + Math.random() * Math.max(1, rect.height - 100),
            radius: 13,
            created: performance.now()
          });
        };

        const hitPlayer = () => {
          const now = performance.now();

          if (now < state.player.invulnerableUntil) {
            return;
          }

          if (state.player.shield) {
            state.player.shield = false;
            state.player.invulnerableUntil = now + 700;
            this.audio.sound("gold");
            this.audio.vibrate(25);
            this.ui.toast("Shield blocked a hit!");
            return;
          }

          state.player.hp -= 1;
          state.player.invulnerableUntil = now + 950;

          this.audio.sound("hit");
          this.audio.vibrate(40);

          area.classList.remove("shake");
          void area.offsetWidth;
          area.classList.add("shake");

          if (state.player.hp <= 0) {
            endGame();
          }
        };

        const drawHazard = (hazard) => {
          ctx.save();
          ctx.translate(hazard.x, hazard.y);

          if (hazard.type === "ring") {
            ctx.beginPath();
            ctx.arc(0, 0, hazard.radius, 0, Math.PI * 2);
            ctx.strokeStyle = "#ffd35f";
            ctx.shadowColor = "#ffd35f";
            ctx.shadowBlur = 14;
            ctx.lineWidth = hazard.thickness;
            ctx.stroke();
            ctx.restore();
            return;
          }

          if (hazard.type === "rotator") {
            ctx.rotate(hazard.angle);
            ctx.fillStyle = "#ad7dff";
            ctx.shadowColor = "#ad7dff";
            ctx.shadowBlur = 18;
            ctx.fillRect(
              -hazard.thickness / 2,
              -hazard.length,
              hazard.thickness,
              hazard.length * 2
            );
            ctx.restore();
            return;
          }

          ctx.rotate(hazard.rotation);
          ctx.fillStyle =
            hazard.type === "wall"
              ? "#ad7dff"
              : hazard.type === "homing"
                ? "#ffcf63"
                : "#ff6e97";

          ctx.shadowColor = ctx.fillStyle;
          ctx.shadowBlur = 14;

          ctx.fillRect(
            -hazard.width / 2,
            -hazard.height / 2,
            hazard.width,
            hazard.height
          );

          ctx.restore();
        };

        const draw = () => {
          const rect = area.getBoundingClientRect();
          const elapsed = running
            ? (performance.now() - startedAt) / 1000
            : 0;

          ctx.clearRect(0, 0, rect.width, rect.height);

          const background = ctx.createLinearGradient(
            0,
            0,
            0,
            rect.height
          );

          if (gameId === "dodge2" && elapsed > 30) {
            background.addColorStop(0, "#552b48");
            background.addColorStop(1, "#171225");
          } else if (gameId === "dodge2" && elapsed > 15) {
            background.addColorStop(0, "#293b72");
            background.addColorStop(1, "#151830");
          } else {
            background.addColorStop(0, "#30396c");
            background.addColorStop(1, "#15172d");
          }

          ctx.fillStyle = background;
          ctx.fillRect(0, 0, rect.width, rect.height);

          if (gameId === "dodge2") {
            ctx.strokeStyle = "rgba(87,229,255,.11)";
            ctx.lineWidth = 1;

            for (
              let x = -rect.height;
              x < rect.width + rect.height;
              x += 28
            ) {
              ctx.beginPath();
              ctx.moveTo(x, 0);
              ctx.lineTo(x + rect.height, rect.height);
              ctx.stroke();
            }
          }

          state.pickups.forEach((pickup) => {
            ctx.save();
            ctx.translate(pickup.x, pickup.y);
            ctx.rotate((performance.now() - pickup.created) / 500);
            ctx.fillStyle =
              pickup.type === "shield" ? "#efffff" : "#90ff6b";
            ctx.shadowColor = ctx.fillStyle;
            ctx.shadowBlur = 18;
            ctx.beginPath();
            ctx.moveTo(0, -pickup.radius);
            ctx.lineTo(pickup.radius, 0);
            ctx.lineTo(0, pickup.radius);
            ctx.lineTo(-pickup.radius, 0);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
          });

          state.hazards.forEach(drawHazard);

          const blinking =
            performance.now() < state.player.invulnerableUntil &&
            Math.floor(performance.now() / 90) % 2 === 0;

          if (!blinking) {
            ctx.beginPath();
            ctx.arc(
              state.player.x,
              state.player.y,
              state.player.r,
              0,
              Math.PI * 2
            );

            ctx.fillStyle =
              state.player.speedUntil > performance.now()
                ? "#90ff6b"
                : "#57e5ff";

            ctx.shadowColor = ctx.fillStyle;
            ctx.shadowBlur = state.player.shield ? 28 : 20;
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.lineWidth = state.player.shield ? 6 : 4;
            ctx.strokeStyle = state.player.shield ? "#efffff" : "#dfffff";
            ctx.stroke();

            if (state.player.shield) {
              ctx.beginPath();
              ctx.arc(
                state.player.x,
                state.player.y,
                state.player.r + 9,
                0,
                Math.PI * 2
              );

              ctx.strokeStyle = "rgba(239,255,255,.62)";
              ctx.lineWidth = 2;
              ctx.stroke();
            }
          }
        };

        const endGame = async () => {
          if (!running) {
            return;
          }

          running = false;

          const seconds = (performance.now() - startedAt) / 1000;
          const score = Math.round(seconds + state.player.score);

          const progressionResult = {
            gameId,
            durationSeconds: Number(seconds.toFixed(1)),
            score,
            xpAwarded: GAME_RULES[gameId].xpFormula({
              durationSeconds: seconds,
              score
            })
          };

          const results = players.map((name, index) => ({
            name,
            score: index === 0 ? score : 0,
            detail:
              index === 0
                ? `${seconds.toFixed(1)}s · ${score} score`
                : "Pass Play attempt"
          }));

          await this.finish({
            consoleType,
            gameId,
            title:
              gameId === "dodge2"
                ? "STORM 2 RESULTS"
                : "STORM RESULTS",
            subtitle: `Survival: ${seconds.toFixed(1)} seconds.`,
            results,
            replay: () =>
              this.dodgeStorm(gameId, consoleType, players, tournament),
            tournament,
            progressionResult
          });
        };

        const loop = (now) => {
          if (!running) {
            return;
          }

          const rect = area.getBoundingClientRect();
          const elapsed = (now - startedAt) / 1000;
          const level = Math.floor(elapsed / 10) + 1;
          const speedMultiplier =
            state.player.speedUntil > now ? 0.25 : 0.16;

          state.player.x +=
            (state.player.tx - state.player.x) * speedMultiplier;

          state.player.y +=
            (state.player.ty - state.player.y) * speedMultiplier;

          state.player.x = Math.max(
            state.player.r,
            Math.min(rect.width - state.player.r, state.player.x)
          );

          state.player.y = Math.max(
            state.player.r,
            Math.min(rect.height - state.player.r, state.player.y)
          );

          const spawnDelay = Math.max(280, 900 - level * 84);

          if (now - lastSpawn > spawnDelay) {
            spawnHazard(level, elapsed);
            lastSpawn = now;
          }

          if (
            gameId === "dodge2" &&
            now - state.lastPickup > 11000 &&
            Math.random() < 0.009
          ) {
            spawnPickup();
            state.lastPickup = now;
          }

          for (let index = state.pickups.length - 1; index >= 0; index -= 1) {
            const pickup = state.pickups[index];

            if (
              collision(
                state.player.x,
                state.player.y,
                state.player.r,
                pickup.x,
                pickup.y,
                pickup.radius + 4
              )
            ) {
              if (pickup.type === "shield") {
                state.player.shield = true;
                this.ui.toast("Shield acquired!");
              } else {
                state.player.speedUntil = now + 5000;
                this.ui.toast("Speed boost!");
              }

              state.player.score += 12;
              this.audio.sound("gold");
              this.audio.vibrate(20);
              state.pickups.splice(index, 1);
            }
          }

          for (let index = state.hazards.length - 1; index >= 0; index -= 1) {
            const hazard = state.hazards[index];

            if (hazard.type === "homing") {
              const angle = Math.atan2(
                state.player.y - hazard.y,
                state.player.x - hazard.x
              );

              hazard.vx += Math.cos(angle) * 0.05;
              hazard.vy += Math.sin(angle) * 0.05;
            }

            if (hazard.type === "rotator") {
              hazard.angle += 0.045;
            } else if (hazard.type === "ring") {
              hazard.radius += 0.45;
            } else {
              hazard.x += hazard.vx;
              hazard.y += hazard.vy;
              hazard.rotation += 0.06;
            }

            const hitRadius =
              hazard.type === "ring"
                ? hazard.radius
                : hazard.type === "rotator"
                  ? hazard.length * 0.6
                  : Math.max(hazard.width || 0, hazard.height || 0, hazard.r || 0);

            const distance = Math.hypot(
              state.player.x - hazard.x,
              state.player.y - hazard.y
            );

            if (
              hazard.type !== "ring" &&
              collision(
                state.player.x,
                state.player.y,
                state.player.r,
                hazard.x,
                hazard.y,
                hitRadius * 0.55
              )
            ) {
              hitPlayer();
            }

            if (
              hazard.type === "ring" &&
              Math.abs(distance - hazard.radius) <
                state.player.r + hazard.thickness
            ) {
              hitPlayer();
            }

            if (
              hazard.x < -180 ||
              hazard.y < -180 ||
              hazard.x > rect.width + 180 ||
              hazard.y > rect.height + 180 ||
              (hazard.type === "ring" && hazard.radius > 220)
            ) {
              state.hazards.splice(index, 1);
            }
          }

          const hud = document.querySelector("#hudValue");

          if (hud) {
            hud.textContent =
              gameId === "dodge2"
                ? `${elapsed.toFixed(1)}s · HP ${"●".repeat(
                    state.player.hp
                  )} · +${state.player.score}`
                : `${elapsed.toFixed(1)}s · Level ${level}`;
          }

          draw();
          frame = requestAnimationFrame(loop);
        };

        resize();
        window.addEventListener("resize", resize);

        removeInput = input.attach(area, {
          down: (point) => {
            const rect = area.getBoundingClientRect();
            state.player.tx = point.x * rect.width;
            state.player.ty = point.y * rect.height;
          },
          move: (point) => {
            const rect = area.getBoundingClientRect();
            state.player.tx = point.x * rect.width;
            state.player.ty = point.y * rect.height;
          }
        });

        const overlay = document.createElement("div");
        overlay.className = "overlay";
        overlay.innerHTML = `
          <div class="overlay-card">
            <div class="hud-label">${
              gameId === "dodge2" ? "Arena Survival" : "Dodge Storm"
            }</div>
            <h2 id="countdownValue">3</h2>
            <p>Drag to move. Avoid hazards and survive.</p>
          </div>
        `;

        area.appendChild(overlay);

        let count = 3;

        countdownTimer = setInterval(() => {
          count -= 1;

          const value = overlay.querySelector("#countdownValue");

          if (count <= 0) {
            clearInterval(countdownTimer);
            value.textContent = "GO!";
            this.audio.sound("start");

            setTimeout(() => {
              overlay.remove();
              running = true;
              startedAt = performance.now();
              frame = requestAnimationFrame(loop);
            }, 350);

            return;
          }

          value.textContent = count;
          this.audio.sound("click");
        }, 700);

        this.cleanup = () => {
          running = false;
          clearInterval(countdownTimer);
          cancelAnimationFrame(frame);
          removeInput?.();
          window.removeEventListener("resize", resize);
        };
      }

      targetRush(gameId, consoleType, players, tournament) {
        const area = this.ui.gameShell(
          gameId === "target2" ? "Target Rush 2" : "Target Rush",
          "Preparing"
        );

        let playerIndex = 0;
        const scores = players.map((name) => ({ name, score: 0 }));
        let currentTarget = null;
        let frame = 0;
        let running = false;
        let startedAt = 0;
        let targetTimer = 0;

        const nextPlayer = async () => {
          if (playerIndex >= players.length) {
            const results = [...scores]
              .sort((a, b) => b.score - a.score)
              .map((item) => ({
                name: item.name,
                score: item.score,
                detail: `${item.score} points`
              }));

            const winnerScore = results[0]?.score || 0;

            const progressionResult = {
              gameId,
              durationSeconds: 30,
              score: winnerScore,
              xpAwarded: GAME_RULES[gameId].xpFormula({
                durationSeconds: 30,
                score: winnerScore
              })
            };

            await this.finish({
              consoleType,
              gameId,
              title:
                gameId === "target2"
                  ? "TARGET RUSH 2 RESULTS"
                  : "TARGET RUSH RESULTS",
              subtitle: "Highest score wins.",
              results,
              replay: () =>
                this.targetRush(gameId, consoleType, players, tournament),
              tournament,
              progressionResult
            });

            return;
          }

          const overlay = document.createElement("div");
          overlay.className = "overlay";
          overlay.innerHTML = `
            <div class="overlay-card">
              <div class="hud-label">Target Rush</div>
              <h2>PASS TO ${this.ui.escape(
                players[playerIndex].toUpperCase()
              )}</h2>
              <p>Tap targets for 30 seconds. Gold targets are worth three points.</p>
              <button id="readyButton" class="btn">TAP WHEN READY</button>
            </div>
          `;

          area.appendChild(overlay);

          overlay.querySelector("#readyButton").onclick = () => {
            overlay.remove();
            startRound();
          };
        };

        const spawnTarget = () => {
          currentTarget?.remove();

          if (!running) {
            return;
          }

          const rect = area.getBoundingClientRect();
          const gold = Math.random() < (gameId === "target2" ? 0.24 : 0.17);

          currentTarget = document.createElement("button");
          currentTarget.className = `target ${gold ? "gold" : ""}`;
          currentTarget.textContent = gold ? "3" : "1";
          currentTarget.style.left = `${
            45 + Math.random() * Math.max(1, rect.width - 90)
          }px`;
          currentTarget.style.top = `${
            50 + Math.random() * Math.max(1, rect.height - 110)
          }px`;

          currentTarget.addEventListener("pointerdown", (event) => {
            event.preventDefault();

            if (!running) {
              return;
            }

            const points = gold ? 3 : 1;
            scores[playerIndex].score += points;

            this.audio.sound(gold ? "gold" : "point");
            this.audio.vibrate(gold ? 25 : 10);

            currentTarget.remove();
            currentTarget = null;

            clearTimeout(targetTimer);
            targetTimer = setTimeout(spawnTarget, 180);
          });

          area.appendChild(currentTarget);

          clearTimeout(targetTimer);

          targetTimer = setTimeout(() => {
            currentTarget?.remove();
            currentTarget = null;
            spawnTarget();
          }, gold ? 850 : 1200);
        };

        const startRound = () => {
          running = true;
          startedAt = performance.now();
          spawnTarget();

          const loop = (now) => {
            if (!running) {
              return;
            }

            const remaining = Math.max(0, 30000 - (now - startedAt));
            const hud = document.querySelector("#hudValue");

            if (hud) {
              hud.textContent = `${players[playerIndex]} · ${Math.ceil(
                remaining / 1000
              )}s · ${scores[playerIndex].score} points`;
            }

            if (remaining <= 0) {
              running = false;

              clearTimeout(targetTimer);
              currentTarget?.remove();
              currentTarget = null;

              playerIndex += 1;

              setTimeout(nextPlayer, 550);
              return;
            }

            frame = requestAnimationFrame(loop);
          };

          frame = requestAnimationFrame(loop);
        };

        nextPlayer();

        this.cleanup = () => {
          running = false;
          cancelAnimationFrame(frame);
          clearTimeout(targetTimer);
          currentTarget?.remove();
        };
      }

      reflexShot(gameId, consoleType, players, tournament) {
        const area = this.ui.gameShell(
          gameId === "reflex2" ? "Reflex Shot 2" : "Reflex Shot",
          "Preparing"
        );

        let playerIndex = 0;
        const results = [];
        const activeTimeouts = [];

        const later = (callback, milliseconds) => {
          const id = setTimeout(callback, milliseconds);
          activeTimeouts.push(id);
          return id;
        };

        const nextPlayer = async () => {
          if (playerIndex >= players.length) {
            const rankings = [...results]
              .sort((a, b) => a.score - b.score)
              .map((item) => ({
                name: item.name,
                score: item.score,
                detail: item.falseStart
                  ? "False start"
                  : `${item.score} ms`
              }));

            const bestValid = results
              .filter((result) => !result.falseStart)
              .sort((a, b) => a.score - b.score)[0];

            const progressionResult = bestValid
              ? {
                  gameId,
                  reactionMs: bestValid.score,
                  xpAwarded: GAME_RULES[gameId].xpFormula({
                    reactionMs: bestValid.score
                  })
                }
              : null;

            await this.finish({
              consoleType,
              gameId,
              title:
                gameId === "reflex2" ? "REFLEX 2 RESULTS" : "REFLEX RESULTS",
              subtitle: "Lower reaction time is better.",
              results: rankings,
              replay: () =>
                this.reflexShot(gameId, consoleType, players, tournament),
              tournament,
              progressionResult
            });

            return;
          }

          const overlay = document.createElement("div");
          overlay.className = "overlay";
          overlay.innerHTML = `
            <div class="overlay-card">
              <div class="hud-label">Reflex Shot</div>
              <h2>PASS TO ${this.ui.escape(
                players[playerIndex].toUpperCase()
              )}</h2>
              <p>Wait for TAP. Tapping early is a false start.</p>
              <button id="readyButton" class="btn">TAP WHEN READY</button>
            </div>
          `;

          area.appendChild(overlay);

          overlay.querySelector("#readyButton").onclick = () => {
            overlay.remove();
            runAttempt();
          };
        };

        const runAttempt = () => {
          const board = document.createElement("div");
          board.className = "overlay";
          board.style.background = "#344264";
          board.innerHTML = `
            <div>
              <div
                style="
                  font-size: 4rem;
                  font-weight: 1000;
                  letter-spacing: -.08em;
                "
              >
                WAIT
              </div>

              <p
                style="
                  margin: 15px 0 0;
                  color: #e6eaff;
                  font-weight: 850;
                "
              >
                ${this.ui.escape(players[playerIndex])}, stay ready.
              </p>
            </div>
          `;

          area.appendChild(board);

          let state = "wait";
          let goAt = 0;

          const finishAttempt = (milliseconds, falseStart = false) => {
            if (state === "done") {
              return;
            }

            state = "done";

            board.innerHTML = `
              <div>
                <div
                  style="
                    font-size: clamp(2.5rem, 14vw, 4.4rem);
                    font-weight: 1000;
                    letter-spacing: -.08em;
                  "
                >
                  ${falseStart ? "TOO EARLY!" : `${milliseconds} ms`}
                </div>

                <p
                  style="
                    margin: 15px 0 0;
                    color: #e6eaff;
                    font-weight: 850;
                  "
                >
                  ${
                    falseStart
                      ? "False start recorded."
                      : "Reaction saved locally."
                  }
                </p>
              </div>
            `;

            board.style.background = falseStart ? "#bc3c5b" : "#22b88d";

            if (falseStart) {
              this.audio.sound("hit");
              this.audio.vibrate(40);
            } else {
              this.audio.sound("win");
              this.audio.vibrate(20);
            }

            results.push({
              name: players[playerIndex],
              score: milliseconds,
              falseStart
            });

            later(() => {
              board.remove();
              playerIndex += 1;
              nextPlayer();
            }, 1200);
          };

          const falseStartHandler = (event) => {
            event.preventDefault();

            if (state !== "wait") {
              return;
            }

            finishAttempt(9999, true);
          };

          board.addEventListener("pointerdown", falseStartHandler);

          const delay = 1500 + Math.random() * 3500;

          later(() => {
            if (state !== "wait") {
              return;
            }

            state = "go";
            goAt = performance.now();

            board.style.background = "#20b78d";
            board.innerHTML = `
              <div>
                <div
                  style="
                    font-size: clamp(3.5rem, 18vw, 5.4rem);
                    font-weight: 1000;
                    letter-spacing: -.08em;
                  "
                >
                  TAP!
                </div>

                <p
                  style="
                    margin: 15px 0 0;
                    color: #e6eaff;
                    font-weight: 850;
                  "
                >
                  NOW!
                </p>
              </div>
            `;

            this.audio.sound("start");

            board.removeEventListener("pointerdown", falseStartHandler);

            board.addEventListener(
              "pointerdown",
              (event) => {
                event.preventDefault();

                if (state !== "go") {
                  return;
                }

                const milliseconds = Math.round(performance.now() - goAt);
                finishAttempt(milliseconds, false);
              },
              { once: true }
            );
          }, delay);
        };

        nextPlayer();

        this.cleanup = () => {
          activeTimeouts.forEach(clearTimeout);
        };
      }

      trailDuel(gameId, consoleType, players, tournament) {
        const area = this.ui.gameShell(
          gameId === "trail2" ? "Trail Duel 2" : "Trail Duel",
          "Preparing"
        );

        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        const input = new InputManager();

        area.appendChild(canvas);

        let frame = 0;
        let removeInput = null;
        let playerIndex = 0;
        let dragging = false;
        let currentPoint = null;
        let currentTrail = [];
        let turnTimer = 0;
        let turnStart = 0;

        const playersState = players.map((name, index) => ({
          name,
          color: COLORS[index],
          alive: true,
          trail: []
        }));

        const resize = () => {
          const rect = area.getBoundingClientRect();
          const dpr = Math.min(window.devicePixelRatio || 1, 2);

          canvas.width = rect.width * dpr;
          canvas.height = rect.height * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

          draw();
        };

        const drawTrail = (trail, color) => {
          if (trail.length < 2) {
            return;
          }

          ctx.strokeStyle = color;
          ctx.lineWidth = gameId === "trail2" ? 11 : 9;
          ctx.lineCap = "round";
          ctx.lineJoin = "round";

          ctx.beginPath();
          ctx.moveTo(trail[0].x, trail[0].y);

          for (let index = 1; index < trail.length; index += 1) {
            ctx.lineTo(trail[index].x, trail[index].y);
          }

          ctx.stroke();
        };

        const draw = () => {
          const rect = area.getBoundingClientRect();

          ctx.clearRect(0, 0, rect.width, rect.height);

          const gradient = ctx.createLinearGradient(0, 0, 0, rect.height);
          gradient.addColorStop(0, gameId === "trail2" ? "#382a69" : "#283762");
          gradient.addColorStop(1, "#14162c");

          ctx.fillStyle = gradient;
          ctx.fillRect(0, 0, rect.width, rect.height);

          playersState.forEach((player) => drawTrail(player.trail, player.color));

          if (currentTrail.length > 1 && playerIndex >= 0) {
            drawTrail(currentTrail, playersState[playerIndex].color);
          }

          if (currentPoint && playerIndex >= 0) {
            ctx.beginPath();
            ctx.arc(currentPoint.x, currentPoint.y, 13, 0, Math.PI * 2);
            ctx.fillStyle = playersState[playerIndex].color;
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = "#fff";
            ctx.stroke();
          }
        };

        const alivePlayers = () =>
          playersState.filter((player) => player.alive);

        const nextAliveIndex = (start) => {
          for (let index = 0; index < playersState.length; index += 1) {
            const candidate = (start + index) % playersState.length;

            if (playersState[candidate].alive) {
              return candidate;
            }
          }

          return -1;
        };

        const collideTrail = (point) => {
          for (const player of playersState) {
            for (const trailPoint of player.trail) {
              if (Math.hypot(point.x - trailPoint.x, point.y - trailPoint.y) < 12) {
                return true;
              }
            }
          }

          for (const trailPoint of currentTrail.slice(0, -6)) {
            if (Math.hypot(point.x - trailPoint.x, point.y - trailPoint.y) < 10) {
              return true;
            }
          }

          return false;
        };

        const finish = async () => {
          const winner = alivePlayers()[0];

          const results = [
            {
              name: winner?.name || "No rider",
              score: 100,
              detail: "Last rider standing"
            },
            ...playersState
              .filter((player) => player !== winner)
              .map((player) => ({
                name: player.name,
                score: 0,
                detail: player.alive ? "Still alive" : "Eliminated"
              }))
          ];

          const progressionResult = {
            gameId,
            xpAwarded: GAME_RULES[gameId].xpFormula({})
          };

          await this.finish({
            consoleType,
            gameId,
            title:
              gameId === "trail2"
                ? "TRAIL DUEL 2 RESULTS"
                : "TRAIL DUEL RESULTS",
            subtitle: winner
              ? `${winner.name} controls the arena.`
              : "No one controls the arena.",
            results,
            replay: () =>
              this.trailDuel(gameId, consoleType, players, tournament),
            tournament,
            progressionResult
          });
        };

        const endTurn = (crashed) => {
          clearTimeout(turnTimer);

          if (crashed) {
            playersState[playerIndex].alive = false;
            this.audio.sound("hit");
            this.audio.vibrate(45);
            this.ui.toast(`${playersState[playerIndex].name} crashed!`);
          } else {
            playersState[playerIndex].trail.push(...currentTrail);
            this.audio.sound("click");
          }

          currentTrail = [];
          currentPoint = null;
          dragging = false;

          if (alivePlayers().length <= 1) {
            setTimeout(finish, 500);
            return;
          }

          playerIndex = nextAliveIndex(playerIndex + 1);

          setTimeout(nextTurn, 550);
        };

        const moveTo = (point) => {
          const rect = area.getBoundingClientRect();

          const wrapped = {
            x: ((point.x * rect.width) + rect.width) % rect.width,
            y: ((point.y * rect.height) + rect.height) % rect.height
          };

          if (collideTrail(wrapped)) {
            currentTrail.push(wrapped);
            draw();
            endTurn(true);
            return;
          }

          currentPoint = wrapped;
          currentTrail.push(wrapped);
          draw();
        };

        const nextTurn = () => {
          if (alivePlayers().length <= 1) {
            finish();
            return;
          }

          const player = playersState[playerIndex];

          const overlay = document.createElement("div");
          overlay.className = "overlay";
          overlay.innerHTML = `
            <div class="overlay-card">
              <div class="hud-label">Trail Duel</div>
              <h2 style="color: ${this.ui.escape(player.color)};">
                PASS TO ${this.ui.escape(player.name.toUpperCase())}
              </h2>
              <p>Drag continuously. Touch any trail and you crash.</p>
              <button id="readyButton" class="btn">TAP WHEN READY</button>
            </div>
          `;

          area.appendChild(overlay);

          overlay.querySelector("#readyButton").onclick = () => {
            overlay.remove();

            const rect = area.getBoundingClientRect();

            const positions = [
              [rect.width * 0.2, rect.height * 0.2],
              [rect.width * 0.8, rect.height * 0.2],
              [rect.width * 0.8, rect.height * 0.8],
              [rect.width * 0.2, rect.height * 0.8]
            ];

            currentPoint = {
              x: positions[playerIndex][0],
              y: positions[playerIndex][1]
            };

            currentTrail = [{ ...currentPoint }];
            turnStart = performance.now();

            turnTimer = setTimeout(() => endTurn(false), 3500);

            const loop = () => {
              if (!currentPoint) {
                return;
              }

              const remaining = Math.max(
                0,
                3500 - (performance.now() - turnStart)
              );

              const hud = document.querySelector("#hudValue");

              if (hud) {
                hud.textContent = `${playersState[playerIndex].name} · ${(
                  remaining / 1000
                ).toFixed(1)}s · ${alivePlayers().length} alive`;
              }

              draw();
              frame = requestAnimationFrame(loop);
            };

            frame = requestAnimationFrame(loop);
          };
        };

        resize();
        window.addEventListener("resize", resize);

        removeInput = input.attach(area, {
          down: (point) => {
            if (!currentPoint) {
              return;
            }

            dragging = true;
            moveTo(point);
          },
          move: (point) => {
            if (!dragging || !currentPoint) {
              return;
            }

            moveTo(point);
          },
          up: () => {
            dragging = false;
          }
        });

        nextTurn();

        this.cleanup = () => {
          clearTimeout(turnTimer);
          cancelAnimationFrame(frame);
          removeInput?.();
          window.removeEventListener("resize", resize);
        };
      }

      hotCursor(gameId, consoleType, players, tournament) {
        const area = this.ui.gameShell(
          gameId === "hot2" ? "Hot Cursor 2" : "Hot Cursor",
          "Preparing"
        );

        const input = new InputManager();

        let alive = players.map((name, index) => ({
          name,
          color: COLORS[index],
          alive: true
        }));

        let holderIndex = 0;
        let targetIndex = 1;
        let timer = 0;
        let frame = 0;
        let running = false;
        let playerEl = null;
        let targetEl = null;
        let removeInput = null;
        let holderX = 0;
        let holderY = 0;
        let targetX = 0;
        let targetY = 0;

        const living = () => alive.filter((player) => player.alive);

        const randomLivingIndex = (exclude) => {
          const choices = alive
            .map((player, index) => ({ player, index }))
            .filter((item) => item.player.alive && item.index !== exclude);

          return choices[Math.floor(Math.random() * choices.length)]?.index ?? exclude;
        };

        const clearElements = () => {
          playerEl?.remove();
          targetEl?.remove();
          playerEl = null;
          targetEl = null;
        };

        const finish = async () => {
          const winner = living()[0];

          const results = [
            {
              name: winner?.name || "No winner",
              score: 100,
              detail: "Core survivor"
            },
            ...alive
              .filter((player) => player !== winner)
              .map((player) => ({
                name: player.name,
                score: 0,
                detail: player.alive ? "Still active" : "Eliminated"
              }))
          ];

          const progressionResult = {
            gameId,
            xpAwarded: GAME_RULES[gameId].xpFormula({})
          };

          await this.finish({
            consoleType,
            gameId,
            title:
              gameId === "hot2"
                ? "HOT CURSOR 2 RESULTS"
                : "HOT CURSOR RESULTS",
            subtitle: winner
              ? `${winner.name} survived the Core.`
              : "No one survived the Core.",
            results,
            replay: () =>
              this.hotCursor(gameId, consoleType, players, tournament),
            tournament,
            progressionResult
          });
        };

        const explode = () => {
          if (!running) {
            return;
          }

          running = false;
          clearElements();

          alive[holderIndex].alive = false;

          this.audio.sound("hit");
          this.audio.vibrate([80, 30, 80]);
          this.ui.toast(`${alive[holderIndex].name} exploded!`);

          if (living().length <= 1) {
            setTimeout(finish, 700);
            return;
          }

          holderIndex = randomLivingIndex(-1);
          setTimeout(nextTurn, 700);
        };

        const passCore = () => {
          if (!running) {
            return;
          }

          running = false;
          clearElements();

          holderIndex = targetIndex;

          this.audio.sound("point");
          this.audio.vibrate(20);
          this.ui.toast("Core passed!");

          setTimeout(nextTurn, 450);
        };

        const moveHolder = (point) => {
          if (!running) {
            return;
          }

          const rect = area.getBoundingClientRect();

          holderX = Math.max(
            36,
            Math.min(rect.width - 36, point.x * rect.width)
          );

          holderY = Math.max(
            36,
            Math.min(rect.height - 36, point.y * rect.height)
          );

          playerEl.style.left = `${holderX}px`;
          playerEl.style.top = `${holderY}px`;

          if (Math.hypot(holderX - targetX, holderY - targetY) < 62) {
            passCore();
          }
        };

        const nextTurn = () => {
          if (living().length <= 1) {
            finish();
            return;
          }

          const holder = alive[holderIndex];

          const overlay = document.createElement("div");
          overlay.className = "overlay";
          overlay.innerHTML = `
            <div class="overlay-card">
              <div class="hud-label">Hot Cursor</div>
              <h2 style="color: ${this.ui.escape(holder.color)};">
                PASS TO ${this.ui.escape(holder.name.toUpperCase())}
              </h2>
              <p>Drag your circle into the square target before the Core reaches zero.</p>
              <button id="readyButton" class="btn">TAP WHEN READY</button>
            </div>
          `;

          area.appendChild(overlay);

          overlay.querySelector("#readyButton").onclick = () => {
            overlay.remove();
            runTurn();
          };
        };

        const runTurn = () => {
          running = true;

          const rect = area.getBoundingClientRect();

          targetIndex = randomLivingIndex(holderIndex);

          holderX = rect.width * 0.5;
          holderY = rect.height * 0.72;

          targetX = 55 + Math.random() * Math.max(1, rect.width - 110);
          targetY = 70 + Math.random() * Math.max(1, rect.height * 0.45);

          playerEl = document.createElement("div");
          playerEl.style.cssText = `
            position: absolute;
            width: 72px;
            height: 72px;
            left: ${holderX}px;
            top: ${holderY}px;
            transform: translate(-50%, -50%);
            display: grid;
            place-items: center;
            border: 5px solid #fff;
            border-radius: 50%;
            background: ${alive[holderIndex].color};
            color: #1a1b31;
            font-weight: 1000;
            box-shadow: 0 0 22px rgba(255, 211, 95, .72);
            touch-action: none;
          `;

          playerEl.innerHTML = `
            <span
              style="
                position: absolute;
                right: -7px;
                top: -7px;
                width: 30px;
                height: 30px;
                border: 4px solid var(--gold);
                border-radius: 50%;
                background: #191a2e;
                box-shadow: 0 0 19px var(--pink);
              "
            ></span>
          `;

          targetEl = document.createElement("div");
          targetEl.style.cssText = `
            position: absolute;
            width: 72px;
            height: 72px;
            left: ${targetX}px;
            top: ${targetY}px;
            transform: translate(-50%, -50%);
            display: grid;
            place-items: center;
            border: 5px solid #fff;
            border-radius: 20px;
            background: ${alive[targetIndex].color};
            color: #1a1b31;
            font-size: 1.4rem;
            font-weight: 1000;
            box-shadow: 0 0 19px rgba(255, 255, 255, .35);
            touch-action: none;
          `;

          targetEl.textContent = "→";

          area.append(playerEl, targetEl);

          timer = performance.now() + 18000;

          const loop = (now) => {
            if (!running) {
              return;
            }

            const remaining = Math.max(0, timer - now);
            const hud = document.querySelector("#hudValue");

            if (hud) {
              hud.textContent = `${alive[holderIndex].name} has Core · ${(
                remaining / 1000
              ).toFixed(1)}s`;
            }

            if (remaining <= 0) {
              explode();
              return;
            }

            frame = requestAnimationFrame(loop);
          };

          frame = requestAnimationFrame(loop);
        };

        removeInput = input.attach(area, {
          down: moveHolder,
          move: moveHolder
        });

        nextTurn();

        this.cleanup = () => {
          running = false;
          cancelAnimationFrame(frame);
          clearElements();
          removeInput?.();
        };
      }

      genericArenaGame(gameId, consoleType, players, tournament) {
        const game = ARENA_GAMES.find((item) => item.id === gameId);

        const area = this.ui.gameShell(game?.title || "Arena Game", "Preparing");
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        const input = new InputManager();

        area.appendChild(canvas);

        let frame = 0;
        let removeInput = null;
        let startedAt = 0;
        let running = false;
        let score = 0;

        const player = {
          x: 0,
          y: 0,
          tx: 0,
          ty: 0,
          r: 18
        };

        const objective = {
          x: 0,
          y: 0,
          r: 15
        };

        const hazards = [];

        const config = {
          quest: {
            duration: 60000,
            objectiveText: "Collect crystals",
            color: "#57e5ff"
          },
          brawl: {
            duration: 60000,
            objectiveText: "Tap to strike",
            color: "#ff6e97"
          },
          treasure: {
            duration: 60000,
            objectiveText: "Collect treasure",
            color: "#ffd35f"
          },
          boss: {
            duration: 60000,
            objectiveText: "Hit weak points",
            color: "#90ff6b"
          }
        }[gameId] || {
          duration: 45000,
          objectiveText: "Score points",
          color: game?.color || "#57e5ff"
        };

        const resize = () => {
          const rect = area.getBoundingClientRect();
          const dpr = Math.min(window.devicePixelRatio || 1, 2);

          canvas.width = rect.width * dpr;
          canvas.height = rect.height * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

          if (!player.x) {
            player.x = player.tx = rect.width / 2;
            player.y = player.ty = rect.height * 0.7;
          }

          if (!objective.x) {
            placeObjective();
          }
        };

        const placeObjective = () => {
          const rect = area.getBoundingClientRect();

          objective.x = 38 + Math.random() * Math.max(1, rect.width - 76);
          objective.y = 45 + Math.random() * Math.max(1, rect.height - 90);
        };

        const draw = () => {
          const rect = area.getBoundingClientRect();

          ctx.clearRect(0, 0, rect.width, rect.height);

          const gradient = ctx.createLinearGradient(0, 0, 0, rect.height);
          gradient.addColorStop(0, "#343b73");
          gradient.addColorStop(1, "#15172e");

          ctx.fillStyle = gradient;
          ctx.fillRect(0, 0, rect.width, rect.height);

          hazards.forEach((hazard) => {
            ctx.beginPath();
            ctx.arc(hazard.x, hazard.y, hazard.r, 0, Math.PI * 2);
            ctx.fillStyle = "#ff6e97";
            ctx.shadowColor = "#ff6e97";
            ctx.shadowBlur = 13;
            ctx.fill();
          });

          ctx.save();
          ctx.translate(objective.x, objective.y);
          ctx.rotate(performance.now() / 600);
          ctx.fillStyle = config.color;
          ctx.shadowColor = config.color;
          ctx.shadowBlur = 19;
          ctx.beginPath();
          ctx.moveTo(0, -objective.r);
          ctx.lineTo(objective.r, 0);
          ctx.lineTo(0, objective.r);
          ctx.lineTo(-objective.r, 0);
          ctx.closePath();
          ctx.fill();
          ctx.restore();

          ctx.beginPath();
          ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
          ctx.fillStyle = "#f5f7ff";
          ctx.shadowColor = "#57e5ff";
          ctx.shadowBlur = 18;
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.lineWidth = 4;
          ctx.strokeStyle = "#57e5ff";
          ctx.stroke();
        };

        const collect = () => {
          score += gameId === "brawl" ? 2 : 1;
          this.audio.sound("point");
          this.audio.vibrate(12);

          placeObjective();

          if (Math.random() < 0.25) {
            const rect = area.getBoundingClientRect();

            hazards.push({
              x: 35 + Math.random() * Math.max(1, rect.width - 70),
              y: 40 + Math.random() * Math.max(1, rect.height - 80),
              r: 13
            });
          }
        };

        const start = () => {
          running = true;
          startedAt = performance.now();

          const loop = async (now) => {
            if (!running) {
              return;
            }

            const rect = area.getBoundingClientRect();
            const remaining = Math.max(0, config.duration - (now - startedAt));

            player.x += (player.tx - player.x) * 0.16;
            player.y += (player.ty - player.y) * 0.16;

            player.x = Math.max(
              player.r,
              Math.min(rect.width - player.r, player.x)
            );

            player.y = Math.max(
              player.r,
              Math.min(rect.height - player.r, player.y)
            );

            if (
              Math.hypot(player.x - objective.x, player.y - objective.y) <
              player.r + objective.r
            ) {
              collect();
            }

            for (let index = hazards.length - 1; index >= 0; index -= 1) {
              if (
                Math.hypot(
                  player.x - hazards[index].x,
                  player.y - hazards[index].y
                ) <
                player.r + hazards[index].r
              ) {
                score = Math.max(0, score - 1);
                hazards.splice(index, 1);
                this.audio.sound("hit");
              }
            }

            const hud = document.querySelector("#hudValue");

            if (hud) {
              hud.textContent = `${config.objectiveText} · ${Math.ceil(
                remaining / 1000
              )}s · ${score}`;
            }

            draw();

            if (remaining <= 0) {
              running = false;

              const progressionResult = {
                gameId,
                durationSeconds: config.duration / 1000,
                score,
                xpAwarded: GAME_RULES[gameId].xpFormula({
                  durationSeconds: config.duration / 1000,
                  score
                })
              };

              const results = players
                .map((name, index) => ({
                  name,
                  score: Math.max(0, score - index * 2),
                  detail: `${Math.max(0, score - index * 2)} points`
                }))
                .sort((a, b) => b.score - a.score);

              await this.finish({
                consoleType,
                gameId,
                title: `${game.title.toUpperCase()} RESULTS`,
                subtitle: `${score} total objective points.`,
                results,
                replay: () =>
                  this.genericArenaGame(
                    gameId,
                    consoleType,
                    players,
                    tournament
                  ),
                tournament,
                progressionResult
              });

              return;
            }

            frame = requestAnimationFrame(loop);
          };

          frame = requestAnimationFrame(loop);
        };

        resize();
        window.addEventListener("resize", resize);

        removeInput = input.attach(area, {
          down: (point) => {
            const rect = area.getBoundingClientRect();

            player.tx = point.x * rect.width;
            player.ty = point.y * rect.height;

            if (running && Math.random() < 0.4) {
              score += 1;
              this.audio.sound("point");
            }
          },
          move: (point) => {
            const rect = area.getBoundingClientRect();

            player.tx = point.x * rect.width;
            player.ty = point.y * rect.height;
          }
        });

        const overlay = document.createElement("div");
        overlay.className = "overlay";
        overlay.innerHTML = `
          <div class="overlay-card">
            <div class="hud-label">${this.ui.escape(game.title)}</div>
            <h2>${this.ui.escape(config.objectiveText)}</h2>
            <p>Drag to move toward glowing objectives. Tap the arena for a quick action bonus.</p>
            <button id="startButton" class="btn">START ROUND</button>
          </div>
        `;

        area.appendChild(overlay);

        overlay.querySelector("#startButton").onclick = () => {
          overlay.remove();
          this.audio.sound("start");
          start();
        };

        this.cleanup = () => {
          running = false;
          cancelAnimationFrame(frame);
          removeInput?.();
          window.removeEventListener("resize", resize);
        };
      }
    }

    class App {
      constructor() {
        this.app = document.querySelector("#app");
        this.storage = new SecureStorageManager();
        this.audio = new AudioManager(this.storage);
        this.games = new GameManager(this.storage, this.audio);
        this.ui = new UIManager(this.app, this.storage, this.audio, this.games);

        this.games.ui = this.ui;
      }

      async start() {
        const boot = new ConsoleBootScreen();

        try {
          await this.storage.initialize(boot);

          await boot.complete({
            verified: this.storage.verified,
            reason: this.storage.verified
              ? ""
              : `${this.storage.integrityReason} Games remain playable; local progression is quarantined.`
          });
        } catch (error) {
          console.error(error);

          this.storage.payload = this.storage.createDefaultPayload();
          this.storage.verified = false;
          this.storage.integrityReason =
            "Local memory could not be initialized.";

          await boot.complete({
            verified: false,
            reason:
              "Local memory could not be checked. Games are playable, but progression is unavailable."
          });
        }

        this.ui.boot();
      }
    }

    const thumbArena = new App();
    thumbArena.start();
  </script>
</body>
