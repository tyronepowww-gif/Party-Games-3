<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <meta name="theme-color" content="#101328" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  />
  <meta name="apple-mobile-web-app-title" content="Thumb Arena" />
  <title>Thumb Arena</title>

  <style>
    :root {
      --bg: #101328;
      --bg2: #211847;
      --panel: rgba(39, 43, 84, 0.95);
      --panel-light: rgba(255, 255, 255, 0.09);
      --line: rgba(255, 255, 255, 0.14);
      --text: #f8f9ff;
      --muted: #bcc3e7;
      --cyan: #57e5ff;
      --pink: #ff6e97;
      --green: #90ff6b;
      --gold: #ffd35f;
      --purple: #ad7dff;
      --orange: #ff9f5a;
      --danger: #ff5372;
      --safe-top: max(12px, env(safe-area-inset-top));
      --safe-bottom: max(12px, env(safe-area-inset-bottom));
      --shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #060713;
      color: var(--text);
      font-family:
        ui-rounded,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      filter: grayscale(1);
      opacity: 0.55;
    }

    .hidden {
      display: none !important;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 560px;
      margin: 0 auto;
      overflow: hidden;
      background:
        radial-gradient(
          circle at 12% 10%,
          rgba(87, 229, 255, 0.17),
          transparent 30%
        ),
        radial-gradient(
          circle at 90% 22%,
          rgba(173, 125, 255, 0.18),
          transparent 30%
        ),
        linear-gradient(155deg, var(--bg), var(--bg2));
    }

    #app::before,
    #app::after {
      position: absolute;
      z-index: 0;
      width: 175px;
      height: 175px;
      content: "";
      border-radius: 50%;
      opacity: 0.16;
      pointer-events: none;
      filter: blur(3px);
      animation: floatBlob 9s ease-in-out infinite;
    }

    #app::before {
      top: -76px;
      left: -76px;
      background: var(--cyan);
    }

    #app::after {
      right: -75px;
      bottom: -75px;
      background: var(--purple);
      animation-delay: -4s;
    }

    .screen {
      position: absolute;
      z-index: 2;
      inset: 0;
      display: none;
      overflow-x: hidden;
      overflow-y: auto;
      padding: var(--safe-top) 18px var(--safe-bottom);
    }

    .screen.active {
      display: flex;
      flex-direction: column;
      animation: screenIn 0.24s ease both;
    }

    .center {
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .console-shell {
      display: flex;
      width: min(370px, 100%);
      min-height: 310px;
      padding: 30px 22px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 2px solid rgba(255, 255, 255, 0.16);
      border-radius: 36px;
      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.18),
          rgba(255, 255, 255, 0.03),
          #575b74
        );
      box-shadow:
        inset 0 3px 2px rgba(255, 255, 255, 0.18),
        var(--shadow);
    }

    .brand {
      margin: 0;
      font-size: clamp(2.65rem, 14vw, 4.8rem);
      line-height: 0.86;
      letter-spacing: -0.1em;
      text-shadow: 0 5px 0 rgba(0, 0, 0, 0.18);
    }

    .brand span {
      color: var(--cyan);
    }

    .tagline {
      margin: 14px 0 28px;
      color: var(--muted);
    }

    .disc {
      display: grid;
      width: 132px;
      height: 132px;
      margin-bottom: 25px;
      place-items: center;
      border: 10px solid #282b43;
      border-radius: 50%;
      color: #17182b;
      font-size: 2rem;
      background:
        radial-gradient(circle at center, #242740 0 14%, transparent 15%),
        repeating-conic-gradient(
          #ff6e97 0 36deg,
          #ffd35f 36deg 72deg,
          #57e5ff 72deg 108deg,
          #ad7dff 108deg 144deg,
          #90ff6b 144deg 180deg
        );
      box-shadow:
        0 13px 22px rgba(0, 0, 0, 0.35),
        inset 0 0 0 2px rgba(255, 255, 255, 0.4);
      animation: spinDisc 8s linear infinite;
    }

    .btn {
      width: 100%;
      min-height: 54px;
      padding: 13px 16px;
      border-radius: 18px;
      color: #13152a;
      font-weight: 950;
      letter-spacing: 0.04em;
      background: var(--cyan);
      box-shadow:
        0 6px 0 rgba(0, 0, 0, 0.22),
        0 12px 21px rgba(0, 0, 0, 0.18);
      transition:
        transform 0.12s ease,
        filter 0.12s ease;
    }

    .btn:active {
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.22);
      filter: brightness(0.92);
      transform: translateY(4px);
    }

    .btn.secondary {
      color: #242644;
      background: #f0f2ff;
    }

    .btn.dark {
      color: var(--text);
      background: #3a3e69;
    }

    .btn.green {
      color: #112715;
      background: var(--green);
    }

    .btn.warn {
      color: #37101d;
      background: var(--pink);
    }

    .btn-row {
      display: flex;
      width: 100%;
      gap: 10px;
    }

    .btn-row .btn {
      flex: 1;
    }

    .topbar {
      display: flex;
      margin-bottom: 18px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .topbar h2,
    .topbar p {
      margin: 0;
    }

    .topbar h2 {
      font-size: 1.3rem;
      letter-spacing: -0.04em;
    }

    .topbar p {
      margin-top: 3px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .icon-btn {
      display: grid;
      width: 48px;
      height: 48px;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 15px;
      color: var(--text);
      font-size: 1.18rem;
      background: var(--panel);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
    }

    .card,
    .panel {
      border: 1px solid var(--line);
      border-radius: 24px;
      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.13),
          rgba(255, 255, 255, 0.035),
          var(--panel)
        );
      box-shadow: var(--shadow);
    }

    .card {
      min-height: 174px;
      padding: 16px;
      color: var(--text);
      text-align: left;
    }

    .card.wide {
      min-height: 132px;
      grid-column: 1 / -1;
    }

    .card:active {
      transform: scale(0.98);
    }

    .card-icon {
      display: grid;
      width: 58px;
      height: 58px;
      margin-bottom: 12px;
      place-items: center;
      border-radius: 19px;
      color: #15172b;
      font-size: 1.65rem;
      box-shadow: inset 0 2px 6px rgba(255, 255, 255, 0.42);
    }

    .card h3 {
      margin: 0 0 5px;
      font-size: 1rem;
      line-height: 1.04;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.76rem;
      line-height: 1.28;
    }

    .badge {
      display: inline-block;
      margin-top: 11px;
      padding: 4px 8px;
      border-radius: 999px;
      color: #16172b;
      font-size: 0.64rem;
      font-weight: 950;
      background: #eff1ff;
    }

    .badge.green {
      background: var(--green);
    }

    .badge.gold {
      background: var(--gold);
    }

    .badge.dim {
      color: #eef0ff;
      background: #555b84;
    }

    .panel {
      padding: 18px;
    }

    .panel h3 {
      margin: 0 0 9px;
      font-size: 1.08rem;
    }

    .panel p {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.42;
    }

    .list {
      display: grid;
      gap: 10px;
    }

    .row {
      display: flex;
      min-height: 56px;
      padding: 11px 13px;
      align-items: center;
      justify-content: space-between;
      gap: 11px;
      border-radius: 16px;
      background: var(--panel-light);
    }

    .row strong,
    .row small {
      display: block;
    }

    .row small {
      margin-top: 3px;
      color: var(--muted);
    }

    .slot {
      display: flex;
      min-width: 0;
      align-items: center;
    }

    .slot-dot {
      width: 14px;
      height: 14px;
      margin-right: 10px;
      flex: 0 0 auto;
      border: 2px solid rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      background: transparent;
    }

    .slot-dot.active {
      background: var(--green);
      box-shadow: 0 0 13px rgba(144, 255, 107, 0.8);
    }

    .label {
      display: block;
      margin: 14px 0 7px;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .input {
      width: 100%;
      min-height: 50px;
      padding: 12px 13px;
      border: 1px solid var(--line);
      border-radius: 15px;
      outline: none;
      color: var(--text);
      background: #25294c;
      user-select: text;
      -webkit-user-select: text;
    }

    .numbers {
      display: flex;
      margin: 9px 0 15px;
      gap: 8px;
    }

    .number-btn {
      display: grid;
      width: 52px;
      height: 48px;
      place-items: center;
      border-radius: 15px;
      color: var(--text);
      font-weight: 950;
      background: #3d426c;
    }

    .number-btn.active {
      color: #14233a;
      background: var(--cyan);
    }

    .code-box {
      margin: 10px 0 17px;
      padding: 14px;
      border: 1px dashed rgba(255, 255, 255, 0.35);
      border-radius: 15px;
      color: var(--gold);
      font-size: 1.65rem;
      font-weight: 1000;
      letter-spacing: 0.15em;
      text-align: center;
      background: rgba(0, 0, 0, 0.17);
    }

    .notice {
      margin: 14px 0;
      padding: 12px 13px;
      border: 1px solid rgba(87, 229, 255, 0.32);
      border-radius: 15px;
      color: #cdf9ff;
      font-size: 0.82rem;
      line-height: 1.42;
      background: rgba(87, 229, 255, 0.09);
    }

    .notice.warning {
      border-color: rgba(255, 83, 114, 0.52);
      color: #ffd5df;
      background: rgba(255, 83, 114, 0.12);
    }

    .integrity-pill {
      display: inline-flex;
      padding: 5px 9px;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(144, 255, 107, 0.46);
      border-radius: 999px;
      color: #b9ff9f;
      font-size: 0.62rem;
      font-weight: 1000;
      letter-spacing: 0.06em;
      background: rgba(144, 255, 107, 0.11);
    }

    .integrity-pill.quarantined {
      border-color: rgba(255, 83, 114, 0.52);
      color: #ffd4dd;
      background: rgba(255, 83, 114, 0.14);
    }

    .game-screen {
      overflow: hidden;
      padding: var(--safe-top) 10px var(--safe-bottom);
    }

    .hud {
      display: flex;
      min-height: 58px;
      padding: 0 4px 8px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .hud-label {
      display: block;
      color: var(--muted);
      font-size: 0.67rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .hud-value {
      display: block;
      max-width: calc(100vw - 100px);
      overflow: hidden;
      font-size: 1.1rem;
      font-weight: 1000;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .game-area {
      position: relative;
      min-height: 0;
      flex: 1;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 24px;
      touch-action: none;
      background:
        radial-gradient(
          circle at 20% 18%,
          rgba(255, 255, 255, 0.09) 0 2px,
          transparent 3px
        ),
        linear-gradient(155deg, #30366a, #16182e);
      box-shadow: inset 0 0 35px rgba(0, 0, 0, 0.3);
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .target {
      position: absolute;
      z-index: 3;
      display: grid;
      width: 66px;
      height: 66px;
      place-items: center;
      transform: translate(-50%, -50%);
      border: 5px solid #fff;
      border-radius: 50%;
      color: #3a201a;
      font-size: 1.05rem;
      font-weight: 1000;
      background: var(--orange);
      box-shadow:
        0 7px 0 rgba(0, 0, 0, 0.18),
        0 0 20px rgba(255, 159, 90, 0.5);
      touch-action: none;
      animation: targetPulse 0.72s ease-in-out infinite alternate;
    }

    .target.gold {
      background: var(--gold);
      box-shadow:
        0 7px 0 rgba(0, 0, 0, 0.18),
        0 0 26px rgba(255, 211, 95, 0.78);
    }

    .overlay {
      position: absolute;
      z-index: 10;
      inset: 0;
      display: grid;
      padding: 20px;
      place-items: center;
      text-align: center;
      background: rgba(8, 10, 28, 0.76);
      backdrop-filter: blur(5px);
    }

    .overlay-card {
      width: min(365px, 100%);
      padding: 24px 18px;
      border: 1px solid var(--line);
      border-radius: 26px;
      background: linear-gradient(145deg, #3d4379, #24284e);
      box-shadow: var(--shadow);
    }

    .overlay-card h2 {
      margin: 0 0 8px;
      font-size: 1.65rem;
    }

    .overlay-card p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.42;
    }

    .result-screen {
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .result-card {
      width: min(430px, 100%);
      padding: 25px 18px;
      border: 1px solid var(--line);
      border-radius: 29px;
      background: linear-gradient(145deg, #3c4173, #24274b);
      box-shadow: var(--shadow);
    }

    .result-card h1 {
      margin: 0;
      font-size: 2rem;
      letter-spacing: -0.06em;
    }

    .result-card p {
      margin: 8px 0 17px;
      color: var(--muted);
    }

    .rankings {
      display: grid;
      margin: 15px 0 18px;
      gap: 8px;
      text-align: left;
    }

    .rank {
      display: flex;
      min-height: 50px;
      padding: 10px 13px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.08);
    }

    .rank:first-child {
      border: 1px solid rgba(255, 211, 95, 0.55);
      background: rgba(255, 211, 95, 0.18);
    }

    .rank span {
      color: var(--cyan);
      font-size: 0.85rem;
      font-weight: 850;
      text-align: right;
    }

    .modal {
      position: absolute;
      z-index: 50;
      inset: 0;
      display: none;
      padding: 20px;
      align-items: center;
      justify-content: center;
      background: rgba(4, 5, 16, 0.72);
      backdrop-filter: blur(6px);
    }

    .modal.show {
      display: flex;
    }

    .modal-card {
      width: min(390px, 100%);
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 26px;
      background: #2d315b;
      box-shadow: var(--shadow);
    }

    .modal-card h3 {
      margin: 0 0 8px;
    }

    .modal-card p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.42;
    }

    .toast {
      position: absolute;
      z-index: 80;
      bottom: calc(var(--safe-bottom) + 12px);
      left: 50%;
      max-width: calc(100% - 36px);
      padding: 11px 15px;
      border-radius: 999px;
      color: #18192d;
      font-size: 0.84rem;
      font-weight: 950;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      background: #f6f7ff;
      box-shadow: var(--shadow);
      transform: translate(-50%, 130px);
      transition:
        opacity 0.2s ease,
        transform 0.25s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .integrity-badge {
      position: absolute;
      z-index: 8;
      top: 12px;
      left: 12px;
      padding: 6px 9px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      color: #b9ff9f;
      font-size: 0.61rem;
      font-weight: 1000;
      letter-spacing: 0.06em;
      pointer-events: none;
      background: rgba(11, 14, 34, 0.72);
    }

    .integrity-badge.quarantined {
      border-color: rgba(255, 83, 114, 0.5);
      color: #ffd2dc;
    }

    .boot-screen {
      position: fixed;
      z-index: 9999;
      inset: 0;
      display: grid;
      padding: 20px;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(87, 229, 255, 0.15),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 85%,
          rgba(255, 110, 151, 0.12),
          transparent 32%
        ),
        linear-gradient(155deg, #101328, #211847);
      transition:
        opacity 0.35s ease,
        visibility 0.35s ease;
    }

    .boot-screen.boot-complete {
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
    }

    .console-frame {
      position: relative;
      width: min(420px, 100%);
      min-height: 455px;
      padding: 27px 22px 22px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.18);
      border-radius: 34px;
      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.18),
          rgba(255, 255, 255, 0.025) 46%,
          rgba(32, 36, 74, 0.95)
        );
      box-shadow:
        inset 0 2px 1px rgba(255, 255, 255, 0.22),
        inset 0 -8px 20px rgba(0, 0, 0, 0.18),
        0 22px 55px rgba(0, 0, 0, 0.42);
      text-align: center;
    }

    .console-lights {
      position: absolute;
      top: 16px;
      right: 18px;
      display: flex;
      gap: 7px;
    }

    .console-lights span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #5c638f;
    }

    .console-lights span:nth-child(1) {
      background: var(--green);
      box-shadow: 0 0 10px rgba(144, 255, 107, 0.85);
      animation: consoleBlink 1.15s steps(2, end) infinite;
    }

    .console-lights span:nth-child(2) {
      background: var(--gold);
      box-shadow: 0 0 10px rgba(255, 211, 95, 0.72);
      animation: consoleBlink 1.15s steps(2, end) 0.28s infinite;
    }

    .console-lights span:nth-child(3) {
      background: var(--pink);
      box-shadow: 0 0 10px rgba(255, 110, 151, 0.62);
      animation: consoleBlink 1.15s steps(2, end) 0.55s infinite;
    }

    .boot-disc {
      display: grid;
      width: 128px;
      height: 128px;
      margin: 13px auto 21px;
      place-items: center;
      border: 9px solid #282b43;
      border-radius: 50%;
      background:
        radial-gradient(circle at center, #242740 0 18%, transparent 19%),
        repeating-conic-gradient(
          #ff6e97 0 36deg,
          #ffd35f 36deg 72deg,
          #57e5ff 72deg 108deg,
          #ad7dff 108deg 144deg,
          #90ff6b 144deg 180deg
        );
      box-shadow:
        0 12px 23px rgba(0, 0, 0, 0.38),
        inset 0 0 0 2px rgba(255, 255, 255, 0.38);
      animation: bootDiscSpin 4s linear infinite;
    }

    .boot-disc-core {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border: 3px solid rgba(255, 255, 255, 0.32);
      border-radius: 50%;
      color: #f7f8ff;
      font-size: 0.82rem;
      font-weight: 1000;
      letter-spacing: -0.06em;
      background: #171a31;
      box-shadow: 0 0 16px rgba(87, 229, 255, 0.4);
      animation: bootDiscCounterSpin 4s linear infinite;
    }

    .boot-kicker {
      margin: 0 0 7px;
      color: var(--muted);
      font-size: 0.67rem;
      font-weight: 950;
      letter-spacing: 0.15em;
    }

    .boot-title {
      margin: 0;
      color: var(--text);
      font-size: clamp(1.65rem, 7vw, 2.35rem);
      letter-spacing: -0.06em;
    }

    .boot-cursor {
      color: var(--cyan);
      animation: cursorBlink 0.8s steps(2, end) infinite;
    }

    .boot-monitor {
      position: relative;
      z-index: 2;
      margin-top: 27px;
      padding: 15px;
      border: 1px solid rgba(87, 229, 255, 0.25);
      border-radius: 18px;
      text-align: left;
      background: rgba(5, 7, 21, 0.35);

    class ConsoleBootScreen {
      constructor() {
        this.screen = document.getElementById("bootScreen");
        this.icon = document.getElementById("bootIcon");
        this.step = document.getElementById("bootStep");
        this.percent = document.getElementById("bootPercent");
        this.progress = document.getElementById("bootProgress");
        this.message = document.getElementById("bootMessage");
        this.currentProgress = 0;
      }

      async showStep({
        icon = "◌",
        title,
        message,
        progress,
        minimumDuration = 240
      }) {
        const startedAt = performance.now();

        this.icon.textContent = icon;
        this.step.textContent = title;
        this.message.textContent = message;

        await this.setProgress(progress);

        const elapsed = performance.now() - startedAt;
        const remaining = Math.max(0, minimumDuration - elapsed);

        if (remaining > 0) {
          await new Promise((resolve) => setTimeout(resolve, remaining));
        }
      }

      setProgress(targetProgress) {
        const target = Math.max(0, Math.min(100, targetProgress));

        return new Promise((resolve) => {
          const start = this.currentProgress;
          const startedAt = performance.now();
          const duration = Math.max(180, Math.abs(target - start) * 8);

          const update = (now) => {
            const ratio = Math.min(1, (now - startedAt) / duration);
            const eased = 1 - Math.pow(1 - ratio, 3);

            this.currentProgress = Math.round(
              start + (target - start) * eased
            );

            this.progress.style.width = `${this.currentProgress}%`;
            this.percent.textContent = `${this.currentProgress}%`;

            if (ratio < 1) {
              requestAnimationFrame(update);
              return;
            }

            this.currentProgress = target;
            this.progress.style.width = `${target}%`;
            this.percent.textContent = `${target}%`;
            resolve();
          };

          requestAnimationFrame(update);
        });
      }

      async complete({ verified, reason = "" }) {
        if (verified) {
          this.icon.textContent = "✓";
          this.step.textContent = "SYSTEM READY";
          this.message.textContent =
            "Local save integrity confirmed. Loading Thumb Arena.";
        } else {
          this.icon.textContent = "!";
          this.step.textContent = "PLAY MODE READY";
          this.message.textContent =

        }

        );

        await new Promise((resolve) => setTimeout(resolve, 360));

        this.screen.remove();
      }
    }

    class SecureStorageManager {
      constructor() {
        this.db = null;
        this.integrityKey = null;
        this.record = null;
        this.payload = null;
        this.verified = false;
        this.integrityReason = "";
        this.memoryOnly = false;
      }

      async initialize(boot) {
        await boot.showStep({
          icon: "▣",
          title: "MEMORY CHECK",
          message: "Opening local cartridge memory.",
          progress: 15,
          minimumDuration: 340
        });

        this.db = await this.openDatabase();

        await boot.showStep({
          icon: "◈",
          title: "KEY CARTRIDGE CHECK",
          message: "Loading protected local integrity key.",
          progress: 35,
          minimumDuration: 390
        });

        this.integrityKey = await this.getOrCreateIntegrityKey();

        await boot.showStep({
          icon: "⌁",
          title: "SAVE CHECKSUM",
          message: "Reading signed local profile data.",
          progress: 56,
          minimumDuration: 360
        });

        const stored = await this.getFromStore(STORE_SAVE, SAVE_RECORD_ID);

        if (!stored) {
          await boot.showStep({
            icon: "+",
            title: "NEW PROFILE",
            message: "Creating a fresh local player profile.",
            progress: 73,
            minimumDuration: 400
          });

          this.payload = this.createDefaultPayload();
          this.record = await this.writeVerifiedSave(this.payload);
          this.verified = true;
          this.integrityReason = "";

          await boot.showStep({
            icon: "≋",
            title: "REPLAY LOG CHECK",
            message: "No prior game records found.",
            progress: 91,
            minimumDuration: 250
          });

          return;
        }

        this.record = stored;
        this.payload = stored.payload;

        await boot.showStep({
          icon: "⌁",
          title: "SIGNATURE VERIFY",
          message: "Confirming local save data has not changed.",
          progress: 74,
          minimumDuration: 420
        });

        if (!this.payload || typeof stored.signature !== "string") {
          this.verified = false;
          this.integrityReason = "Save record is incomplete.";
          return;
        }

        const signatureValid = await this.verifyPayload(
          stored.payload,
          stored.signature
        );

        if (!signatureValid) {
          this.verified = false;
          this.integrityReason = "Save signature did not match.";
          return;
        }

        await boot.showStep({
          icon: "≋",
          title: "REPLAY LOG CHECK",
          message: "Validating game history and progression rules.",
          progress: 91,
          minimumDuration: 420
        });

        const ledgerCheck = await this.verifyLedger(stored.payload.ledger);

        if (!ledgerCheck.valid) {
          this.verified = false;
          this.integrityReason = ledgerCheck.reason;
          return;
        }

        this.verified = true;
        this.integrityReason = "";
      }

      createDefaultPayload() {
        return {
          version: SAVE_VERSION,
          createdAt: Date.now(),
          updatedAt: Date.now(),
          ledger: []
        };
      }

      async openDatabase() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(DATABASE_NAME, DATABASE_VERSION);

          request.onupgradeneeded = () => {
            const db = request.result;

            if (!db.objectStoreNames.contains(STORE_KEYS)) {
              db.createObjectStore(STORE_KEYS);
            }

            if (!db.objectStoreNames.contains(STORE_SAVE)) {
              db.createObjectStore(STORE_SAVE);
            }
          };

          request.onsuccess = () => resolve(request.result);

          request.onerror = () => {
            reject(request.error || new Error("Could not open IndexedDB."));
          };
        });
      }

      getFromStore(storeName, key) {
        return new Promise((resolve, reject) => {
          const transaction = this.db.transaction(storeName, "readonly");
          const store = transaction.objectStore(storeName);
          const request = store.get(key);

          request.onsuccess = () => resolve(request.result);

          request.onerror = () => {
            reject(request.error || new Error("Could not read storage."));
          };
        });
      }

      putInStore(storeName, key, value) {
        return new Promise((resolve, reject) => {
          const transaction = this.db.transaction(storeName, "readwrite");
          const store = transaction.objectStore(storeName);

          store.put(value, key);

          transaction.oncomplete = () => resolve();

          transaction.onerror = () => {
            reject(transaction.error || new Error("Could not save storage."));
          };
        });
      }

      deleteFromStore(storeName, key) {
        return new Promise((resolve, reject) => {
          const transaction = this.db.transaction(storeName, "readwrite");
          const store = transaction.objectStore(storeName);

          store.delete(key);

          transaction.oncomplete = () => resolve();

          transaction.onerror = () => {
            reject(transaction.error || new Error("Could not delete storage."));
          };
        });
      }

      async getOrCreateIntegrityKey() {
        const storedKey = await this.getFromStore(
          STORE_KEYS,
          INTEGRITY_KEY_ID
        );

        if (storedKey) {
          return storedKey;
        }

        const key = await crypto.subtle.generateKey(
          {
            name: "HMAC",
            hash: "SHA-256"
          },
          false,
          ["sign", "verify"]
        );

        await this.putInStore(STORE_KEYS, INTEGRITY_KEY_ID, key);

        return key;
      }

      stableStringify(value) {
        if (value === null || typeof value !== "object") {
          return JSON.stringify(value);
        }

        if (Array.isArray(value)) {
          return `[${value.map((item) => this.stableStringify(item)).join(",")}]`;
        }

        return `{${Object.keys(value)
          .sort()
          .map(
            (key) =>
              `${JSON.stringify(key)}:${this.stableStringify(value[key])}`
          )
          .join(",")}}`;
      }

      bytesToBase64(bytes) {
        let binary = "";

        for (const byte of new Uint8Array(bytes)) {
          binary += String.fromCharCode(byte);
        }

        return btoa(binary);
      }

      base64ToBytes(base64) {
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);

        for (let index = 0; index < binary.length; index += 1) {
          bytes[index] = binary.charCodeAt(index);
        }

        return bytes;
      }

      async sha256Base64(value) {
        const buffer = await crypto.subtle.digest(
          "SHA-256",
          encoder.encode(value)
        );

        return this.bytesToBase64(buffer);
      }

      async signPayload(payload) {
        const signature = await crypto.subtle.sign(
          "HMAC",
          this.integrityKey,
          encoder.encode(this.stableStringify(payload))
        );

        return this.bytesToBase64(signature);
      }

      async verifyPayload(payload, signature) {
        return crypto.subtle.verify(
          "HMAC",
          this.integrityKey,
          this.base64ToBytes(signature),
          encoder.encode(this.stableStringify(payload))
        );
      }

      async calculateEventHash(eventWithoutHash) {
        return this.sha256Base64(this.stableStringify(eventWithoutHash));
      }

      async writeVerifiedSave(payload) {
        const signature = await this.signPayload(payload);

        const record = {
          version: SAVE_VERSION,
          payload,
          signature,
          savedAt: Date.now()
        };

        await this.putInStore(STORE_SAVE, SAVE_RECORD_ID, record);

        this.payload = payload;
        this.record = record;

        return record;
      }

      async verifyLedger(ledger) {
        if (!Array.isArray(ledger)) {
          return {
            valid: false,
            reason: "Replay log is not valid."
          };
        }

        let expectedPreviousHash = ZERO_HASH;
        let previousTimestamp = 0;

        for (const event of ledger) {
          if (
            !event ||
            typeof event !== "object" ||
            typeof event.id !== "string" ||
            typeof event.type !== "string" ||
            typeof event.timestamp !== "number" ||
            typeof event.previousHash !== "string" ||
            typeof event.hash !== "string"
          ) {
            return {
              valid: false,
              reason: "Replay log has invalid event data."
            };
          }

          if (event.previousHash !== expectedPreviousHash) {
            return {
              valid: false,
              reason: "Replay log chain is broken."
            };
          }

          if (event.timestamp < previousTimestamp) {
            return {
              valid: false,
              reason: "Replay log timestamps are not ordered."
            };
          }

          const eventWithoutHash = {
            id: event.id,
            type: event.type,
            data: event.data,
            timestamp: event.timestamp,
            previousHash: event.previousHash
          };

          const expectedHash = await this.calculateEventHash(eventWithoutHash);

          if (expectedHash !== event.hash) {
            return {
              valid: false,
              reason: "Replay log event checksum failed."
            };
          }

          const validation = this.validateGameResult(event.data);

          if (!validation.valid) {
            return validation;
          }

          expectedPreviousHash = event.hash;
          previousTimestamp = event.timestamp;
        }

        return { valid: true };
      }

      validateGameResult(result) {
        if (!result || typeof result !== "object") {
          return {
            valid: false,
            reason: "Invalid game result."
          };
        }

        const rules = GAME_RULES[result.gameId];

        if (!rules) {
          return {
            valid: false,
            reason: "Unknown game result."
          };
        }

        if (
          !Number.isFinite(result.xpAwarded) ||
          result.xpAwarded < 0 ||
          result.xpAwarded > rules.maxXp
        ) {
          return {
            valid: false,
            reason: "Invalid XP award."
          };
        }

        if (
          result.gameId === "dodge" ||
          result.gameId === "dodge2" ||
          result.gameId === "target" ||
          result.gameId === "target2" ||
          result.gameId === "quest" ||
          result.gameId === "brawl" ||
          result.gameId === "treasure" ||
          result.gameId === "boss"
        ) {
          if (
            !Number.isFinite(result.durationSeconds) ||
            result.durationSeconds <= 0 ||
            result.durationSeconds > rules.maxDurationSeconds
          ) {
            return {
              valid: false,
              reason: "Game duration is outside accepted limits."
            };
          }

          if (
            !Number.isFinite(result.score) ||
            result.score < 0 ||
            result.score >
              result.durationSeconds * rules.maxScorePerSecond
          ) {
            return {
              valid: false,
              reason: "Game score is outside accepted limits."
            };
          }
        }

        if (result.gameId === "reflex" || result.gameId === "reflex2") {
          if (
            !Number.isFinite(result.reactionMs) ||
            result.reactionMs < rules.minReactionMs ||
            result.reactionMs > rules.maxReactionMs
          ) {
            return {
              valid: false,
              reason: "Reaction time is outside accepted limits."
            };
          }
        }

        const expectedXp = rules.xpFormula(result);

        if (result.xpAwarded !== expectedXp) {
          return {
            valid: false,
            reason: "XP award does not match game rules."
          };
        }

        return { valid: true };
      }

      randomId(length = 16) {
        const bytes = new Uint8Array(length);
        crypto.getRandomValues(bytes);

        return Array.from(bytes, (byte) =>
          byte.toString(16).padStart(2, "0")
        ).join("");
      }

      async createGameEvent(result) {
        const ledger = this.payload.ledger;
        const previousEvent = ledger[ledger.length - 1];

        const eventWithoutHash = {
          id: this.randomId(),
          type: "game-completed",
          data: result,
          timestamp: Date.now(),
          previousHash: previousEvent ? previousEvent.hash : ZERO_HASH
        };

        const hash = await this.calculateEventHash(eventWithoutHash);

        return {
          ...eventWithoutHash,
          hash
        };
      }

      async recordGameResult(result) {
        if (!this.verified) {
          return {
            saved: false,
            reason: "Progression is quarantined."
          };
        }

        const validation = this.validateGameResult(result);

        if (!validation.valid) {
          return {
            saved: false,
            reason: validation.reason
          };
        }

        const event = await this.createGameEvent(result);

        const nextPayload = {
          ...this.payload,
          updatedAt: Date.now(),
          ledger: [...this.payload.ledger, event]
        };

        await this.writeVerifiedSave(nextPayload);

        return {
          saved: true,
          reason: ""
        };
      }

      deriveProfile() {
        const profile = {
          xp: 0,
          level: 1,
          title: "Rookie",
          unlocks: ["Neon Trail"],
          gamesPlayed: 0,
          wins: 0,
          longestSurvival: 0,
          targetHigh: 0,
          fastestReaction: null,
          reactionSum: 0,
          reactionCount: 0,
          dodgeStorm2Record: 0
        };

        if (!this.payload || !Array.isArray(this.payload.ledger)) {
          return profile;
        }

        for (const event of this.payload.ledger) {
          if (event.type !== "game-completed") {
            continue;
          }

          const result = event.data;

          profile.gamesPlayed += 1;
          profile.wins += 1;
          profile.xp += result.xpAwarded || 0;

          if (result.gameId === "dodge") {
            profile.longestSurvival = Math.max(
              profile.longestSurvival,
              result.durationSeconds || 0
            );
          }

          if (result.gameId === "dodge2") {
            profile.dodgeStorm2Record = Math.max(
              profile.dodgeStorm2Record,
              result.durationSeconds || 0
            );
          }

          if (result.gameId === "target") {
            profile.targetHigh = Math.max(
              profile.targetHigh,
              result.score || 0
            );
          }

          if (
            result.gameId === "reflex" ||
            result.gameId === "reflex2"
          ) {
            profile.fastestReaction =
              profile.fastestReaction === null
                ? result.reactionMs
                : Math.min(profile.fastestReaction, result.reactionMs);

            profile.reactionSum += result.reactionMs;
            profile.reactionCount += 1;
          }
        }

        profile.level = Math.max(1, Math.floor(profile.xp / 100) + 1);

        if (profile.level >= 3) {
          profile.unlocks.push("Gold Sparks");
        }

        if (profile.level >= 5) {
          profile.unlocks.push("Storm Master");
          profile.title = "Storm Master";
        }

        if (profile.level >= 10) {
          profile.unlocks.push("Arena Legend");
          profile.title = "Arena Legend";
        }

        return profile;
      }

      averageReaction() {
        const profile = this.deriveProfile();

        if (!profile.reactionCount) {
          return null;
        }

        return Math.round(profile.reactionSum / profile.reactionCount);
      }

      async resetAll() {
        if (!this.db) {
          this.db = await this.openDatabase();
        }

        await this.deleteFromStore(STORE_SAVE, SAVE_RECORD_ID);
        await this.deleteFromStore(STORE_KEYS, INTEGRITY_KEY_ID);

        this.integrityKey = await this.getOrCreateIntegrityKey();
        this.payload = this.createDefaultPayload();
        this.record = await this.writeVerifiedSave(this.payload);
        this.verified = true;
        this.integrityReason = "";
      }

      async recheck() {
        this.verified = false;
        this.integrityReason = "";

        this.record = await this.getFromStore(STORE_SAVE, SAVE_RECORD_ID);

        if (!this.record || !this.record.payload) {
          this.integrityReason = "Save record is missing.";
          return false;
        }

        this.payload = this.record.payload;

        const signatureValid = await this.verifyPayload(
          this.record.payload,
          this.record.signature
        );

        if (!signatureValid) {
          this.integrityReason = "Save signature did not match.";
          return false;
        }

        const ledgerCheck = await this.verifyLedger(this.payload.ledger);

        if (!ledgerCheck.valid) {
          this.integrityReason = ledgerCheck.reason;
          return false;
        }

        this.verified = true;
        return true;
      }
    }

    class AudioManager {
      constructor(storage) {
        this.storage = storage;
        this.context = null;
      }

      sound(type = "click") {
        if (!this.storage.verified) {
          return;
        }

        try {
          const AudioContextClass =
            window.AudioContext || window.webkitAudioContext;

          if (!AudioContextClass) {
            return;
          }

          if (!this.context) {
            this.context = new AudioContextClass();
          }

          if (this.context.state === "suspended") {
            this.context.resume();
          }

          const map = {
            click: [460, 0.05, "sine"],
            start: [720, 0.11, "sine"],
            hit: [135, 0.16, "sawtooth"],
            win: [900, 0.16, "triangle"],
            point: [760, 0.06, "square"],
            gold: [1040, 0.09, "sine"]
          };

          const [frequency, duration, wave] = map[type] || map.click;
          const oscillator = this.context.createOscillator();
          const gain = this.context.createGain();

          oscillator.type = wave;
          oscillator.frequency.setValueAtTime(
            frequency,
            this.context.currentTime
          );

          gain.gain.setValueAtTime(0.075, this.context.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            0.001,
            this.context.currentTime + duration
          );

          oscillator.connect(gain);
          gain.connect(this.context.destination);

          oscillator.start();
          oscillator.stop(this.context.currentTime + duration);
        } catch {
          return;
        }
      }

      vibrate(pattern = 16) {
        try {
          if ("vibrate" in navigator) {
            navigator.vibrate(pattern);
          }
        } catch {
          return;
        }
      }
    }

    class InputManager {
      attach(element, handlers) {
        let active = false;
        let pointerId = null;
        let startX = 0;
        let startY = 0;

        const getPoint = (event) => {
          const rect = element.getBoundingClientRect();

          return {
            x: Math.max(
              0,
              Math.min(1, (event.clientX - rect.left) / rect.width)
            ),
            y: Math.max(
              0,
              Math.min(1, (event.clientY - rect.top) / rect.height)
            )
          };
        };

        const onDown = (event) => {
          event.preventDefault();

          active = true;
          pointerId = event.pointerId;

          const point = getPoint(event);
          startX = point.x;
          startY = point.y;

          element.setPointerCapture?.(pointerId);

          handlers.down?.({
            ...point,
            pressed: true,
            released: false,
            tap: false
          });
        };

        const onMove = (event) => {
          if (!active || event.pointerId !== pointerId) {
            return;
          }

          event.preventDefault();

          const point = getPoint(event);

          handlers.move?.({
            ...point,
            pressed: true,
            released: false,
            tap: false
          });
        };

        const onUp = (event) => {
          if (!active || event.pointerId !== pointerId) {
            return;
          }

          event.preventDefault();

          const point = getPoint(event);
          active = false;

          handlers.up?.({
            ...point,
            pressed: false,
            released: true,
            tap: Math.hypot(point.x - startX, point.y - startY) < 0.04
          });
        };

        element.addEventListener("pointerdown", onDown, { passive: false });
        element.addEventListener("pointermove", onMove, { passive: false });
        element.addEventListener("pointerup", onUp, { passive: false });
        element.addEventListener("pointercancel", onUp, { passive: false });

        return () => {
          element.removeEventListener("pointerdown", onDown);
          element.removeEventListener("pointermove", onMove);
          element.removeEventListener("pointerup", onUp);
          element.removeEventListener("pointercancel", onUp);
        };
      }
    }

    class UIManager {
      constructor(app, storage, audio, gameManager) {
        this.app = app;
        this.storage = storage;
        this.audio = audio;
        this.gameManager = gameManager;
        this.toastTimer = null;
      }

      escape(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      render(html, className = "") {
        this.app.innerHTML = `
          <main class="screen active ${className}">
            ${html}
          </main>
          <div id="modal" class="modal"></div>
          <div id="toast" class="toast"></div>
        `;
      }

      bind(selector, callback) {
        const element = this.app.querySelector(selector);

        if (element) {
          element.addEventListener("click", callback);
        }

        return element;
      }

      toast(message) {
        const toast = this.app.querySelector("#toast");

        if (!toast) {
          return;
        }

        toast.textContent = message;
        toast.classList.add("show");

        clearTimeout(this.toastTimer);

        this.toastTimer = setTimeout(() => {
          toast.classList.remove("show");
        }, 1800);
      }

      modal(title, text, confirmLabel, onConfirm, warning = false) {
        const modal = this.app.querySelector("#modal");

        if (!modal) {
          return;
        }

        modal.innerHTML = `
          <div class="modal-card">
            <h3>${this.escape(title)}</h3>
            <p>${this.escape(text)}</p>
            <div class="btn-row">
              <button id="modalCancel" class="btn secondary">CANCEL</button>
              <button id="modalConfirm" class="btn ${warning ? "warn" : ""}">
                ${this.escape(confirmLabel)}
              </button>
            </div>
          </div>
        `;

        modal.classList.add("show");

        modal.querySelector("#modalCancel").onclick = () => {
          modal.classList.remove("show");
        };

        modal.querySelector("#modalConfirm").onclick = () => {
          modal.classList.remove("show");
          onConfirm?.();
        };
      }

            (item) => item.name === result.name

        if (tournament.currentRound >= tournament.totalRounds) {

            (a, b) => b.points - a.points

          this.gameManager.tournament = null;
          this.tournamentChampion(finalStandings);
