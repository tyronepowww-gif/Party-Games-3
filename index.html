<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"
  />
  <meta name="theme-color" content="#101328" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Thumb Arena" />
  <title>Thumb Arena</title>

  <style>
    :root {
      --bg: #101328;
      --bg2: #211847;
      --panel: rgba(39, 43, 84, 0.95);
      --panel-light: rgba(255, 255, 255, 0.09);
      --line: rgba(255, 255, 255, 0.14);
      --text: #f8f9ff;
      --muted: #bcc3e7;
      --cyan: #57e5ff;
      --pink: #ff6e97;
      --green: #90ff6b;
      --gold: #ffd35f;
      --purple: #ad7dff;
      --orange: #ff9f5a;
      --danger: #ff5372;
      --safe-top: max(12px, env(safe-area-inset-top));
      --safe-bottom: max(12px, env(safe-area-inset-bottom));
      --shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #060713;
      color: var(--text);
      font-family: ui-rounded, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 560px;
      margin: 0 auto;
      overflow: hidden;
      background:
        radial-gradient(circle at 12% 10%, rgba(87, 229, 255, 0.17), transparent 30%),
        radial-gradient(circle at 90% 22%, rgba(173, 125, 255, 0.18), transparent 30%),
        linear-gradient(155deg, var(--bg), var(--bg2));
    }

    #app::before,
    #app::after {
      position: absolute;
      z-index: 0;
      width: 175px;
      height: 175px;
      content: "";
      border-radius: 50%;
      opacity: 0.16;
      pointer-events: none;
      filter: blur(3px);
      animation: floatBlob 9s ease-in-out infinite;
    }

    #app::before {
      top: -76px;
      left: -76px;
      background: var(--cyan);
    }

    #app::after {
      right: -75px;
      bottom: -75px;
      background: var(--purple);
      animation-delay: -4s;
    }

    @keyframes floatBlob {
      50% {
        transform: translate(17px, 16px) scale(1.08);
      }
    }

    .screen {
      position: absolute;
      z-index: 2;
      inset: 0;
      display: none;
      overflow-x: hidden;
      overflow-y: auto;
      padding: var(--safe-top) 18px var(--safe-bottom);
    }

    .screen.active {
      display: flex;
      flex-direction: column;
      animation: screenIn 0.24s ease both;
    }

    @keyframes screenIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .center {
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .console-shell {
      display: flex;
      width: min(370px, 100%);
      min-height: 310px;
      padding: 30px 22px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 2px solid rgba(255, 255, 255, 0.16);
      border-radius: 36px;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.03)),
        #575b74;
      box-shadow: inset 0 3px 2px rgba(255, 255, 255, 0.18), var(--shadow);
    }

    .brand {
      margin: 0;
      font-size: clamp(2.65rem, 14vw, 4.8rem);
      line-height: 0.86;
      letter-spacing: -0.1em;
      text-shadow: 0 5px 0 rgba(0, 0, 0, 0.18);
    }

    .brand span {
      color: var(--cyan);
    }

    .tagline {
      margin: 14px 0 28px;
      color: var(--muted);
    }

    .disc {
      display: grid;
      width: 132px;
      height: 132px;
      margin-bottom: 25px;
      place-items: center;
      border: 10px solid #282b43;
      border-radius: 50%;
      color: #17182b;
      font-size: 2rem;
      background:
        radial-gradient(circle at center, #242740 0 14%, transparent 15%),
        repeating-conic-gradient(
          #ff6e97 0 36deg,
          #ffd35f 36deg 72deg,
          #57e5ff 72deg 108deg,
          #ad7dff 108deg 144deg,
          #90ff6b 144deg 180deg
        );
      box-shadow: 0 13px 22px rgba(0, 0, 0, 0.35), inset 0 0 0 2px rgba(255, 255, 255, 0.4);
      animation: spinDisc 8s linear infinite;
    }

    @keyframes spinDisc {
      to {
        transform: rotate(360deg);
      }
    }

    .btn {
      width: 100%;
      min-height: 54px;
      padding: 13px 16px;
      border-radius: 18px;
      color: #13152a;
      font-weight: 950;
      letter-spacing: 0.04em;
      background: var(--cyan);
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.22), 0 12px 21px rgba(0, 0, 0, 0.18);
      transition: transform 0.12s ease, filter 0.12s ease;
    }

    .btn:active {
      transform: translateY(4px);
      filter: brightness(0.92);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.22);
    }

    .btn.secondary {
      color: #242644;
      background: #f0f2ff;
    }

    .btn.dark {
      color: var(--text);
      background: #3a3e69;
    }

    .btn.green {
      color: #112715;
      background: var(--green);
    }

    .btn.warn {
      color: #37101d;
      background: var(--pink);
    }

    .btn-row {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .btn-row .btn {
      flex: 1;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .topbar h2,
    .topbar p {
      margin: 0;
    }

    .topbar h2 {
      font-size: 1.3rem;
      letter-spacing: -0.04em;
    }

    .topbar p {
      margin-top: 3px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .icon-btn {
      display: grid;
      width: 48px;
      height: 48px;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 15px;
      color: var(--text);
      font-size: 1.18rem;
      background: var(--panel);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
    }

    .card,
    .panel {
      border: 1px solid var(--line);
      border-radius: 24px;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.13), rgba(255, 255, 255, 0.035)),
        var(--panel);
      box-shadow: var(--shadow);
    }

    .card {
      min-height: 174px;
      padding: 16px;
      text-align: left;
    }

    .card.wide {
      grid-column: 1 / -1;
      min-height: 132px;
    }

    .card:active {
      transform: scale(0.98);
    }

    .card-icon {
      display: grid;
      width: 58px;
      height: 58px;
      margin-bottom: 12px;
      place-items: center;
      border-radius: 19px;
      color: #15172b;
      font-size: 1.65rem;
      box-shadow: inset 0 2px 6px rgba(255, 255, 255, 0.42);
    }

    .card h3 {
      margin: 0 0 5px;
      font-size: 1rem;
      line-height: 1.04;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.76rem;
      line-height: 1.28;
    }

    .badge {
      display: inline-block;
      margin-top: 11px;
      padding: 4px 8px;
      border-radius: 999px;
      color: #16172b;
      font-size: 0.64rem;
      font-weight: 950;
      background: #eff1ff;
    }

    .badge.green {
      background: var(--green);
    }

    .badge.gold {
      background: var(--gold);
    }

    .badge.dim {
      color: #eef0ff;
      background: #555b84;
    }

    .panel {
      padding: 18px;
    }

    .panel h3 {
      margin: 0 0 9px;
      font-size: 1.08rem;
    }

    .panel p {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.42;
    }

    .list {
      display: grid;
      gap: 10px;
    }

    .row {
      display: flex;
      min-height: 56px;
      padding: 11px 13px;
      align-items: center;
      justify-content: space-between;
      gap: 11px;
      border-radius: 16px;
      background: var(--panel-light);
    }

    .row strong,
    .row small {
      display: block;
    }

    .row small {
      margin-top: 3px;
      color: var(--muted);
    }

    .slot {
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .slot-dot {
      width: 14px;
      height: 14px;
      margin-right: 10px;
      flex: 0 0 auto;
      border: 2px solid rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      background: transparent;
    }

    .slot-dot.active {
      background: var(--green);
      box-shadow: 0 0 13px rgba(144, 255, 107, 0.8);
    }

    .label {
      display: block;
      margin: 14px 0 7px;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .input {
      width: 100%;
      min-height: 50px;
      padding: 12px 13px;
      border: 1px solid var(--line);
      border-radius: 15px;
      outline: none;
      color: var(--text);
      background: #25294c;
      user-select: text;
      -webkit-user-select: text;
    }

    .numbers {
      display: flex;
      gap: 8px;
      margin: 9px 0 15px;
    }

    .number-btn {
      display: grid;
      width: 52px;
      height: 48px;
      place-items: center;
      border-radius: 15px;
      color: var(--text);
      font-weight: 950;
      background: #3d426c;
    }

    .number-btn.active {
      color: #14233a;
      background: var(--cyan);
    }

    .code-box {
      margin: 10px 0 17px;
      padding: 14px;
      border: 1px dashed rgba(255, 255, 255, 0.35);
      border-radius: 15px;
      color: var(--gold);
      font-size: 1.65rem;
      font-weight: 1000;
      letter-spacing: 0.15em;
      text-align: center;
      background: rgba(0, 0, 0, 0.17);
    }

    .notice {
      margin: 14px 0;
      padding: 12px 13px;
      border: 1px solid rgba(87, 229, 255, 0.32);
      border-radius: 15px;
      color: #cdf9ff;
      font-size: 0.82rem;
      line-height: 1.42;
      background: rgba(87, 229, 255, 0.09);
    }

    .game-screen {
      overflow: hidden;
      padding: var(--safe-top) 10px var(--safe-bottom);
    }

    .hud {
      display: flex;
      min-height: 58px;
      padding: 0 4px 8px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .hud-label {
      display: block;
      color: var(--muted);
      font-size: 0.67rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .hud-value {
      display: block;
      max-width: calc(100vw - 100px);
      overflow: hidden;
      font-size: 1.1rem;
      font-weight: 1000;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .game-area {
      position: relative;
      min-height: 0;
      flex: 1;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 24px;
      touch-action: none;
      background:
        radial-gradient(circle at 20% 18%, rgba(255, 255, 255, 0.09) 0 2px, transparent 3px),
        linear-gradient(155deg, #30366a, #16182e);
      box-shadow: inset 0 0 35px rgba(0, 0, 0, 0.3);
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .target {
      position: absolute;
      z-index: 3;
      display: grid;
      width: 66px;
      height: 66px;
      place-items: center;
      transform: translate(-50%, -50%);
      border: 5px solid #fff;
      border-radius: 50%;
      color: #3a201a;
      font-size: 1.05rem;
      font-weight: 1000;
      background: var(--orange);
      box-shadow: 0 7px 0 rgba(0, 0, 0, 0.18), 0 0 20px rgba(255, 159, 90, 0.5);
      touch-action: none;
      animation: targetPulse 0.72s ease-in-out infinite alternate;
    }

    .target.gold {
      background: var(--gold);
      box-shadow: 0 7px 0 rgba(0, 0, 0, 0.18), 0 0 26px rgba(255, 211, 95, 0.78);
    }

    @keyframes targetPulse {
      to {
        transform: translate(-50%, -50%) scale(0.9);
      }
    }

    .overlay {
      position: absolute;
      z-index: 10;
      inset: 0;
      display: grid;
      padding: 20px;
      place-items: center;
      text-align: center;
      background: rgba(8, 10, 28, 0.76);
      backdrop-filter: blur(5px);
    }

    .overlay-card {
      width: min(365px, 100%);
      padding: 24px 18px;
      border: 1px solid var(--line);
      border-radius: 26px;
      background: linear-gradient(145deg, #3d4379, #24284e);
      box-shadow: var(--shadow);
    }

    .overlay-card h2 {
      margin: 0 0 8px;
      font-size: 1.65rem;
    }

    .overlay-card p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.42;
    }

    .result-screen {
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .result-card {
      width: min(430px, 100%);
      padding: 25px 18px;
      border: 1px solid var(--line);
      border-radius: 29px;
      background: linear-gradient(145deg, #3c4173, #24274b);
      box-shadow: var(--shadow);
    }

    .result-card h1 {
      margin: 0;
      font-size: 2rem;
      letter-spacing: -0.06em;
    }

    .result-card > p {
      margin: 8px 0 17px;
      color: var(--muted);
    }

    .rankings {
      display: grid;
      gap: 8px;
      margin: 15px 0 18px;
      text-align: left;
    }

    .rank {
      display: flex;
      min-height: 50px;
      padding: 10px 13px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.08);
    }

    .rank:first-child {
      border: 1px solid rgba(255, 211, 95, 0.55);
      background: rgba(255, 211, 95, 0.18);
    }

    .rank span {
      color: var(--cyan);
      font-size: 0.85rem;
      font-weight: 850;
      text-align: right;
    }

    .modal {
      position: absolute;
      z-index: 50;
      inset: 0;
      display: none;
      padding: 20px;
      align-items: center;
      justify-content: center;
      background: rgba(4, 5, 16, 0.72);
      backdrop-filter: blur(6px);
    }

    .modal.show {
      display: flex;
    }

    .modal-card {
      width: min(390px, 100%);
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 26px;
      background: #2d315b;
      box-shadow: var(--shadow);
    }

    .modal-card h3 {
      margin: 0 0 8px;
    }

    .modal-card p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.42;
    }

    #toast {
      position: absolute;
      z-index: 80;
      bottom: calc(var(--safe-bottom) + 12px);
      left: 50%;
      max-width: calc(100% - 36px);
      padding: 11px 15px;
      border-radius: 999px;
      color: #18192d;
      font-size: 0.84rem;
      font-weight: 950;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      background: #f6f7ff;
      box-shadow: var(--shadow);
      transform: translate(-50%, 130px);
      transition: opacity 0.2s ease, transform 0.25s ease;
    }

    #toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    #rotate {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: none;
      padding: 28px;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: #101328;
    }

    #rotate strong {
      display: block;
      margin-bottom: 18px;
      font-size: 4rem;
      transform: rotate(90deg);
    }

    #rotate h2 {
      margin: 0 0 8px;
    }

    #rotate p {
      margin: 0;
      color: var(--muted);
    }

    .shake {
      animation: shake 0.35s ease both;
    }

    @keyframes shake {
      0%,
      100% {
        transform: translateX(0);
      }

      20% {
        transform: translateX(-10px);
      }

      40% {
        transform: translateX(10px);
      }

      60% {
        transform: translateX(-7px);
      }

      80% {
        transform: translateX(7px);
      }
    }

    @media (orientation: landscape) and (max-height: 650px) {
      #rotate {
        display: flex;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <div id="rotate">
    <div>
      <strong>▯</strong>
      <h2>Rotate your device</h2>
      <p>Thumb Arena is designed for portrait play.</p>
    </div>
  </div>

  <script>
    "use strict";

    const BASE_GAMES = [
      {
        id: "dodge",
        title: "Dodge Storm",
        icon: "☄",
        color: "#57e5ff",
        mode: "SOLO",
        description: "Drag your orb. Avoid incoming hazards."
      },
      {
        id: "trail",
        title: "Trail Duel",
        icon: "〰",
        color: "#ad7dff",
        mode: "PASS & PLAY",
        description: "Leave a trail. Do not crash."
      },
      {
        id: "target",
        title: "Target Rush",
        icon: "◎",
        color: "#ffd35f",
        mode: "PASS & PLAY",
        description: "Tap targets before they disappear."
      },
      {
        id: "hot",
        title: "Hot Cursor",
        icon: "●",
        color: "#ff6e97",
        mode: "PASS & PLAY",
        description: "Pass the bomb before time runs out."
      },
      {
        id: "reflex",
        title: "Reflex Shot",
        icon: "⚡",
        color: "#90ff6b",
        mode: "PASS & PLAY",
        description: "Wait, then tap at the perfect time."
      },
      {
        id: "wheel",
        title: "Survival Wheel",
        icon: "◉",
        color: "#ad7dff",
        mode: "SOLO",
        description: "Spin to select a Base Console game."
      }
    ];

    const ARENA_GAMES = [
      {
        id: "dodge2",
        title: "Dodge Storm 2",
        icon: "◉",
        color: "#57e5ff",
        mode: "PLAYABLE",
        description: "Pseudo-3D survival arena with hazards."
      },
      {
        id: "trail2",
        title: "Trail Duel 2",
        icon: "〰",
        color: "#ad7dff",
        mode: "PLAYABLE",
        description: "Energy trails, ramps, and arena danger."
      },
      {
        id: "target2",
        title: "Target Rush 2",
        icon: "◎",
        color: "#ffd35f",
        mode: "PLAYABLE",
        description: "3D-style target hunting with combos."
      },
      {
        id: "hot2",
        title: "Hot Cursor 2",
        icon: "●",
        color: "#ff6e97",
        mode: "PLAYABLE",
        description: "Core tag with obstacles and speed zones."
      },
      {
        id: "reflex2",
        title: "Reflex Shot 2",
        icon: "⚡",
        color: "#90ff6b",
        mode: "PLAYABLE",
        description: "Cinematic reaction challenge rounds."
      },
      {
        id: "wheel2",
        title: "Survival Wheel 2",
        icon: "◉",
        color: "#ad7dff",
        mode: "PLAYABLE",
        description: "Select a random playable Arena game."
      },
      {
        id: "quest",
        title: "Mini Quest",
        icon: "◇",
        color: "#57e5ff",
        mode: "PLAYABLE",
        description: "Small objective-driven arena adventure."
      },
      {
        id: "brawl",
        title: "Arena Brawl",
        icon: "✦",
        color: "#ff6e97",
        mode: "PLAYABLE",
        description: "Simple knockback party battle."
      },
      {
        id: "treasure",
        title: "Treasure Run",
        icon: "◆",
        color: "#ffd35f",
        mode: "PLAYABLE",
        description: "Find treasure and bring it home."
      },
      {
        id: "boss",
        title: "Boss Break",
        icon: "⚔",
        color: "#90ff6b",
        mode: "PLAYABLE",
        description: "Tiny cooperative boss arena."
      }
    ];

    const COLORS = ["#57e5ff", "#ff6e97", "#90ff6b", "#ffd35f"];
    const ROOM_ALPHABET = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";

    class StorageManager {
      constructor() {
        this.key = "thumbArenaCompleteV1";
        this.memoryOnly = false;
        this.data = this.load();
      }

      defaults() {
        return {
          settings: {
            sound: true,
            vibration: true,
            reducedEffects: false,
            performance: "auto"
          },
          base: {
            gamesPlayed: 0,
            wins: 0,
            longestSurvival: 0,
            targetHigh: 0,
            fastestReaction: null,
            reactionSum: 0,
            reactionCount: 0
          },
          arena: {
            gamesPlayed: 0,
            wins: 0,
            xp: 0,
            level: 1,
            dodgeStorm2Record: 0,
            profileTitle: "Rookie",
            unlocks: ["Neon Trail"]
          },
          tournament: null
        };
      }

      load() {
        const defaults = this.defaults();

        try {
          const raw = localStorage.getItem(this.key);
          if (!raw) return defaults;

          const stored = JSON.parse(raw);

          return {
            ...defaults,
            ...stored,
            settings: {
              ...defaults.settings,
              ...(stored.settings || {})
            },
            base: {
              ...defaults.base,
              ...(stored.base || {})
            },
            arena: {
              ...defaults.arena,
              ...(stored.arena || {})
            }
          };
        } catch {
          this.memoryOnly = true;
          return defaults;
        }
      }

      save() {
        try {
          localStorage.setItem(this.key, JSON.stringify(this.data));
        } catch {
          this.memoryOnly = true;
        }
      }

      recordGame(consoleType) {
        this.data[consoleType].gamesPlayed += 1;
        this.save();
      }

      recordWin(consoleType) {
        this.data[consoleType].wins += 1;
        this.save();
      }

      addXP(amount) {
        this.data.arena.xp += Math.max(0, Math.floor(amount));
        this.data.arena.level = Math.max(1, Math.floor(this.data.arena.xp / 100) + 1);

        if (this.data.arena.level >= 3 && !this.data.arena.unlocks.includes("Gold Sparks")) {
          this.data.arena.unlocks.push("Gold Sparks");
        }

        if (this.data.arena.level >= 5 && !this.data.arena.unlocks.includes("Storm Master")) {
          this.data.arena.unlocks.push("Storm Master");
          this.data.arena.profileTitle = "Storm Master";
        }

        this.save();
      }

      recordReaction(milliseconds) {
        const b = this.data.base;
        b.fastestReaction = b.fastestReaction === null
          ? milliseconds
          : Math.min(b.fastestReaction, milliseconds);
        b.reactionSum += milliseconds;
        b.reactionCount += 1;
        this.save();
      }

      averageReaction() {
        const b = this.data.base;
        return b.reactionCount > 0
          ? Math.round(b.reactionSum / b.reactionCount)
          : null;
      }

      resetStatistics() {
        const settings = { ...this.data.settings };
        this.data = this.defaults();
        this.data.settings = settings;
        this.save();
      }

      resetArenaProfile() {
        const arena = this.defaults().arena;
        this.data.arena = arena;
        this.save();
      }
    }

    class AudioManager {
      constructor(storage) {
        this.storage = storage;
        this.context = null;
      }

      sound(type = "click") {
        if (!this.storage.data.settings.sound) return;

        try {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;

          if (!this.context) {
            this.context = new AudioContextClass();
          }

          if (this.context.state === "suspended") {
            this.context.resume();
          }

          const map = {
            click: [460, 0.05, "sine"],
            start: [720, 0.11, "sine"],
            hit: [135, 0.16, "sawtooth"],
            win: [900, 0.16, "triangle"],
            point: [760, 0.06, "square"],
            gold: [1040, 0.09, "sine"]
          };

          const [frequency, duration, wave] = map[type] || map.click;

          const oscillator = this.context.createOscillator();
          const gain = this.context.createGain();

          oscillator.type = wave;
          oscillator.frequency.setValueAtTime(frequency, this.context.currentTime);

          gain.gain.setValueAtTime(0.075, this.context.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            0.001,
            this.context.currentTime + duration
          );

          oscillator.connect(gain).connect(this.context.destination);
          oscillator.start();
          oscillator.stop(this.context.currentTime + duration);
        } catch {}
      }

      vibrate(pattern = 16) {
        if (!this.storage.data.settings.vibration) return;

        try {
          if ("vibrate" in navigator) {
            navigator.vibrate(pattern);
          }
        } catch {}
      }
    }

    class InputManager {
      attach(element, handlers = {}) {
        let active = false;
        let pointerId = null;
        let startX = 0;
        let startY = 0;

        const point = event => {
          const rect = element.getBoundingClientRect();
          return {
            x: Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width)),
            y: Math.max(0, Math.min(1, (event.clientY - rect.top) / rect.height))
          };
        };

        const onDown = event => {
          event.preventDefault();
          active = true;
          pointerId = event.pointerId;

          const p = point(event);
          startX = p.x;
          startY = p.y;

          element.setPointerCapture?.(pointerId);

          handlers.down?.({
            ...p,
            pressed: true,
            released: false,
            tap: false
          });
        };

        const onMove = event => {
          if (!active || event.pointerId !== pointerId) return;

          event.preventDefault();
          const p = point(event);

          handlers.move?.({
            ...p,
            pressed: true,
            released: false,
            tap: false
          });
        };

        const onUp = event => {
          if (!active || event.pointerId !== pointerId) return;

          event.preventDefault();
          const p = point(event);
          active = false;

          handlers.up?.({
            ...p,
            pressed: false,
            released: true,
            tap: Math.hypot(p.x - startX, p.y - startY) < 0.04
          });
        };

        element.addEventListener("pointerdown", onDown, { passive: false });
        element.addEventListener("pointermove", onMove, { passive: false });
        element.addEventListener("pointerup", onUp, { passive: false });
        element.addEventListener("pointercancel", onUp, { passive: false });

        return () => {
          element.removeEventListener("pointerdown", onDown);
          element.removeEventListener("pointermove", onMove);
          element.removeEventListener("pointerup", onUp);
          element.removeEventListener("pointercancel", onUp);
        };
      }
    }

    class LocalPartyManager {
      constructor() {
        this.party = null;
      }

      randomId(length = 16) {
        const bytes = new Uint8Array(length);
        crypto.getRandomValues(bytes);

        return btoa(String.fromCharCode(...bytes))
          .replace(/\+/g, "-")
          .replace(/\//g, "_")
          .replace(/=+$/g, "");
      }

      roomCode(length = 6) {
        const bytes = new Uint8Array(length);
        crypto.getRandomValues(bytes);

        return Array.from(bytes, value => {
          return ROOM_ALPHABET[value % ROOM_ALPHABET.length];
        }).join("");
      }

      create(limit = 4) {
        this.party = {
          sessionId: this.randomId(16),
          token: this.randomId(16),
          hostSecret: this.randomId(16),
          roomCode: this.roomCode(),
          playerLimit: limit,
          expiresAt: Date.now() + 10 * 60 * 1000,
          players: [
            {
              id: this.randomId(10),
              slot: 1,
              name: "Host",
              color: COLORS[0],
              host: true,
              connected: true
            }
          ]
        };

        return this.party;
      }

      end() {
        this.party = null;
      }
    }
