<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"
  >
  <meta name="theme-color" content="#101328">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Thumb Arena">
  <title>Thumb Arena</title>

  <style>
    :root {
      --bg: #101328;
      --bg2: #25194d;
      --panel: rgba(40, 44, 85, 0.96);
      --panel-light: rgba(255, 255, 255, 0.09);
      --line: rgba(255, 255, 255, 0.14);
      --text: #f8f9ff;
      --muted: #bcc3e7;
      --cyan: #57e5ff;
      --pink: #ff6e97;
      --green: #90ff6b;
      --gold: #ffd35f;
      --purple: #ad7dff;
      --orange: #ff9f5a;
      --danger: #ff5372;
      --safe-top: max(12px, env(safe-area-inset-top));
      --safe-bottom: max(12px, env(safe-area-inset-bottom));
      --shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #060713;
      color: var(--text);
      font-family: ui-rounded, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 560px;
      margin: 0 auto;
      overflow: hidden;
      background:
        radial-gradient(circle at 12% 10%, rgba(87, 229, 255, 0.17), transparent 30%),
        radial-gradient(circle at 90% 22%, rgba(173, 125, 255, 0.18), transparent 30%),
        linear-gradient(155deg, var(--bg), var(--bg2));
    }

    #app::before,
    #app::after {
      position: absolute;
      z-index: 0;
      width: 175px;
      height: 175px;
      content: "";
      border-radius: 50%;
      opacity: 0.16;
      pointer-events: none;
      filter: blur(3px);
      animation: floatBlob 9s ease-in-out infinite;
    }

    #app::before {
      top: -76px;
      left: -76px;
      background: var(--cyan);
    }

    #app::after {
      right: -75px;
      bottom: -75px;
      background: var(--purple);
      animation-delay: -4s;
    }

    @keyframes floatBlob {
      50% {
        transform: translate(17px, 16px) scale(1.08);
      }
    }

    .screen {
      position: absolute;
      z-index: 2;
      inset: 0;
      display: none;
      overflow-x: hidden;
      overflow-y: auto;
      padding: var(--safe-top) 18px var(--safe-bottom);
    }

    .screen.active {
      display: flex;
      flex-direction: column;
      animation: screenIn 0.24s ease both;
    }

    @keyframes screenIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .center {
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .console-shell {
      display: flex;
      width: min(370px, 100%);
      min-height: 310px;
      padding: 30px 22px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 2px solid rgba(255, 255, 255, 0.16);
      border-radius: 36px;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.03)),
        #575b74;
      box-shadow: inset 0 3px 2px rgba(255, 255, 255, 0.18), var(--shadow);
    }

    .brand {
      margin: 0;
      font-size: clamp(2.65rem, 14vw, 4.8rem);
      line-height: 0.86;
      letter-spacing: -0.1em;
      text-shadow: 0 5px 0 rgba(0, 0, 0, 0.18);
    }

    .brand span {
      color: var(--cyan);
    }

    .tagline {
      margin: 14px 0 28px;
      color: var(--muted);
    }

    .disc {
      display: grid;
      width: 132px;
      height: 132px;
      margin-bottom: 25px;
      place-items: center;
      border: 10px solid #282b43;
      border-radius: 50%;
      color: #17182b;
      font-size: 2rem;
      background:
        radial-gradient(circle at center, #242740 0 14%, transparent 15%),
        repeating-conic-gradient(
          #ff6e97 0 36deg,
          #ffd35f 36deg 72deg,
          #57e5ff 72deg 108deg,
          #ad7dff 108deg 144deg,
          #90ff6b 144deg 180deg
        );
      box-shadow: 0 13px 22px rgba(0, 0, 0, 0.35), inset 0 0 0 2px rgba(255, 255, 255, 0.4);
      animation: spinDisc 8s linear infinite;
    }

    @keyframes spinDisc {
      to {
        transform: rotate(360deg);
      }
    }

    .btn {
      width: 100%;
      min-height: 54px;
      padding: 13px 16px;
      border-radius: 18px;
      color: #13152a;
      font-weight: 950;
      letter-spacing: 0.04em;
      background: var(--cyan);
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.22), 0 12px 21px rgba(0, 0, 0, 0.18);
      transition: transform 0.12s ease, filter 0.12s ease;
    }

    .btn:active {
      transform: translateY(4px);
      filter: brightness(0.92);
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.22);
    }

    .btn.secondary {
      color: #242644;
      background: #f0f2ff;
    }

    .btn.dark {
      color: var(--text);
      background: #3a3e69;
    }

    .btn.green {
      color: #112715;
      background: var(--green);
    }

    .btn.warn {
      color: #37101d;
      background: var(--pink);
    }

    .btn-row {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .btn-row .btn {
      flex: 1;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .topbar h2,
    .topbar p {
      margin: 0;
    }

    .topbar h2 {
      font-size: 1.3rem;
      letter-spacing: -0.04em;
    }

    .topbar p {
      margin-top: 3px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .icon-btn {
      display: grid;
      width: 48px;
      height: 48px;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 15px;
      color: var(--text);
      font-size: 1.18rem;
      background: var(--panel);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
    }

    .card,
    .panel {
      border: 1px solid var(--line);
      border-radius: 24px;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.13), rgba(255, 255, 255, 0.035)),
        var(--panel);
      box-shadow: var(--shadow);
    }

    .card {
      min-height: 174px;
      padding: 16px;
      text-align: left;
    }

    .card.wide {
      grid-column: 1 / -1;
      min-height: 132px;
    }

    .card:active {
      transform: scale(0.98);
    }

    .card-icon {
      display: grid;
      width: 58px;
      height: 58px;
      margin-bottom: 12px;
      place-items: center;
      border-radius: 19px;
      color: #15172b;
      font-size: 1.65rem;
      box-shadow: inset 0 2px 6px rgba(255, 255, 255, 0.42);
    }

    .card h3 {
      margin: 0 0 5px;
      font-size: 1rem;
      line-height: 1.04;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.76rem;
      line-height: 1.28;
    }

    .badge {
      display: inline-block;
      margin-top: 11px;
      padding: 4px 8px;
      border-radius: 999px;
      color: #16172b;
      font-size: 0.64rem;
      font-weight: 950;
      background: #eff1ff;
    }

    .badge.green {
      background: var(--green);
    }

    .badge.gold {
      background: var(--gold);
    }

    .badge.dim {
      color: #eef0ff;
      background: #555b84;
    }

    .panel {
      padding: 18px;
    }

    .panel h3 {
      margin: 0 0 9px;
      font-size: 1.08rem;
    }

    .panel p {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.42;
    }

    .list {
      display: grid;
      gap: 10px;
    }

    .row {
      display: flex;
      min-height: 56px;
      padding: 11px 13px;
      align-items: center;
      justify-content: space-between;
      gap: 11px;
      border-radius: 16px;
      background: var(--panel-light);
    }

    .row strong,
    .row small {
      display: block;
    }

    .row small {
      margin-top: 3px;
      color: var(--muted);
    }

    .slot {
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .slot-dot {
      width: 14px;
      height: 14px;
      margin-right: 10px;
      flex: 0 0 auto;
      border: 2px solid rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      background: transparent;
    }

    .slot-dot.active {
      box-shadow: 0 0 13px rgba(144, 255, 107, 0.8);
    }

    .label {
      display: block;
      margin: 14px 0 7px;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .input {
      width: 100%;
      min-height: 50px;
      padding: 12px 13px;
      border: 1px solid var(--line);
      border-radius: 15px;
      outline: none;
      color: var(--text);
      background: #25294c;
      user-select: text;
      -webkit-user-select: text;
    }

    .numbers {
      display: flex;
      gap: 8px;
      margin: 9px 0 15px;
    }

    .number-btn {
      display: grid;
      width: 52px;
      height: 48px;
      place-items: center;
      border-radius: 15px;
      color: var(--text);
      font-weight: 950;
      background: #3d426c;
    }

    .number-btn.active {
      color: #14233a;
      background: var(--cyan);
    }

    .notice {
      margin: 14px 0;
      padding: 12px 13px;
      border: 1px solid rgba(87, 229, 255, 0.32);
      border-radius: 15px;
      color: #cdf9ff;
      font-size: 0.82rem;
      line-height: 1.42;
      background: rgba(87, 229, 255, 0.09);
    }

    .modal {
      position: absolute;
      z-index: 50;
      inset: 0;
      display: none;
      padding: 20px;
      align-items: center;
      justify-content: center;
      background: rgba(4, 5, 16, 0.72);
      backdrop-filter: blur(6px);
    }

    .modal.show {
      display: flex;
    }

    .modal-card {
      width: min(390px, 100%);
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 26px;
      background: #2d315b;
      box-shadow: var(--shadow);
    }

    .modal-card h3 {
      margin: 0 0 8px;
    }

    .modal-card p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.42;
    }

    #toast {
      position: absolute;
      z-index: 80;
      bottom: calc(var(--safe-bottom) + 12px);
      left: 50%;
      max-width: calc(100% - 36px);
      padding: 11px 15px;
      border-radius: 999px;
      color: #18192d;
      font-size: 0.84rem;
      font-weight: 950;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      background: #f6f7ff;
      box-shadow: var(--shadow);
      transform: translate(-50%, 130px);
      transition: opacity 0.2s ease, transform 0.25s ease;
    }

    #toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    #rotate {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: none;
      padding: 28px;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: #101328;
    }

    #rotate strong {
      display: block;
      margin-bottom: 18px;
      font-size: 4rem;
      transform: rotate(90deg);
    }

    #rotate h2 {
      margin: 0 0 8px;
    }

    #rotate p {
      margin: 0;
      color: var(--muted);
    }

    @media (orientation: landscape) and (max-height: 650px) {
      #rotate {
        display: flex;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

    class StorageManager {
      constructor() {
        this.key = "thumbArenaLauncherV1";
        this.memoryOnly = false;
        this.data = this.load();
      }

      defaults() {
        return {
          settings: {
            sound: true,
            vibration: true,
            reducedEffects: false
          },
          baseStats: {
            gamesPlayed: 0,
            wins: 0,
            longestSurvival: 0,
            targetRushHigh: 0,
            fastestReaction: null
          },
          arenaProfile: {
            level: 1,
            xp: 0,
            selectedTitle: "Rookie",
            records: {
              dodgeStorm2: 0,
              trailDuel2: 0,
              miniQuest: 0,
              arenaBrawl: 0,
              treasureRun: 0,
              bossBreak: 0
            }
          }
        };
      }

      load() {
        const defaults = this.defaults();

        try {
          const raw = localStorage.getItem(this.key);

          if (!raw) return defaults;

          const saved = JSON.parse(raw);

          return {
            ...defaults,
            ...saved,
            settings: {
              ...defaults.settings,
              ...(saved.settings || {})
            },
            baseStats: {
              ...defaults.baseStats,
              ...(saved.baseStats || {})
            },
            arenaProfile: {
              ...defaults.arenaProfile,
              ...(saved.arenaProfile || {}),
              records: {
                ...defaults.arenaProfile.records,
                ...((saved.arenaProfile || {}).records || {})
              }
            }
          };
        } catch {
          this.memoryOnly = true;
          return defaults;
        }
      }

      save() {
        try {
          localStorage.setItem(this.key, JSON.stringify(this.data));
        } catch {
          this.memoryOnly = true;
        }
      }

      addArenaXP(amount) {
        this.data.arenaProfile.xp += Math.max(0, Math.floor(amount));
        this.data.arenaProfile.level = Math.max(
          1,
          Math.floor(this.data.arenaProfile.xp / 100) + 1
        );

        if (this.data.arenaProfile.level >= 5) {
          this.data.arenaProfile.selectedTitle = "Storm Master";
        }

        this.save();
      }
    }

    class AudioManager {
      constructor(storage) {
        this.storage = storage;
        this.context = null;
      }

      play(type = "click") {
        if (!this.storage.data.settings.sound) return;

        try {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;

          if (!AudioContextClass) return;

          if (!this.context) {
            this.context = new AudioContextClass();
          }

          if (this.context.state === "suspended") {
            this.context.resume();
          }

          const soundMap = {
            click: [480, 0.05, "sine"],
            start: [720, 0.1, "sine"],
            hit: [135, 0.16, "sawtooth"],
            win: [900, 0.16, "triangle"]
          };

          const [frequency, duration, typeName] = soundMap[type] || soundMap.click;
          const oscillator = this.context.createOscillator();
          const gain = this.context.createGain();

          oscillator.type = typeName;
          oscillator.frequency.setValueAtTime(frequency, this.context.currentTime);

          gain.gain.setValueAtTime(0.07, this.context.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            0.001,
            this.context.currentTime + duration
          );

          oscillator.connect(gain).connect(this.context.destination);
          oscillator.start();
          oscillator.stop(this.context.currentTime + duration);
        } catch {}
      }

      vibrate(pattern = 16) {
        if (!this.storage.data.settings.vibration) return;

        try {
          navigator.vibrate?.(pattern);
        } catch {}
      }
    }

    class UIManager {
      constructor(app, storage, audio) {
        this.app = app;
        this.storage = storage;
        this.audio = audio;
        this.toastTimer = null;
      }

      escape(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      render(html, className = "") {
        this.app.innerHTML = `
          <main class="screen active ${className}">
            ${html}
          </main>
          <div id="modal" class="modal"></div>
          <div id="toast"></div>
        `;
      }

      bind(selector, callback) {
        const element = this.app.querySelector(selector);

        if (element) {
          element.addEventListener("click", callback);
        }

        return element;
      }

      toast(message) {
        const toast = this.app.querySelector("#toast");

        if (!toast) return;

        toast.textContent = message;
        toast.classList.add("show");

        clearTimeout(this.toastTimer);

        this.toastTimer = setTimeout(() => {
          toast.classList.remove("show");
        }, 1800);
      }

      modal(title, text, confirmLabel, onConfirm, warning = false) {
        const modal = this.app.querySelector("#modal");

        modal.innerHTML = `
          <div class="modal-card">
            <h3>${this.escape(title)}</h3>
            <p>${this.escape(text)}</p>
            <div class="btn-row">
              <button id="modalCancel" class="btn secondary">CANCEL</button>
              <button id="modalConfirm" class="btn ${warning ? "warn" : ""}">
                ${this.escape(confirmLabel)}
              </button>
            </div>
          </div>
        `;

        modal.classList.add("show");

        modal.querySelector("#modalCancel").onclick = () => {
          modal.classList.remove("show");
        };

        modal.querySelector("#modalConfirm").onclick = () => {
          modal.classList.remove("show");
          onConfirm?.();
        };
      }

      boot() {
        this.render(`
          <section class="center" style="min-height:100%">
            <div class="console-shell">
              <div class="disc">◉</div>
              <h1 class="brand">THUMB <span>ARENA</span></h1>
              <p class="tagline">Tiny games. Big thumb battles.</p>
              <button id="enterButton" class="btn">ENTER</button>
              <p style="margin:15px 0 0;font-size:.72rem;font-weight:900">
                OFFLINE • ONE DEVICE • PASS & PLAY
              </p>
            </div>
          </section>
        `, "center");

        this.bind("#enterButton", () => {
          this.audio.play("start");
          this.home();
        });
      }

      home() {
        this.render(`
          <div class="topbar">
            <div>
              <h2>Thumb Arena</h2>
              <p>Offline same-device party console.</p>
            </div>
            <button id="settingsButton" class="icon-btn">⚙</button>
          </div>

          <section class="grid">
            <button id="soloButton" class="card">
              <div class="card-icon" style="background:var(--cyan)">▶</div>
              <h3>Play Solo</h3>
              <p>Quick offline thumb games for one player.</p>
              <span class="badge green">OFFLINE</span>
            </button>

            <button id="passButton" class="card">
              <div class="card-icon" style="background:var(--purple)">↔</div>
              <h3>Pass & Play</h3>
              <p>Take turns using the same device.</p>
              <span class="badge green">2–4 PLAYERS</span>
            </button>

            <button id="aboutButton" class="card wide">
              <div class="card-icon" style="background:var(--gold)">◈</div>
              <h3>Arena T-Engine</h3>
              <p>Eight-direction movement and virtual look-camera games remain accessible through the Arena Console.</p>
              <span class="badge gold">T-ENGINE ROUTED</span>
            </button>
          </section>

          <div style="height:14px"></div>
          <button id="powerButton" class="btn dark">⏻ POWER OFF</button>
        `);

        this.bind("#settingsButton", () => this.settings());
        this.bind("#soloButton", () => this.consoleSelect("solo"));
        this.bind("#passButton", () => this.consoleSelect("pass"));

        this.bind("#aboutButton", () => {
          this.modal(
            "T-Engine Games",
            "Trail Duel 2, Mini Quest, Arena Brawl, Treasure Run, and Boss Break route to t-engine.html so their eight-direction renderer stays separate from the main console.",
            "OK",
            () => {}
          );
        });

        this.bind("#powerButton", () => this.boot());
      }

      consoleSelect(mode) {
        this.render(`
          <div class="topbar">
            <button id="backButton" class="icon-btn">←</button>
            <div style="text-align:right">
              <h2>Select Console</h2>
              <p>${mode === "solo" ? "Solo mode" : "Pass & Play mode"}</p>
            </div>
          </div>

          <section class="grid">
            <button id="baseButton" class="card">
              <div class="card-icon" style="background:var(--cyan)">▦</div>
              <h3>Base Console</h3>
              <p>Fast 2D arcade mini-games.</p>
              <span class="badge green">LIGHTWEIGHT 2D</span>
            </button>

            <button id="arenaButton" class="card">
              <div class="card-icon" style="background:var(--purple)">◈</div>
              <h3>Arena Console</h3>
              <p>Low-poly style and T-engine mini-games.</p>
              <span class="badge gold">PSEUDO-3D</span>
            </button>
          </section>
        `);

        this.bind("#backButton", () => this.home());
        this.bind("#baseButton", () => this.library("base", mode));
        this.bind("#arenaButton", () => this.library("arena", mode));
      }

      library(consoleType, mode) {
        const games = consoleType === "base" ? BASE_GAMES : ARENA_GAMES;

        const usableGames = mode === "solo"
          ? games.filter(game => game.players.includes("SOLO"))
          : games;

        this.render(`
          <div class="topbar">
            <button id="backButton" class="icon-btn">←</button>
            <div style="text-align:right">
              <h2>${consoleType === "base" ? "Base Console" : "Arena Console"}</h2>
              <p>Select a game disc.</p>
            </div>
          </div>

          <section class="grid">
            ${usableGames.map(game => `
              <button class="card" data-game="${game.id}">
                <div class="card-icon" style="background:${game.color}">${game.icon}</div>
                <h3>${this.escape(game.title)}</h3>
                <p>${this.escape(game.description)}</p>
                <span class="badge ${game.route === "t-engine" ? "gold" : "green"}">
                  ${game.route === "t-engine" ? "T-ENGINE" : game.players}
                </span>
              </button>
            `).join("")}
          </section>
        `);

        this.bind("#backButton", () => this.consoleSelect(mode));

        this.app.querySelectorAll("[data-game]").forEach(button => {
          button.addEventListener("click", () => {
            this.setupGame(button.dataset.game, consoleType, mode);
          });
        });
      }

      setupGame(gameId, consoleType, mode) {
        const game = [...BASE_GAMES, ...ARENA_GAMES].find(item => item.id === gameId);

        const soloOnly = ["dodge", "dodge2"].includes(gameId);
        const supportsPassPlay = !soloOnly && !["wheel", "wheel2"].includes(gameId);
        const passPlay = mode === "pass" && supportsPassPlay;

        this.render(`
          <div class="topbar">
            <button id="backButton" class="icon-btn">←</button>
            <div style="text-align:right">
              <h2>${this.escape(game.title)}</h2>
              <p>${game.route === "t-engine" ? "T-engine setup" : "Game setup"}</p>
            </div>
          </div>

          <section class="panel">
            <h3>${game.route === "t-engine" ? "Eight-Direction Controls" : "Ready to Play?"}</h3>

            <p>
              ${
                game.route === "t-engine"
                  ? "This game uses an eight-direction movement pad and a virtual look-camera. It opens through the dedicated T-engine screen."
                  : "This game runs directly inside the main Thumb Arena console."
              }
            </p>

            ${
              passPlay
                ? `
                  <label class="label">Players</label>
                  <div class="numbers">
                    <button class="number-btn active" data-count="2">2</button>
                    <button class="number-btn" data-count="3">3</button>
                    <button class="number-btn" data-count="4">4</button>
                  </div>
                  <div id="playerFields"></div>
                `
                : `
                  <div class="row">
                    <div>
                      <strong>Solo Mode</strong>
                      <small>One thumb. One device.</small>
                    </div>
                    <strong>1 PLAYER</strong>
                  </div>
                `
            }

            <div style="height:15px"></div>
            <button id="startButton" class="btn">
              ${game.route === "t-engine" ? "OPEN T-ENGINE GAME" : "START"}
            </button>
          </section>
        `);

        let count = 2;

        const drawPlayerFields = () => {
          const fields = this.app.querySelector("#playerFields");
          if (!fields) return;

          fields.innerHTML = Array.from({ length: count }, (_, index) => `
            <label class="label">Player ${index + 1}</label>
            <input class="input playerName" maxlength="14" value="Player ${index + 1}">
          `).join("");
        };

        if (passPlay) {
          drawPlayerFields();

          this.app.querySelectorAll("[data-count]").forEach(button => {
            button.addEventListener("click", () => {
              count = Number(button.dataset.count);

              this.app.querySelectorAll("[data-count]").forEach(item => {
                item.classList.toggle("active", item === button);
              });

              drawPlayerFields();
            });
          });
        }

        this.bind("#backButton", () => this.library(consoleType, mode));

        this.bind("#startButton", () => {
          const players = passPlay
            ? [...this.app.querySelectorAll(".playerName")].map((input, index) => ({
                id: `local-${index + 1}`,
                name: input.value.trim() || `Player ${index + 1}`,
                color: PLAYER_COLORS[index]
              }))
            : [{
                id: "local-1",
                name: "Player 1",
                color: PLAYER_COLORS[0]
              }];

          if (game.route === "t-engine") {
            this.routeToTEngine(gameId, players);
          } else {
            this.modal(
              "Built-In Game",
              `${game.title} remains in the main console implementation. Keep its current game class here or route it later if its code becomes large.`,
              "OK",
              () => {}
            );
          }
        });
      }

      routeToTEngine(gameId, players) {
        const payload = encodeURIComponent(
          btoa(unescape(encodeURIComponent(JSON.stringify(players))))
        );

        const url = `t-engine.html?game=${encodeURIComponent(gameId)}&players=${payload}`;

        window.location.href = url;
      }

      settings() {
        const settings = this.storage.data.settings;

        this.render(`
          <div class="topbar">
            <button id="backButton" class="icon-btn">←</button>
            <div style="text-align:right">
              <h2>Settings</h2>
              <p>Local device preferences</p>
            </div>
          </div>

          <section class="panel">
            <div class="list">
              <div class="row">
                <div>
                  <strong>Sound</strong>
                  <small>Generated arcade beeps</small>
                </div>
                <button id="soundButton" class="btn" style="width:auto;min-height:42px;padding:8px 12px">
                  ${settings.sound ? "ON" : "OFF"}
                </button>
              </div>

              <div class="row">
                <div>
                  <strong>Vibration</strong>
                  <small>Compatible devices only</small>
                </div>
                <button id="vibrationButton" class="btn" style="width:auto;min-height:42px;padding:8px 12px">
                  ${settings.vibration ? "ON" : "OFF"}
                </button>
              </div>

              <div class="row">
                <div>
                  <strong>Reduced Effects</strong>
                  <small>Lower visual movement</small>
                </div>
                <button id="effectsButton" class="btn" style="width:auto;min-height:42px;padding:8px 12px">
                  ${settings.reducedEffects ? "ON" : "OFF"}
                </button>
              </div>

              <div class="row">
                <div>
                  <strong>Storage</strong>
                  <small>Records stay in this browser</small>
                </div>
                <strong>${this.storage.memoryOnly ? "MEMORY" : "LOCAL"}</strong>
              </div>
            </div>

            <div style="height:15px"></div>
            <button id="homeButton" class="btn secondary">RETURN HOME</button>
          </section>
        `);

        this.bind("#backButton", () => this.home());

        this.bind("#soundButton", () => {
          this.storage.data.settings.sound = !settings.sound;
          this.storage.save();
          this.audio.play("click");
          this.settings();
        });

        this.bind("#vibrationButton", () => {
          this.storage.data.settings.vibration = !settings.vibration;
          this.storage.save();
          this.audio.vibrate(20);
          this.settings();
        });

        this.bind("#effectsButton", () => {
          this.storage.data.settings.reducedEffects = !settings.reducedEffects;
          this.storage.save();
          this.settings();
        });

        this.bind("#homeButton", () => this.home());
      }
    }

    class App {
      constructor() {
        this.storage = new StorageManager();
        this.audio = new AudioManager(this.storage);
        this.ui = new UIManager(
          document.querySelector("#app"),
          this.storage,
          this.audio
        );

        document.addEventListener("contextmenu", event => event.preventDefault());
        this.ui.boot();
      }
    }

    new App();
  </script>
</body>
</html>
